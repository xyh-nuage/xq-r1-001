name: ark-plan-api-smoke

on:
  push:
    branches:
      - probe/ark-coding-api-smoke-001
    paths:
      - .github/workflows/ark_coding_api_smoke.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    environment: ark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARK_API_KEY_DIRECT: ${{ secrets.ARK_API_KEY }}
      ARK_API_KEY_GENERIC: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Probe Ark plan endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/ark_probe.txt
          import json, os, urllib.error, urllib.request

          key = os.environ.get("ARK_API_KEY_DIRECT") or os.environ.get("ARK_API_KEY_GENERIC")
          if not key:
              raise SystemExit("ARK_KEY=MISSING")

          bases = {
              "coding": "https://ark.cn-beijing.volces.com/api/coding/v3",
              "plan": "https://ark.cn-beijing.volces.com/api/plan/v3",
          }
          headers = {"Authorization": f"Bearer {key}", "Content-Type": "application/json"}

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", errors="replace")
              except Exception as e:
                  return -1, f"{type(e).__name__}: {e}"

          def load(body):
              try: return json.loads(body)
              except Exception: return None

          def show_error(data, body):
              if isinstance(data, dict) and data.get("error"):
                  print("error=", data.get("error"))
              elif body:
                  print("body_preview=", body[:700].replace(key, "***"))

          for label, base in bases.items():
              print(f"=== {label} GET /models ===")
              status, body = request("GET", base + "/models")
              print("status=", status)
              data = load(body)
              if isinstance(data, dict) and isinstance(data.get("data"), list):
                  ids = [x.get("id") for x in data["data"] if isinstance(x, dict) and x.get("id")]
                  print("deepseek_ids=", [x for x in ids if "deepseek" in x.lower()])
              else:
                  show_error(data, body)

          for label, base in bases.items():
              for model in ("deepseek-v4-flash", "deepseek-v4-pro"):
                  print(f"=== {label} POST /chat/completions model={model} ===")
                  status, body = request("POST", base + "/chat/completions", {
                      "model": model,
                      "messages": [{"role": "user", "content": "Reply exactly PONG."}],
                      "stream": False,
                      "max_tokens": 16,
                  })
                  print("status=", status)
                  data = load(body)
                  if isinstance(data, dict) and status < 400:
                      choices = data.get("choices") or []
                      msg = choices[0].get("message") if choices and isinstance(choices[0], dict) else {}
                      print("object=", data.get("object"))
                      print("model=", data.get("model"))
                      print("content=", msg.get("content") if isinstance(msg, dict) else None)
                      print("usage=", data.get("usage"))
                  else:
                      show_error(data, body)

          for label, base in bases.items():
              print(f"=== {label} POST /responses model=deepseek-v4-flash ===")
              status, body = request("POST", base + "/responses", {
                  "model": "deepseek-v4-flash",
                  "input": "Reply exactly PONG.",
                  "max_output_tokens": 16,
              })
              print("status=", status)
              data = load(body)
              if isinstance(data, dict) and status < 400:
                  text = data.get("output_text")
                  if text is None:
                      for item in data.get("output") or []:
                          if isinstance(item, dict):
                              for part in item.get("content") or []:
                                  if isinstance(part, dict) and part.get("text"):
                                      text = part["text"]
                                      break
                          if text: break
                  print("object=", data.get("object"))
                  print("model=", data.get("model"))
                  print("status_field=", data.get("status"))
                  print("output_text=", text)
                  print("usage=", data.get("usage"))
              else:
                  show_error(data, body)
          PY

      - name: Publish sanitized probe result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="probe step failed before a report was produced"
          [ ! -f /tmp/ark_probe.txt ] || body="$(cat /tmp/ark_probe.txt)"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "ark-plan-api-smoke:${GITHUB_RUN_ID}" \
            --body "\`\`\`text
          ${body}
          \`\`\`"
