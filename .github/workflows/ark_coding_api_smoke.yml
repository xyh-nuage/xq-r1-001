name: ark-doubao-seed-text-smoke

on:
  push:
    branches:
      - probe/ark-coding-api-smoke-001
    paths:
      - .github/workflows/ark_coding_api_smoke.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    environment: ark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARK_API_KEY_DIRECT: ${{ secrets.ARK_API_KEY }}
      ARK_API_KEY_GENERIC: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Probe current Doubao Seed text models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/ark_probe.txt
          import json, os, urllib.error, urllib.request

          key = os.environ.get("ARK_API_KEY_DIRECT") or os.environ.get("ARK_API_KEY_GENERIC")
          if not key:
              raise SystemExit("ARK_KEY=MISSING")
          headers = {"Authorization": f"Bearer {key}", "Content-Type": "application/json"}

          def req(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              r = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=60) as resp:
                      return resp.status, resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", errors="replace")
              except Exception as e:
                  return -1, f"{type(e).__name__}: {e}"

          def parse(body):
              try: return json.loads(body)
              except Exception: return None

          status, body = req("GET", "https://ark.cn-beijing.volces.com/api/v3/models")
          data = parse(body)
          ids = []
          if isinstance(data, dict) and isinstance(data.get("data"), list):
              ids = [x.get("id") for x in data["data"] if isinstance(x, dict) and x.get("id")]

          text_seed = []
          for mid in ids:
              low = mid.lower()
              if not low.startswith("doubao-seed"):
                  continue
              if any(x in low for x in ("seedance", "seedream", "vision", "image", "video", "audio", "embedding")):
                  continue
              text_seed.append(mid)
          print("catalog_http=", status)
          print("doubao_seed_text_catalog=", text_seed)

          preferred = [
              "doubao-seed-2-0-lite-260215",
              "doubao-seed-2-0-pro-260215",
              "doubao-seed-1-8-251228",
              "doubao-seed-1-6-250615",
              "doubao-seed-1-6-lite-250828",
              "doubao-seed-evolving",
          ]
          selected = [m for m in preferred if m in ids]
          for mid in reversed(text_seed):
              if mid not in selected:
                  selected.append(mid)
              if len(selected) >= 8:
                  break
          print("selected=", selected)

          chat_url = "https://ark.cn-beijing.volces.com/api/v3/chat/completions"
          usable = []
          for model in selected:
              status, body = req("POST", chat_url, {
                  "model": model,
                  "messages": [{"role": "user", "content": "Reply exactly OK."}],
                  "stream": False,
                  "max_tokens": 32,
              })
              data = parse(body)
              code = msg = content = returned = None
              if isinstance(data, dict):
                  returned = data.get("model")
                  err = data.get("error")
                  if isinstance(err, dict):
                      code = err.get("code")
                      msg = err.get("message")
                  choices = data.get("choices") or []
                  if choices and isinstance(choices[0], dict):
                      m = choices[0].get("message") or {}
                      if isinstance(m, dict):
                          content = m.get("content")
              ok = 200 <= status < 300
              if ok:
                  usable.append(model)
              print(json.dumps({
                  "model": model, "http": status, "usable": ok,
                  "returned_model": returned,
                  "content": content[:80] if isinstance(content, str) else content,
                  "error_code": code,
                  "error_message": msg[:220] if isinstance(msg, str) else msg,
              }, ensure_ascii=False))
          print("usable_models=", usable)
          print("usable_count=", len(usable))
          PY

      - name: Publish sanitized probe result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="probe step failed before a report was produced"
          [ ! -f /tmp/ark_probe.txt ] || body="$(cat /tmp/ark_probe.txt)"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "ark-doubao-seed-text-smoke:${GITHUB_RUN_ID}" \
            --body "\`\`\`text
          ${body}
          \`\`\`"
