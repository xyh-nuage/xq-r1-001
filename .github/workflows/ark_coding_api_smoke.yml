name: ark-online-mainstream-model-smoke

on:
  push:
    branches:
      - probe/ark-coding-api-smoke-001
    paths:
      - .github/workflows/ark_coding_api_smoke.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    environment: ark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARK_API_KEY_DIRECT: ${{ secrets.ARK_API_KEY }}
      ARK_API_KEY_GENERIC: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Probe mainstream Ark models from live catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/ark_probe.txt
          import json, os, urllib.error, urllib.request

          key = os.environ.get("ARK_API_KEY_DIRECT") or os.environ.get("ARK_API_KEY_GENERIC")
          if not key:
              raise SystemExit("ARK_KEY=MISSING")
          headers = {"Authorization": f"Bearer {key}", "Content-Type": "application/json"}

          def req(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              r = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=90) as resp:
                      return resp.status, resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", errors="replace")
              except Exception as e:
                  return -1, f"{type(e).__name__}: {e}"

          def parse(body):
              try: return json.loads(body)
              except Exception: return None

          status, body = req("GET", "https://ark.cn-beijing.volces.com/api/v3/models")
          data = parse(body)
          ids = []
          if isinstance(data, dict) and isinstance(data.get("data"), list):
              ids = [x.get("id") for x in data["data"] if isinstance(x, dict) and x.get("id")]
          print("catalog_http=", status)
          print("catalog_count=", len(ids))

          families = [
              ("doubao-seed", ["doubao-seed"]),
              ("doubao-pro", ["doubao-1-5-pro", "doubao-pro"]),
              ("kimi", ["kimi", "moonshot"]),
              ("glm", ["glm"]),
              ("qwen", ["qwen"]),
              ("minimax", ["minimax"]),
              ("seed-oss", ["seed-oss"]),
              ("mistral", ["mistral"]),
          ]
          blocked = ("embedding", "vision", "image", "video", "audio", "speech", "tts", "character", "browsing", "functioncall")
          selected = []
          family_map = {}
          for family, pats in families:
              hits = []
              for mid in reversed(ids):
                  low = mid.lower()
                  if any(b in low for b in blocked):
                      continue
                  if any(p in low for p in pats):
                      hits.append(mid)
                  if len(hits) >= 3:
                      break
              family_map[family] = hits
              for mid in hits:
                  if mid not in selected:
                      selected.append(mid)

          print("catalog_mainstream_candidates=", json.dumps(family_map, ensure_ascii=False))
          print("selected_count=", len(selected))

          chat_url = "https://ark.cn-beijing.volces.com/api/v3/chat/completions"
          usable = []
          for model in selected:
              status, body = req("POST", chat_url, {
                  "model": model,
                  "messages": [{"role": "user", "content": "Reply exactly OK."}],
                  "stream": False,
                  "max_tokens": 32,
              })
              data = parse(body)
              code = msg = returned_model = content = None
              if isinstance(data, dict):
                  returned_model = data.get("model")
                  err = data.get("error")
                  if isinstance(err, dict):
                      code = err.get("code")
                      msg = err.get("message")
                  choices = data.get("choices") or []
                  if choices and isinstance(choices[0], dict):
                      m = choices[0].get("message") or {}
                      if isinstance(m, dict):
                          content = m.get("content")
              ok = 200 <= status < 300
              if ok:
                  usable.append(model)
              print(json.dumps({
                  "model": model,
                  "http": status,
                  "usable": ok,
                  "returned_model": returned_model,
                  "content": content[:80] if isinstance(content, str) else content,
                  "error_code": code,
                  "error_message": msg[:220] if isinstance(msg, str) else msg,
              }, ensure_ascii=False))

          print("=== RESULT ===")
          print("usable_models=", usable)
          print("usable_count=", len(usable))
          PY

      - name: Publish sanitized probe result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="probe step failed before a report was produced"
          [ ! -f /tmp/ark_probe.txt ] || body="$(cat /tmp/ark_probe.txt)"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "ark-mainstream-model-smoke:${GITHUB_RUN_ID}" \
            --body "\`\`\`text
          ${body}
          \`\`\`"
