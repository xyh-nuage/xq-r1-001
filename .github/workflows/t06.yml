name: t06

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact frozen Company C2 raw-context v2 source commit
        required: true
        default: cf7567627b621ef637aa8586b5bc7a27c176d050
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t06
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t06:'))
    environment: deepseek
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve exact source and harness
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t06:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$source" = "cf7567627b621ef637aa8586b5bc7a27c176d050"
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access before model calls
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Run first frozen Company C2 raw-context v2 Slice A evaluation
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          C2_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          C2_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          C2_LLM_MODEL: ${{ secrets.LLM_MODEL }}
          C2_LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS || '60' }}
          C2_LLM_MAX_RETRIES: ${{ vars.LLM_MAX_RETRIES || '2' }}
          C2_LLM_RETRY_BACKOFF_SECONDS: ${{ vars.LLM_RETRY_BACKOFF_SECONDS || '1' }}
          C2_LLM_MAX_COMPLETION_TOKENS: ${{ vars.LLM_MAX_COMPLETION_TOKENS || '3000' }}
          C2_LLM_MAX_COMPLETION_FIELD: ${{ vars.LLM_MAX_COMPLETION_FIELD || 'max_tokens' }}
        shell: bash
        run: python "$RUNNER_TEMP/harness/scripts/private_eval_runner_v3.py" --source-sha "${{ steps.source.outputs.value }}" --plan "$RUNNER_TEMP/harness/plans/t06.json"

      - name: Persist complete C2 evaluation privately
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$RUNNER_TEMP/private-eval-source/source" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation "company_c2_raw_context_slice_a_v2" \
            --copy "runtime_company_c2_slice_a/output/RUN.json=evaluation_RUN.json" \
            --copy "runtime_company_c2_slice_a/output/summary.json=summary.json" \
            --copy "runtime_company_c2_slice_a/output/predictions.jsonl=predictions.jsonl" \
            --copy "runtime_company_c2_slice_a/output/matters.jsonl=matters.jsonl" \
            --copy "runtime_company_c2_slice_a/output/matters.md=matters.md" \
            --copy "runtime_company_c2_slice_a/output/errors.md=errors.md"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/private-eval-source" "$RUNNER_TEMP/private-eval-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP"/private-artifact-*.zip "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight"
