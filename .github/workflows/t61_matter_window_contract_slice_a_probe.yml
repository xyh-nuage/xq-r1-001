name: t61-matter-window-contract-slice-a-probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t61_matter_window_contract_slice_a_probe.yml']
permissions:
  contents: read
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch exact source and frozen Seen input
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/source"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/xyh-nuage/knowledge.git
          ask="$RUNNER_TEMP/askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$KNOWLEDGE_READ_TOKEN";; esac\n' > "$ask"
          chmod 700 "$ask"
          export GIT_ASKPASS="$ask" GIT_TERMINAL_PROMPT=0
          git -C "$root" fetch -q --depth=1 origin 5aeb69769b152d89c82ad2b913b354d1703c0e71
          git -C "$root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = 5aeb69769b152d89c82ad2b913b354d1703c0e71
          git -C "$root" fetch -q --depth=1 origin 65f0a74e1af548747f79e13b5264fc1a02aa84ab
          input_path='evaluation_results/full_context_compact_first48_low1800/2026-08-19_5093c76e_run32222577158/full_context_input.json'
          git -C "$root" show 65f0a74e1af548747f79e13b5264fc1a02aa84ab:"$input_path" > "$RUNNER_TEMP/full83.json"
      - name: Build first48 and second35 packets
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          src = json.load(open(os.environ['RUNNER_TEMP'] + '/full83.json', encoding='utf-8'))
          messages = list(src['user_payload']['messages'])
          assert len(messages) == 83, len(messages)
          for name, subset in [('first48', messages[:48]), ('second35', messages[48:])]:
              doc = json.loads(json.dumps(src, ensure_ascii=False))
              doc['user_payload']['messages'] = subset
              doc['user_payload'].pop('mature_matters', None)
              with open(os.environ['RUNNER_TEMP'] + f'/{name}.json', 'w', encoding='utf-8') as f:
                  json.dump(doc, f, ensure_ascii=False, indent=2)
          PY
          python "$RUNNER_TEMP/source/l1/tools/build_research_matter_window_packet.py" "$RUNNER_TEMP/first48.json" --output-dir "$RUNNER_TEMP/first48" --ordinal-start 1 | tee "$RUNNER_TEMP/first48.stats"
          python "$RUNNER_TEMP/source/l1/tools/build_research_matter_window_packet.py" "$RUNNER_TEMP/second35.json" --output-dir "$RUNNER_TEMP/second35" --ordinal-start 49 | tee "$RUNNER_TEMP/second35.stats"
      - name: Real-packet contract gates
        run: |
          set -euo pipefail
          p1="$RUNNER_TEMP/first48/human_context_packet.txt"
          p2="$RUNNER_TEMP/second35/human_context_packet.txt"
          grep -q '消息1 |' "$p1"
          grep -q '消息48 |' "$p1"
          grep -q '消息49 |' "$p2"
          grep -q '消息83 |' "$p2"
          grep -q '文件：青岛远腾-杭州钱塘.pdf' "$p1"
          grep -q '提单号：TLLCTCJR26045778' "$p1"
          grep -q '余姚没有磅单吧' "$p2"
          grep -q '新边鹿  175吨' "$p2"
          ! grep -q '6800元/辆' "$p1"
          ! grep -q 'Sheet1 (Total rows' "$p1"
          ! grep -q '微信电脑版' "$p1"
          ! grep -q 'vivo S20' "$p1"
          ! grep -q 'ISO173' "$p1"
          echo REAL_SLICE_A_PACKET_GATES_PASS
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'source_sha=5aeb69769b152d89c82ad2b913b354d1703c0e71'
            echo 'input_evidence_commit=65f0a74e1af548747f79e13b5264fc1a02aa84ab'
            echo 'provider_call_count=0'
            echo 'first48_stats:'
            cat "$RUNNER_TEMP/first48.stats" 2>/dev/null || true
            echo 'second35_stats:'
            cat "$RUNNER_TEMP/second35.stats" 2>/dev/null || true
          } > "$RUNNER_TEMP/t61-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t61-matter-window-contract-slice-a-probe:${GITHUB_RUN_ID}" --body "$(cat "$RUNNER_TEMP/t61-report.txt")"
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/askpass.sh" "$RUNNER_TEMP/full83.json" "$RUNNER_TEMP/first48.json" "$RUNNER_TEMP/second35.json" "$RUNNER_TEMP/first48" "$RUNNER_TEMP/second35" "$RUNNER_TEMP/first48.stats" "$RUNNER_TEMP/second35.stats" "$RUNNER_TEMP/t61-report.txt"
