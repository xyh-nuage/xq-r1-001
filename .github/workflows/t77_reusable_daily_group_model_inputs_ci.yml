name: t77-reusable-daily-group-model-inputs-ci
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t77_reusable_daily_group_model_inputs_ci.yml']
permissions:
  contents: read
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    environment: shangtang
    timeout-minutes: 30
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: df94a589270002a25a55c564f32536a056e4692d
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Verify exact source and run packet preparation tests
        run: |
          set -euo pipefail
          test "$(git -C private-knowledge rev-parse HEAD)" = "df94a589270002a25a55c564f32536a056e4692d"
          python -m pip install -q pytest
          python -m pytest -q \
            private-knowledge/l1/tests/test_research_matter_window_packet.py \
            private-knowledge/l1/tests/test_research_matter_window_attachment_repeats.py \
            private-knowledge/l1/tests/test_prepare_research_daily_group_model_inputs.py
      - name: Rebuild all real daily-group model inputs
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/t77-model-inputs"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$RUNNER_TEMP/t77-model-inputs"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'t77-model-inputs'
          summary=json.loads((root/'build_summary.json').read_text(encoding='utf-8'))
          manifest=json.loads((root/'model_inputs'/'manifest.json').read_text(encoding='utf-8'))
          assert summary['group_day_count'] == 365, summary
          assert summary['message_count'] == 7395, summary
          assert summary['provider_call_count'] == 0, summary
          assert manifest['cross_group_linking_performed'] is False, manifest
          assert manifest['day_boundary_is_matter_boundary'] is False, manifest
          assert manifest['model_facing_internal_record_ids'] is False, manifest
          assert manifest['model_facing_file_hashes'] is False, manifest
          assert manifest['model_facing_provenance_paths'] is False, manifest
          assert manifest['model_facing_gold_or_silver'] is False, manifest
          packet_files=list((root/'model_inputs'/'packets').glob('p*.txt'))
          assert len(packet_files) == summary['packet_count'], (len(packet_files), summary)
          public={
            'group_day_count': summary['group_day_count'],
            'message_count': summary['message_count'],
            'packet_count': summary['packet_count'],
            'full_day_group_day_count': summary['full_day_group_day_count'],
            'split_group_day_count': summary['split_group_day_count'],
            'packet_budget_chars': summary['packet_budget_chars'],
            'packet_char_profile': manifest['packet_char_profile'],
            'provider_call_count': 0,
            'cross_group_linking_performed': False,
            'model_facing_internal_record_ids': False,
          }
          (root/'public_summary.json').write_text(json.dumps(public,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Report public-safe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'source_sha=df94a589270002a25a55c564f32536a056e4692d'
            echo 'provider_call_count=0'
            cat "$RUNNER_TEMP/t77-model-inputs/public_summary.json" 2>/dev/null || true
          } > "$RUNNER_TEMP/t77-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t77-reusable-daily-group-model-inputs-ci:${GITHUB_RUN_ID}" --body-file "$RUNNER_TEMP/t77-report.txt"
