# Fresh registration for the sealed t45 deterministic plan; same owner-gated rq45 source and same private-source boundary.
name: t45r-context-memory-membership-routing-deterministic
run-name: t45r:${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: [rq45]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t45r-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.display_title, 'rq:t45:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact sealed source
        id: source
        shell: bash
        env:
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          source="${REQUEST_TITLE#rq:t45:}"
          harness="$REQUEST_HARNESS_SHA"
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source"
          echo "harness_sha=$harness"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout exact private source
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/context-memory-membership-routing-source"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t45r-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 'private_source=VERIFIED_EXACT_SHA'

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/context-memory-membership-routing-source"
          python -m pip install -q -e 'l1[dev]'

      - name: Compile repaired routing modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/context-memory-membership-routing-source"
          python -m py_compile \
            l1/l1_processor/context_memory/membership_routing.py \
            l1/l1_processor/context_memory/membership_model_provider.py \
            l1/l1_processor/context_memory/membership_kernel.py \
            l1/l1_processor/context_memory/membership_context.py \
            l1/l1_processor/context_memory/v02_contracts.py \
            l1/l1_processor/context_memory/v02_engine.py \
            l1/l1_processor/context_memory/v02_store.py
          echo 'compile=PASS'

      - name: Run repaired routing and context-memory regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/context-memory-membership-routing-source"
          python - <<'PY'
          import re, subprocess, sys, xml.etree.ElementTree as ET
          report='/tmp/t45r-junit.xml'
          cmd=[sys.executable,'-m','pytest','-q','--junitxml',report,
               'l1/tests/context_memory/test_membership_routing.py',
               'l1/tests/context_memory/test_explicit_relation_integration.py',
               'l1/tests/context_memory/test_real_adapter_probe.py',
               'l1/tests/context_memory/test_v02_hardening.py',
               'l1/tests/context_memory/test_v02_scenarios.py']
          p=subprocess.run(cmd,text=True,capture_output=True)
          text=(p.stdout or '')+'\n'+(p.stderr or '')
          summary=''
          for line in reversed(text.splitlines()):
              if re.search(r'\b(passed|failed|error|errors|skipped|xfailed|xpassed)\b', line):
                  summary=line.strip(); break
          counts={k:0 for k in ('passed','failed','skipped','xfailed','xpassed','deselected','errors')}
          for n,k in re.findall(r'(\d+)\s+(passed|failed|skipped|xfailed|xpassed|deselected|errors?)', summary):
              counts['errors' if k in ('error','errors') else k]=int(n)
          print('PYTEST_AUDIT='+','.join(f'{k}={counts[k]}' for k in counts))
          if p.returncode != 0:
              failed=[]; diagnostics=[]
              try:
                  root=ET.parse(report).getroot()
                  for case in root.iter('testcase'):
                      node=case.find('failure') or case.find('error')
                      if node is None: continue
                      name=f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}"
                      failed.append(name)
                      body=(node.text or '').strip().splitlines()
                      diagnostics.append(name+' => '+(' | '.join(body[-2:])[:500] if body else str(node.attrib.get('message',''))[:500]))
              except Exception as exc:
                  diagnostics.append('junit-parse => '+type(exc).__name__)
              print('FAILED_TESTS='+(';'.join(failed) if failed else 'UNAVAILABLE'))
              for item in diagnostics: print('FAIL_DIAG='+item)
              print('pytest_result=FAIL'); print(summary); raise SystemExit(p.returncode)
          if counts['passed'] == 0: raise SystemExit('pytest aggregate summary missing')
          print('FAILED_TESTS=NONE')
          print('pytest_result=PASS')
          PY

      - name: Verify inference boundary has no reference input port
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/context-memory-membership-routing-source"
          export PYTHONPATH="$PWD/l1:$PWD"
          python - <<'PY'
          from dataclasses import fields
          from l1_processor.context_memory.membership_routing import RoutingContext
          names={f.name.lower() for f in fields(RoutingContext)}
          assert not ({'gold','reference','reference_answer'} & names)
          print('model_input_reference_fields=0')
          PY

      - name: Terminal audit marker
        shell: bash
        run: |
          echo 'CONTEXT_MEMORY_MEMBERSHIP_ROUTING_DETERMINISTIC_CI_PASS'
          echo 'replay_only_capability_claim=0'
          echo 'live_model_calls=0'
          echo 'gold_reference_model_input=0'
          echo 'merge_performed=0'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/context-memory-membership-routing-source" "$RUNNER_TEMP/t45r-read-askpass.sh" /tmp/t45r-*
