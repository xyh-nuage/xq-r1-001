name: t70-status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t70_status.yml']
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report latest t70 status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow t70_daily_group_all_observed_export.yml --limit 1 --json databaseId,status,conclusion,headSha,createdAt,updatedAt > /tmp/status.json
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t70-status:${GITHUB_RUN_ID}" --body "$(cat /tmp/status.json)"
