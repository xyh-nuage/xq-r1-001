name: t67-first48-medium12000-business-actions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t67_first48_medium12000_business_actions.yml']
permissions:
  contents: read
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    environment: shangtang
    timeout-minutes: 30
    env:
      SOURCE_SHA: 95ddc75fb0e7fc32149d1ddae412309fdce7812c
      PACKET_SOURCE_COMMIT: e99f8ecb09a4df9fb9b706fad370b93c62148d3d
      PACKET_BLOB: 30fc6bf64f38170b64493fb224b90c7f475ba797
      LLM_MODEL: deepseek-v4-flash
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: knowledge
          fetch-depth: 1
      - name: Prepare immutable packet and current prompt
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/knowledge"
          test "$(git -C "$root" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$root" fetch -q --depth=1 origin "$PACKET_SOURCE_COMMIT"
          packet_path='evaluation_results/full_context_immutable_first48_medium8000_t58/2026-08-19_5093c76e_run32232198073/human_context_packet.txt'
          test "$(git -C "$root" rev-parse "$PACKET_SOURCE_COMMIT:$packet_path")" = "$PACKET_BLOB"
          git -C "$root" show "$PACKET_SOURCE_COMMIT:$packet_path" > "$RUNNER_TEMP/human_context_packet.txt"
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          src = Path(os.environ['GITHUB_WORKSPACE']) / 'knowledge' / 'l1' / 'tools' / 'build_research_matter_window_packet.py'
          spec = importlib.util.spec_from_file_location('matter_packet', src)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          Path(os.environ['RUNNER_TEMP'], 'human_context_system_prompt.txt').write_text(mod.SYSTEM_PROMPT + '\n', encoding='utf-8')
          print('system_prompt_chars=' + str(len(mod.SYSTEM_PROMPT)))
          PY
      - name: Run provider experiment
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/t67"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/human_context_packet.txt" "$out/human_context_packet.txt"
          cp "$RUNNER_TEMP/human_context_system_prompt.txt" "$out/human_context_system_prompt.txt"
          python scripts/t67_shangtang_immutable_first48_medium12000_business_actions.py "$RUNNER_TEMP/human_context_packet.txt" "$RUNNER_TEMP/human_context_system_prompt.txt" "$out" 2>&1 | tee "$RUNNER_TEMP/t67.log"
      - name: Persist private evidence
        if: always()
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          if [ -s "$RUNNER_TEMP/t67/full_context_raw_result.json" ]; then
            python scripts/private_results_publisher.py --source-root "$RUNNER_TEMP/t67" --source-sha "$SOURCE_SHA" --harness-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --date 2026-08-19 --evaluation full_context_first48_medium12000_business_actions_t67 --copy full_context_raw_result.json=full_context_raw_result.json --copy human_context_packet.txt=human_context_packet.txt --copy human_context_system_prompt.txt=human_context_system_prompt.txt 2>&1 | tee "$RUNNER_TEMP/t67-persist.log"
          fi
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "source_sha=$SOURCE_SHA"; echo "packet_source_commit=$PACKET_SOURCE_COMMIT"; echo "provider_model=$LLM_MODEL"; echo; cat "$RUNNER_TEMP/t67.log" 2>/dev/null || true; echo; cat "$RUNNER_TEMP/t67-persist.log" 2>/dev/null || true; } > "$RUNNER_TEMP/t67-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t67-first48-medium12000-business-actions:${GITHUB_RUN_ID}" --body-file "$RUNNER_TEMP/t67-report.txt"
