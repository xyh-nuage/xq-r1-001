name: t37

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private targeted Context Bundle ablation source commit
        required: true
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: remote-t37-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t37:'))
    environment: shangtang
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Publish safe run locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "${{ github.repository }}" --title "t37-context-bundle-targeted-ablation:${{ github.run_id }}" --body "Safe locator for Seen-only preregistered Context Bundle targeted ablation screening. No private content."

      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then source="${REQUEST_TITLE#rq:t37:}"; harness="$REQUEST_HARNESS_SHA"; else source="$DISPATCH_SHA"; harness="$CURRENT_HARNESS_SHA"; fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access before model calls
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Prepare exact private source and immutable inputs
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/context-bundle-targeted-v2"
          repo="$root/source"
          input="$root/input"
          mkdir -p "$input/packets"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t37-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"

          packet_commit="01285f526db49ae4d51bdfb351632bc048884ad5"
          packet_prefix="evaluation_results/research_matter_phase0_candidates/2026-08-19_cec83f7c_run32268255221/candidate_packets"
          git -C "$repo" fetch -q --depth=1 origin "$packet_commit"
          git -C "$repo" show "$packet_commit:$packet_prefix/2026-07-08_8e2cfc446694.txt" > "$input/packets/jiekun.txt"
          git -C "$repo" show "$packet_commit:$packet_prefix/2026-07-16_84f34dbd5f23.txt" > "$input/packets/zhongtai.txt"
          test "$(git hash-object "$input/packets/jiekun.txt")" = "c40af9f54936a4da9c1b9e3bda4678c770317486"
          test "$(git hash-object "$input/packets/zhongtai.txt")" = "99c5cb5587608cc140070b1482b2442746081252"

          hist_commit="105441150d96e925d517db99fd3f5ee176e0ee55"
          hist_path="evaluation_results/research_context_bundle_ab_v1/2026-08-20_0fdbc195_run32388877949/context_bundle_ab_metrics.v1.json"
          git -C "$repo" fetch -q --depth=1 origin "$hist_commit"
          git -C "$repo" show "$hist_commit:$hist_path" > "$input/historical_v1_metrics.json"
          test "$(sha256sum "$input/historical_v1_metrics.json" | awk '{print $1}')" = "68e7aaa39badf557381ebb0ce996fb59960fe51b967bdba58e4e8cade59a7143"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 'private_source=VERIFIED_EXACT_SHA'
          echo 'packet_inputs=VERIFIED_IMMUTABLE'
          echo 'historical_v1_metrics=VERIFIED_IMMUTABLE'

      - name: Validate frozen screening contract
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/context-bundle-targeted-v2/source"
          cd "$repo"
          python -m pip install -q pytest
          python -m py_compile l1/tools/context_bundle_scorer.py l1/tools/run_research_context_bundle_ab.py l1/tools/run_research_context_bundle_targeted_ablation_v2.py l1/tools/run_research_context_bundle_targeted_ablation_v2_screening.py
          python -m pytest -q l1/tests/test_context_bundle_scorer.py
          test "$(git hash-object l1/evaluation/research_matter_three_validation/context_bundle_prompt_contract.v1_1_boundary_bias.txt)" = "48d2ee899925b30498c20d554a3b81305807b206"
          test "$(git hash-object l1/evaluation/research_matter_three_validation/context_bundle_prompt_contract.v1_2_business_context.txt)" = "ca60f5911fb2d3dcaeb8b09d749017ae0ee05161"
          ! grep -Fq 'JJCL ETC提货｜38包改单' l1/evaluation/research_matter_three_validation/context_bundle_prompt_contract.v1_1_boundary_bias.txt
          ! grep -Fq 'JJCL ETC提货｜38包改单' l1/evaluation/research_matter_three_validation/context_bundle_prompt_contract.v1_2_business_context.txt
          echo 'screening_contract=PASS'

      - name: Verify Shangtang model configuration
        shell: bash
        env:
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          test -n "$L1_LLM_API_KEY"
          test -n "$L1_LLM_BASE_URL"
          test "$L1_LLM_MODEL" = 'deepseek-v4-flash'
          echo 'shangtang_environment=CONFIG_PRESENT'

      - name: Run targeted ablation 3x screening
        shell: bash
        env:
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL }}
          L1_LLM_TIMEOUT_SECONDS: '300'
          L1_LLM_MAX_RETRIES: '3'
          L1_LLM_RETRY_BACKOFF_SECONDS: '60'
          RESEARCH_MATTER_V2_MAX_TOKENS: '25000'
          L1_LLM_MAX_COMPLETION_FIELD: 'max_tokens'
          L1_LLM_DISABLE_REASONING: 'false'
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/context-bundle-targeted-v2/source"
          input="$RUNNER_TEMP/context-bundle-targeted-v2/input"
          out="$repo/l1/evaluation/vnext/runtime/research_context_bundle_targeted_ablation_v2"
          rm -rf "$out"
          python "$repo/l1/tools/run_research_context_bundle_targeted_ablation_v2_screening.py" --output-dir "$out" --input-dir "$input" --source-sha "${{ steps.source.outputs.value }}"

      - name: Publish safe aggregate audit
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/context-bundle-targeted-v2/source/l1/evaluation/vnext/runtime/research_context_bundle_targeted_ablation_v2"
          python - "$root" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); m=json.loads((root/'context_bundle_targeted_ablation_v2_metrics.v1.json').read_text())
          safe={'successful_semantic_samples':m['successful_semantic_samples'],'actual_new_model_calls':m['actual_new_model_calls'],'provider_runtime_failures':len(m['execution_failures']),'historical_v1_rerun':int(m['historical_v1_rerun']),'prompt_sha256':m['prompt_sha256'],'manifest_sha256':m['manifest_sha256'],'silver_sha256':m['silver_sha256'],'samples':{},'screening_gate':m['screening_gate']}
          for sid,s in m['samples'].items():
              safe['samples'][sid]={'window':s['window'],'historical_v1':s['historical_v1'],'candidates':{}}
              for c in ('A_boundary_bias','B_business_context'):
                  a=s[c]['aggregate']; safe['samples'][sid]['candidates'][c]={'dependency_recall_mean':a['dependency_recall']['mean'],'clean_trap_rate_mean':a['clean_trap_rate']['mean'],'forced_attachment_mean':a['forced_attachment_count']['mean'],'harmful_fragmentation_mean':a['automatic_harmful_fragmentation_count']['mean'],'pairwise_f1_mean':a['diagnostic_pairwise_f1']['mean'],'bundle_count_mean':a['predicted_bundle_count']['mean'],'stability':s[c]['stability']['mean_majority_agreement'],'valid_output_count':a['valid_output_count']}
          print('TARGETED_ABLATION_V2_AUDIT='+json.dumps(safe,sort_keys=True,separators=(',',':')))
          PY

      - name: Persist detailed private screening result
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/context-bundle-targeted-v2/source"
          base="l1/evaluation/vnext/runtime/research_context_bundle_targeted_ablation_v2"
          copies=(
            --copy "$base/RUN.json=RUN.json"
            --copy "$base/context_bundle_targeted_ablation_v2_metrics.v1.json=context_bundle_targeted_ablation_v2_metrics.v1.json"
            --copy "$base/RESULTS_CONTEXT_BUNDLE_TARGETED_ABLATION_V2.md=RESULTS_CONTEXT_BUNDLE_TARGETED_ABLATION_V2.md"
            --copy "l1/evaluation/research_matter_three_validation/context_bundle_targeted_ablation_v2_manifest.v1.json=context_bundle_targeted_ablation_v2_manifest.v1.json"
            --copy "l1/evaluation/research_matter_three_validation/context_bundle_prompt_contract.v1_1_boundary_bias.txt=context_bundle_prompt_contract.v1_1_boundary_bias.txt"
            --copy "l1/evaluation/research_matter_three_validation/context_bundle_prompt_contract.v1_2_business_context.txt=context_bundle_prompt_contract.v1_2_business_context.txt"
            --copy "l1/evaluation/research_matter_three_validation/context_bundle_prompt_contract.v1.txt=context_bundle_prompt_contract.v1.txt"
            --copy "l1/evaluation/research_matter_three_validation/seen_context_bundle_silver.v1.readjudicated.json=seen_context_bundle_silver.v1.readjudicated.json"
          )
          while IFS= read -r file; do rel="${file#$repo/$base/}"; copies+=(--copy "$base/$rel=$rel"); done < <(find "$repo/$base/raw" -type f -name '*.json' | sort)
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" --source-root "$repo" --source-sha "${{ steps.source.outputs.value }}" --harness-sha "${{ steps.source.outputs.harness }}" --run-id "${{ github.run_id }}" --date "$(date -u +%F)" --evaluation research_context_bundle_targeted_ablation_v2 "${copies[@]}"

      - name: Terminal audit marker
        shell: bash
        run: |
          echo 'RESEARCH_CONTEXT_BUNDLE_TARGETED_ABLATION_V2_SCREENING_PASS'
          echo 'candidate_A_success_target=6'
          echo 'candidate_B_success_target=6'
          echo 'historical_v1_rerun=0'
          echo 'sealed_unseen_used=0'
          echo 'continuity_used=0'
          echo 'previous_matter_cards_used=0'
          echo 'cross_group_used=0'
          echo 'merge_performed=0'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/context-bundle-targeted-v2" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/t37-read-askpass.sh" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
