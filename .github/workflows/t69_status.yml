name: t69-status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t69_status.yml']
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report latest sharded t69 status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow t69_daily_group_corpus_export.yml --limit 1 --json databaseId,status,conclusion,headSha,createdAt,updatedAt > /tmp/status.json
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t69-status:${GITHUB_RUN_ID}" --body "$(cat /tmp/status.json)"
