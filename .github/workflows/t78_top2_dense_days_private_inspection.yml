name: t78-top2-dense-days-private-inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t78_top2_dense_days_private_inspection.yml']
permissions:
  contents: read
  issues: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: deepseek
    timeout-minutes: 30
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
      - name: Verify private result write access
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python scripts/private_results_preflight.py
      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: df94a589270002a25a55c564f32536a056e4692d
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Rebuild model inputs and extract top two dense group-days
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t78-prepared"
          private="$RUNNER_TEMP/t78-private"
          rm -rf "$out" "$private"
          mkdir -p "$private"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$out" >/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'t78-prepared'
          private = Path(os.environ['RUNNER_TEMP'])/'t78-private'
          manifest = json.loads((out/'model_inputs/manifest.json').read_text(encoding='utf-8'))
          top2 = manifest['densest_group_days'][:2]
          packet_index = [json.loads(x) for x in (out/'model_inputs/packet_index.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          by_id = {r['packet_id']: r for r in packet_index}
          selection = []
          for rank, day in enumerate(top2, 1):
              packet_ids = list(day['packet_ids'])
              parts = []
              for pid in packet_ids:
                  idx = by_id[pid]
                  text = (out/idx['packet_path']).read_text(encoding='utf-8').rstrip()
                  parts.append(f"===== {pid} | day messages {idx['day_message_ordinal_start']}-{idx['day_message_ordinal_end']} =====\n{text}")
              (private/f'day{rank}.txt').write_text('\n\n'.join(parts)+'\n', encoding='utf-8')
              selection.append(day)
          (private/'selection.json').write_text(json.dumps({'top2': selection}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({
              'selected_group_days': len(selection),
              'message_counts': [int(x['message_count']) for x in selection],
              'packet_counts': [int(x['packet_count']) for x in selection],
              'provider_call_count': 0,
          }, ensure_ascii=False))
          PY
      - name: Persist private inspection material
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          python scripts/private_results_publisher.py \
            --source-root "$RUNNER_TEMP/t78-private" \
            --source-sha df94a589270002a25a55c564f32536a056e4692d \
            --harness-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation research_top2_dense_group_days \
            --copy selection.json=selection.json \
            --copy day1.txt=day1.txt \
            --copy day2.txt=day2.txt
      - name: Publish safe locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t78-top2-dense-days:${GITHUB_RUN_ID}" \
            --body "Private top-two dense group-day inspection completed or attempted. No company content is included here."
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/t78-prepared" "$RUNNER_TEMP/t78-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
