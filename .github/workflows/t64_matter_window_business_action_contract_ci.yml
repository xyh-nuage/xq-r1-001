name: t64-matter-window-business-action-contract-ci
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t64_matter_window_business_action_contract_ci.yml']
permissions:
  contents: read
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch exact private source
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/source"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/xyh-nuage/knowledge.git
          ask="$RUNNER_TEMP/askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$KNOWLEDGE_READ_TOKEN";; esac\n' > "$ask"
          chmod 700 "$ask"
          export GIT_ASKPASS="$ask" GIT_TERMINAL_PROMPT=0
          git -C "$root" fetch -q --depth=1 origin a5569a90c7418f6a49cce6983b33bd3054cde107
          git -C "$root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = a5569a90c7418f6a49cce6983b33bd3054cde107
      - name: Run contract tests
        run: |
          set -o pipefail
          python -m pip install -q pytest
          cd "$RUNNER_TEMP/source"
          python -m pytest -q \
            l1/tests/test_research_matter_window_packet.py \
            l1/tests/test_research_matter_window_attachment_repeats.py \
            l1/tests/test_research_matter_window_business_action_prompt.py \
            2>&1 | tee "$RUNNER_TEMP/t64.log"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'source_sha=a5569a90c7418f6a49cce6983b33bd3054cde107'
            echo 'provider_call_count=0'
            echo
            cat "$RUNNER_TEMP/t64.log" 2>/dev/null || true
          } > "$RUNNER_TEMP/t64-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t64-matter-window-business-action-contract-ci:${GITHUB_RUN_ID}" --body "$(cat "$RUNNER_TEMP/t64-report.txt")"
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/askpass.sh" "$RUNNER_TEMP/t64.log" "$RUNNER_TEMP/t64-report.txt"
