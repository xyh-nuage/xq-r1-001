name: t49-status-probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t49_status_probe.yml']
permissions:
  actions: read
  issues: write
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect t49 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow t49_first48_file_names_only_low3000_retry429.yml --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt > /tmp/t49.json
          cat /tmp/t49.json
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t49-status:${GITHUB_RUN_ID}" --body "$(cat /tmp/t49.json)"
