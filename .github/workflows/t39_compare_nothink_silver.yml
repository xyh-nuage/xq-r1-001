name: t39-compare-nothink-silver

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/t39_compare_nothink_silver.yml'

permissions:
  contents: read
  issues: write

jobs:
  compare:
    environment: shangtang
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Fetch persisted private result commit
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$KNOWLEDGE_READ_TOKEN"
          repo="$RUNNER_TEMP/knowledge"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t39-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin 39fe79682bc8385a829ae1ed6fd6b70dc1c100c1
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "39fe79682bc8385a829ae1ed6fd6b70dc1c100c1"
          rm -f "$askpass"

      - name: Compare model clusters to Silver v2
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/t39_compare_nothink_silver.py" "$RUNNER_TEMP/knowledge" > "$RUNNER_TEMP/t39-report.json"
          cat "$RUNNER_TEMP/t39-report.json"

      - name: Publish safe comparison
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t39-nothink-silver-compare:${GITHUB_RUN_ID}" \
            --body "Deterministic post-hoc Silver comparison only. No provider/model call.\n\n\`\`\`json\n$(cat "$RUNNER_TEMP/t39-report.json")\n\`\`\`"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/harness" "$RUNNER_TEMP/knowledge" "$RUNNER_TEMP/t39-read-askpass.sh" "$RUNNER_TEMP/t39-report.json"
