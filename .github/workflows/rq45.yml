name: rq45
run-name: ${{ github.event.issue.title }}

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.event.issue.title, 'rq:t45:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate owner t45 request
        shell: bash
        env:
          REQUEST_AUTHOR: ${{ github.event.issue.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REQUEST_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          test "$REQUEST_AUTHOR" = "$REPOSITORY_OWNER" || { echo 'request=REJECTED'; exit 2; }
          if [[ "$REQUEST_TITLE" =~ ^rq:t45:[0-9a-f]{40}$ ]]; then
            echo 'request=ACCEPTED'
          else
            echo 'request=INVALID'
            exit 2
          fi
