name: tangshang-config-probe

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'tangshang-config-probe-request'
    environment: tangshang
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish presence-only configuration audit
        env:
          GH_TOKEN: ${{ github.token }}
          S_FLASH: ${{ secrets.FLASH }}
          S_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          S_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          S_LLM_MODEL: ${{ secrets.LLM_MODEL }}
          S_TANGSHANG_API_KEY: ${{ secrets.TANGSHANG_API_KEY }}
          S_TANGSHANG_BASE_URL: ${{ secrets.TANGSHANG_BASE_URL }}
          S_TANGSHANG_MODEL: ${{ secrets.TANGSHANG_MODEL }}
          V_LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          V_LLM_MODEL: ${{ vars.LLM_MODEL }}
          V_TANGSHANG_BASE_URL: ${{ vars.TANGSHANG_BASE_URL }}
          V_TANGSHANG_MODEL: ${{ vars.TANGSHANG_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "$2" ]; then printf '%s=1\n' "$1"; else printf '%s=0\n' "$1"; fi; }
          report="$RUNNER_TEMP/tangshang-presence.txt"
          {
            echo 'Presence-only Tangshang environment audit. No secret or variable values are included.'
            present secret_flash "$S_FLASH"
            present secret_llm_api_key "$S_LLM_API_KEY"
            present secret_llm_base_url "$S_LLM_BASE_URL"
            present secret_llm_model "$S_LLM_MODEL"
            present secret_tangshang_api_key "$S_TANGSHANG_API_KEY"
            present secret_tangshang_base_url "$S_TANGSHANG_BASE_URL"
            present secret_tangshang_model "$S_TANGSHANG_MODEL"
            present var_llm_base_url "$V_LLM_BASE_URL"
            present var_llm_model "$V_LLM_MODEL"
            present var_tangshang_base_url "$V_TANGSHANG_BASE_URL"
            present var_tangshang_model "$V_TANGSHANG_MODEL"
            echo 'provider_calls=0'
          } > "$report"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "tangshang-config-probe:${GITHUB_RUN_ID}" --body-file "$report"
