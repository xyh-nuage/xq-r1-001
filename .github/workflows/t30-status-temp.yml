name: t30-status-temp

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  publish:
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == 't30-status-temp-request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish latest t30 run status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/t30.yml/runs?per_page=3")"
          run_id="$(jq -r '.workflow_runs[0].id' <<<"$payload")"
          status="$(jq -r '.workflow_runs[0].status' <<<"$payload")"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // "none"' <<<"$payload")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha' <<<"$payload")"
          title="$(jq -r '.workflow_runs[0].display_title' <<<"$payload")"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t30-temp-status:${run_id}:${status}:${conclusion}" --body "harness_sha=${head_sha}; display_title=${title}; no private source data included."
