name: ark-deepseek-smoke-trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ark_deepseek_smoke_trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch smoke workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'dispatch_version=2'
          gh workflow run ark_deepseek_smoke.yml --repo "$GITHUB_REPOSITORY"
