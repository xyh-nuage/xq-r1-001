name: t75-daily-group-final-corpus
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t75_daily_group_final_corpus.yml']
permissions:
  contents: read
  issues: write
jobs:
  export:
    runs-on: ubuntu-latest
    environment: shangtang
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 60857d0d6e12e3abaf1959d375bf8fcf128a7cf7
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Verify source and tests
        run: |
          set -euo pipefail
          test "$(git -C private-knowledge rev-parse HEAD)" = "60857d0d6e12e3abaf1959d375bf8fcf128a7cf7"
          python -m pip install -q pytest
          python -m pytest -q \
            private-knowledge/l0/tests/test_export_research_daily_group_corpus.py \
            private-knowledge/l0/tests/test_canonicalize_research_daily_group_corpus_groups.py \
            private-knowledge/l0/tests/test_dedupe_research_daily_group_corpus_snapshots.py \
            private-knowledge/l0/tests/test_shard_research_daily_group_corpus.py
      - name: Build final corpus
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/t75"; mkdir -p "$root/shards"
          python private-knowledge/l0/tools/export_research_daily_group_corpus.py --db private-knowledge/l0_state.db --include-missing --output-jsonl "$root/raw.jsonl" --manifest "$root/raw_manifest.json"
          python private-knowledge/l0/tools/canonicalize_research_daily_group_corpus_groups.py --input-jsonl "$root/raw.jsonl" --input-manifest "$root/raw_manifest.json" --db private-knowledge/l0_state.db --output-jsonl "$root/canonical.jsonl" --output-manifest "$root/canonical_manifest.json"
          python private-knowledge/l0/tools/dedupe_research_daily_group_corpus_snapshots.py --input-jsonl "$root/canonical.jsonl" --input-manifest "$root/canonical_manifest.json" --db private-knowledge/l0_state.db --output-jsonl "$root/daily_group_corpus.jsonl" --output-manifest "$root/daily_group_manifest.json" | tee "$root/dedupe_summary.txt"
          python private-knowledge/l0/tools/shard_research_daily_group_corpus.py --input-jsonl "$root/daily_group_corpus.jsonl" --output-dir "$root/shards" --manifest "$root/daily_group_manifest.json" --max-shard-bytes 4000000 | tee "$root/shard_summary.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'t75'; m=json.loads((root/'daily_group_manifest.json').read_text(encoding='utf-8')); d=m['source_observation_dedup']; c=m['group_identity_canonicalization']
          public={'source_db_rows':m['source_messages_total_rows'],'current_snapshot_rows':m['source_messages_total_rows']-m['source_messages_missing_in_latest_snapshot'],'historical_missing_rows':m['source_messages_missing_in_latest_snapshot'],'canonical_group_count':m['group_count'],'group_day_count':m['group_day_count'],'date_start':m['date_start'],'date_end':m['date_end'],'group_identity_remapped_messages':c['remapped_message_count'],'unresolved_group_identity_count':len(c['unresolved_raw_group_ids']),'dropped_historical_duplicate_messages':d['dropped_historical_duplicate_messages'],'retained_historical_only_messages':d['retained_historical_only_messages'],'excluded_demo_messages':d['excluded_group_messages'],'final_message_count':d['final_message_count'],'corpus_bytes':(root/'daily_group_corpus.jsonl').stat().st_size,'shard_count':m['corpus_persistence']['shard_count'],'max_persisted_shard_bytes':max(s['bytes'] for s in m['corpus_persistence']['shards'])}
          (root/'public_summary.json').write_text(json.dumps(public,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Persist final corpus
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/t75"
          copy_args=(--copy daily_group_manifest.json=daily_group_manifest.json --copy public_summary.json=public_summary.json)
          for path in "$root"/shards/daily_group_corpus.part-*.jsonl; do name=$(basename "$path"); cp "$path" "$root/$name"; copy_args+=(--copy "$name=$name"); done
          python scripts/private_results_publisher.py --source-root "$root" --source-sha 60857d0d6e12e3abaf1959d375bf8fcf128a7cf7 --harness-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --date 2026-08-19 --evaluation research_daily_group_final_corpus_t75 "${copy_args[@]}" 2>&1 | tee "$root/persist.log"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/t75"; { echo 'source_sha=60857d0d6e12e3abaf1959d375bf8fcf128a7cf7'; echo 'provider_call_count=0'; cat "$root/public_summary.json" 2>/dev/null || true; cat "$root/persist.log" 2>/dev/null | grep -E 'private_result_commit=|private_result_path=|PRIVATE_RESULT_PERSIST_PASS' || true; } > "$RUNNER_TEMP/t75-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t75-daily-group-final-corpus:${GITHUB_RUN_ID}" --body-file "$RUNNER_TEMP/t75-report.txt"
