name: t88-research-july9-split-diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t88_research_july9_split_diagnostic.yml']

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish safe locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "t88-july9-split:${GITHUB_RUN_ID}" --body "Private July 9 split diagnostic for exact source SHA 51f2bb81694aa90684f4c55851404e75992eab76."
      - uses: actions/checkout@v4
      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 51f2bb81694aa90684f4c55851404e75992eab76
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Rebuild and persist July 9
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t88-out"; sel="$RUNNER_TEMP/t88-private"; mkdir -p "$sel"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py --db private-knowledge/l0_state.db --output-dir "$out" >/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'t88-out'; sel=Path(os.environ['RUNNER_TEMP'])/'t88-private'
          summary=json.loads((out/'build_summary.json').read_text(encoding='utf-8'))
          idx=[json.loads(x) for x in (out/'model_inputs/packet_index.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          packets={r['packet_id']:(out/'model_inputs/packets'/f"{r['packet_id']}.txt").read_text(encoding='utf-8') for r in idx}
          rows=[r for r in idx if r['group_name']=='群聊_新创-中泰大佑木薯淀粉' and r['date']=='2026-07-09']
          data={'source_sha':'51f2bb81694aa90684f4c55851404e75992eab76','summary':summary,'rows':rows,'request_packets':[r['packet_id'] for r in rows if '我想看看coa和生产日期' in packets[r['packet_id']]],'certificate_packets':[r['packet_id'] for r in rows if 'CERTIFICATE OF PRODUCTION' in packets[r['packet_id']]]}
          (sel/'diagnostic.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          (sel/'july9.txt').write_text('\n'.join(f"===== {r['packet_id']} =====\n{packets[r['packet_id']]}" for r in rows),encoding='utf-8')
          PY
          eval_date="$(date -u +%F)"
          python scripts/private_results_publisher.py --source-root "$sel" --source-sha 51f2bb81694aa90684f4c55851404e75992eab76 --harness-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --date "$eval_date" --evaluation research_july9_split_diagnostic --copy diagnostic.json=diagnostic.json --copy july9.txt=july9.txt
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/t88-out" "$RUNNER_TEMP/t88-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-askpass.sh"
