name: t68-daily-group-source-inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t68_daily_group_source_inventory.yml']
permissions:
  contents: read
  issues: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: shangtang
    timeout-minutes: 20
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
      - name: Checkout private knowledge branch
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: experiment/research-daily-group-matter-corpus-001
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Inventory candidate corpus sources
        id: inventory
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git -C private-knowledge rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os, sqlite3, zipfile
          from pathlib import Path

          root = Path('private-knowledge')
          key_hints = {
              'group','group_name','group_id','chatroom','room','conversation','conversation_name',
              'time','timestamp','create_time','msg_time','date','datetime',
              'message','messages','msg','content','text','original_text','sender','attachments','quote_reply'
          }
          name_hints = ('wechat','weixin','message','chat','conversation','canonical','l0','raw','corpus','export')
          candidates = []

          def rel(p): return p.relative_to(root).as_posix()

          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              suffix = p.suffix.lower()
              rp = rel(p)
              low = rp.lower()
              size = p.stat().st_size
              interesting_name = any(h in low for h in name_hints)
              if suffix in {'.db','.sqlite','.sqlite3'}:
                  item = {'path': rp, 'kind': 'sqlite', 'bytes': size, 'tables': []}
                  try:
                      con = sqlite3.connect(f'file:{p}?mode=ro', uri=True)
                      for (table,) in con.execute("select name from sqlite_master where type='table' and name not like 'sqlite_%'"):
                          cols = [r[1] for r in con.execute(f'pragma table_info("{table}")')]
                          try:
                              count = con.execute(f'select count(*) from "{table}"').fetchone()[0]
                          except Exception:
                              count = None
                          score = sum(1 for c in cols if c.lower() in key_hints)
                          item['tables'].append({'name': table, 'columns': cols, 'row_count': count, 'hint_score': score})
                      con.close()
                  except Exception as e:
                      item['error'] = type(e).__name__
                  candidates.append(item)
              elif suffix in {'.json','.jsonl'} and (interesting_name or size > 10000):
                  keys = set()
                  sample_count = 0
                  try:
                      if suffix == '.jsonl':
                          with p.open('r', encoding='utf-8') as f:
                              for line in f:
                                  if sample_count >= 200: break
                                  line=line.strip()
                                  if not line: continue
                                  obj=json.loads(line)
                                  if isinstance(obj, dict): keys.update(obj.keys())
                                  sample_count += 1
                      else:
                          obj=json.loads(p.read_text(encoding='utf-8'))
                          vals = obj if isinstance(obj, list) else ([obj] if isinstance(obj, dict) else [])
                          for x in vals[:200]:
                              if isinstance(x, dict): keys.update(x.keys())
                              sample_count += 1
                      score = sum(1 for k in keys if k.lower() in key_hints)
                      if interesting_name or score >= 2:
                          candidates.append({'path': rp, 'kind': suffix[1:], 'bytes': size, 'sample_count': sample_count, 'keys': sorted(keys), 'hint_score': score})
                  except Exception:
                      if interesting_name:
                          candidates.append({'path': rp, 'kind': suffix[1:], 'bytes': size, 'error': 'parse_failed'})
              elif suffix == '.zip' and interesting_name:
                  item={'path': rp, 'kind': 'zip', 'bytes': size, 'members': []}
                  try:
                      with zipfile.ZipFile(p) as z:
                          for info in z.infolist()[:500]:
                              n=info.filename
                              if any(h in n.lower() for h in name_hints) or Path(n).suffix.lower() in {'.db','.sqlite','.sqlite3','.json','.jsonl'}:
                                  item['members'].append({'name': n, 'bytes': info.file_size})
                  except Exception:
                      item['error']='zip_failed'
                  candidates.append(item)

          # Prefer candidates with strong structural signals, but retain named likely sources for audit.
          candidates.sort(key=lambda x: (-max([t.get('hint_score',0) for t in x.get('tables',[])] + [x.get('hint_score',0)]), -x.get('bytes',0), x['path']))
          out={
              'schema_version':'research_daily_group_source_inventory.v1',
              'source_sha': os.environ.get('SOURCE_SHA_OVERRIDE') or os.popen('git -C private-knowledge rev-parse HEAD').read().strip(),
              'candidate_count': len(candidates),
              'candidates': candidates[:200],
          }
          Path('inventory.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('inventory_summary.txt').write_text(f"candidate_count={len(candidates)}\n", encoding='utf-8')
          PY
      - name: Persist private inventory
        id: persist
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
          SOURCE_SHA: ${{ steps.inventory.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t68"
          cp inventory.json "$RUNNER_TEMP/t68/inventory.json"
          cp inventory_summary.txt "$RUNNER_TEMP/t68/inventory_summary.txt"
          python scripts/private_results_publisher.py \
            --source-root "$RUNNER_TEMP/t68" \
            --source-sha "$SOURCE_SHA" \
            --harness-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --date 2026-08-19 \
            --evaluation research_daily_group_source_inventory_t68 \
            --copy inventory.json=inventory.json \
            --copy inventory_summary.txt=inventory_summary.txt \
            2>&1 | tee "$RUNNER_TEMP/t68-persist.log"
          cat "$RUNNER_TEMP/t68-persist.log"
      - name: Report public-safe summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.inventory.outputs.source_sha }}
        run: |
          COUNT=$(sed -n 's/^candidate_count=//p' inventory_summary.txt 2>/dev/null || echo unknown)
          {
            echo "source_sha=$SOURCE_SHA"
            echo "candidate_source_count=$COUNT"
            echo "provider_call_count=0"
            echo
            cat "$RUNNER_TEMP/t68-persist.log" 2>/dev/null | grep -E 'private_result_commit=|private_result_path=|PRIVATE_RESULT_PERSIST_PASS' || true
          } > "$RUNNER_TEMP/t68-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t68-daily-group-source-inventory:${GITHUB_RUN_ID}" --body-file "$RUNNER_TEMP/t68-report.txt"
