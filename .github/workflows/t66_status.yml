name: t66-status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t66_status.yml']
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report t66 status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow t66_second35_medium12000_business_actions.yml --limit 1 --json databaseId,status,conclusion,headSha,createdAt,updatedAt > /tmp/status.json
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t66-status:${GITHUB_RUN_ID}" --body "$(cat /tmp/status.json)"
