name: t80-inspect-cleaned-model-packets

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t80_inspect_cleaned_model_packets.yml']

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish safe locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t80-cleaned-packet-inspection:${GITHUB_RUN_ID}" \
            --body "Private cleaned model-packet content inspection started. No company content is included here."

      - name: Checkout public harness
        uses: actions/checkout@v4

      - name: Verify private result write access
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python scripts/private_results_preflight.py

      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 97f87ce04e9b0b2876445b52fc11e37ea5a4e427
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1

      - name: Build cleaned packets and select private samples
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t80-prepared"
          sel="$RUNNER_TEMP/t80-private"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$out" >/dev/null
          mkdir -p "$sel"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP'])/'t80-prepared'
          sel = Path(os.environ['RUNNER_TEMP'])/'t80-private'
          manifest = json.loads((out/'model_inputs/manifest.json').read_text(encoding='utf-8'))
          index = [json.loads(line) for line in (out/'model_inputs/packet_index.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]

          by_day = {}
          for row in index:
              key = (row['group_day_row'], row['group_name'], row['date'])
              bucket = by_day.setdefault(key, {'message_count':0, 'packet_ids':[], 'packet_chars':0})
              bucket['message_count'] += int(row['message_count'])
              bucket['packet_ids'].append(row['packet_id'])
              bucket['packet_chars'] += int(row['packet_chars'])

          days = sorted([
              {'group_day_row':k[0], 'group_name':k[1], 'date':k[2], **v}
              for k,v in by_day.items()
          ], key=lambda r:(-r['message_count'], r['date'], r['group_name']))

          picks = []
          for label, pos in [('dense1',0),('dense2',1),('dense3',2),('upper_mid', max(0,len(days)//4)),('median', len(days)//2),('low', max(0,len(days)-1))]:
              row = dict(days[pos])
              row['label'] = label
              picks.append(row)

          # Add one group-day that became empty after cleanup to verify raw source content.
          clean_rows = {r['group_day_row'] for r in days}
          evidence_records = [json.loads(line) for line in (out/'evidence/daily_group_corpus.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          empty = None
          for i, rec in enumerate(evidence_records,1):
              if i not in clean_rows:
                  empty = {'group_day_row':i, 'group_name':rec.get('group_name'), 'date':rec.get('date'), 'source_message_count':rec.get('message_count')}
                  (sel/'empty_source_day.json').write_text(json.dumps(rec, ensure_ascii=False, indent=2), encoding='utf-8')
                  break

          selection = {'source_sha':'97f87ce04e9b0b2876445b52fc11e37ea5a4e427','picks':picks,'empty_day':empty}
          (sel/'selection.json').write_text(json.dumps(selection, ensure_ascii=False, indent=2), encoding='utf-8')
          for pick in picks:
              chunks = []
              for pid in pick['packet_ids']:
                  p = out/'model_inputs/packets'/f'{pid}.txt'
                  chunks.append(f'===== {pid} =====\n'+p.read_text(encoding='utf-8'))
              (sel/f"{pick['label']}.txt").write_text('\n'.join(chunks), encoding='utf-8')
          PY

      - name: Persist private inspection samples
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          python scripts/private_results_publisher.py \
            --source-root "$RUNNER_TEMP/t80-private" \
            --source-sha 97f87ce04e9b0b2876445b52fc11e37ea5a4e427 \
            --harness-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation research_cleaned_packet_content_inspection \
            --copy selection.json=selection.json \
            --copy dense1.txt=dense1.txt \
            --copy dense2.txt=dense2.txt \
            --copy dense3.txt=dense3.txt \
            --copy upper_mid.txt=upper_mid.txt \
            --copy median.txt=median.txt \
            --copy low.txt=low.txt \
            --copy empty_source_day.json=empty_source_day.json

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/t80-prepared" "$RUNNER_TEMP/t80-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
