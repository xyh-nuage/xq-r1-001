name: t24

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private source commit
        required: true
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: remote-t24-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t24:'))
    environment: deepseek
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish safe run locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create --repo "${{ github.repository }}" --title "t24-c-stage-later-evidence-run:${{ github.run_id }}" --body "Safe run locator for the two-case Seen-only D-stage chronological upper-bound diagnostic. No company content."

      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t24:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha=INVALID'; exit 2; }
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_sha=INVALID'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Prepare exact private source and immutable t23 diagnostic
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/later-evidence-source"
          repo="$root/source"
          causal_commit="e607eb70b825e725cf24b003fbd950256e6c7124"
          causal_path="evaluation_results/research_c_stage_context_sufficiency/2026-08-18_0273a20a_run32188008999/causal_diagnostics.json"
          causal_blob="455a8d266bc096b0f9796c87997f6a85131de656"
          mkdir -p "$root"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t24-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"
          diag_dir="$repo/l1/evaluation/vnext/runtime/context_sufficiency_input"
          mkdir -p "$diag_dir"
          git -C "$repo" fetch -q --depth=1 origin "$causal_commit"
          git -C "$repo" show "$causal_commit:$causal_path" > "$diag_dir/t23_causal_diagnostics.json"
          test "$(git hash-object "$diag_dir/t23_causal_diagnostics.json")" = "$causal_blob"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 't23_causal_diagnostics=VERIFIED_IMMUTABLE_INPUT'

      - name: Run D-stage later-evidence diagnostic
        shell: bash
        env:
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.L1_LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || secrets.L1_LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL || secrets.L1_LLM_MODEL }}
          L1_LLM_TIMEOUT_SECONDS: '90'
          L1_LLM_MAX_RETRIES: '2'
          L1_LLM_RETRY_BACKOFF_SECONDS: '1'
          L1_LLM_MAX_COMPLETION_TOKENS: '2000'
          L1_LLM_MAX_COMPLETION_FIELD: max_tokens
          L1_LLM_DISABLE_REASONING: 'true'
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/prepared_source_runner.py" \
            --source-dir "$RUNNER_TEMP/later-evidence-source/source" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --plan "$RUNNER_TEMP/harness/plans/t24.json"

      - name: Audit D-stage diagnostics numerically
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/later-evidence-source/source/l1/evaluation/vnext/runtime/research_c_stage_later_evidence/later_evidence_diagnostic.json"
          python - "$file" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          s = data['summary']
          if s['d_candidates'] != 2:
              raise SystemExit('D_CANDIDATE_COUNT_DRIFT')
          if s['silver_or_reference_used_in_model_input'] is not False or s['silver_loaded_after_all_model_calls'] is not True or s['unseen_accessed'] is not False:
              raise SystemExit('BOUNDARY_VIOLATION')
          if any(s[k] != 0 for k in ('attachment_body_reads','ocr_calls','raw_file_reparse')):
              raise SystemExit('ATTACHMENT_BOUNDARY_VIOLATION')
          for key in ('d_candidates','genuine_later_evidence_cases','genuine_cases_reexposed_later','genuine_cases_with_candidate_id_fragmentation','model_calls','model_call_failures','model_retries'):
              print(f'd_{key}={int(s[key])}')
          for key, value in sorted((s.get('classification_counts') or {}).items()):
              print('d_classification_' + key.lower() + '=' + str(int(value)))
          print('RESEARCH_C_STAGE_LATER_EVIDENCE_NUMERIC_AUDIT_PASS')
          PY

      - name: Persist private D-stage result
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/later-evidence-source/source"
          base="l1/evaluation/vnext/runtime/research_c_stage_later_evidence"
          test -f "$root/$base/later_evidence_diagnostic.json"
          eval_date="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$root" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation "research_c_stage_later_evidence" \
            --copy "$base/later_evidence_diagnostic.json=later_evidence_diagnostic.json"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/later-evidence-source" "$RUNNER_TEMP/prepared-source-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/t24-read-askpass.sh" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
