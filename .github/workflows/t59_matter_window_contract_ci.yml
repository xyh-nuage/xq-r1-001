name: t59-matter-window-contract-ci
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t59_matter_window_contract_ci.yml']
permissions:
  contents: read
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch exact private source
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/source"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/xyh-nuage/knowledge.git
          ask="$RUNNER_TEMP/askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$KNOWLEDGE_READ_TOKEN";; esac\n' > "$ask"
          chmod 700 "$ask"
          export GIT_ASKPASS="$ask" GIT_TERMINAL_PROMPT=0
          git -C "$root" fetch -q --depth=1 origin 6dc7fbb7d1d23a28cb38a647a7594e2884e3acf1
          git -C "$root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = 6dc7fbb7d1d23a28cb38a647a7594e2884e3acf1
      - name: Frozen-boundary diff gate
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/source"
          ask="$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$ask" GIT_TERMINAL_PROMPT=0
          git -C "$root" fetch -q --depth=1 origin 5093c76e39b66aea3d2e34943e268449e0e878b1
          if git -C "$root" diff --name-only 5093c76e39b66aea3d2e34943e268449e0e878b1..6dc7fbb7d1d23a28cb38a647a7594e2884e3acf1 -- l1/l1_processor/local_semantics/ | grep -q .; then
            echo FROZEN_LOCAL_SEMANTICS_CHANGED
            exit 1
          fi
          echo FROZEN_LOCAL_SEMANTICS_UNCHANGED
      - name: Run contract tests
        id: test
        run: |
          set -o pipefail
          python -m pip install -q pytest
          cd "$RUNNER_TEMP/source"
          python -m pytest -q l1/tests/test_research_matter_window_packet.py 2>&1 | tee "$RUNNER_TEMP/t59.log"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'source_sha=6dc7fbb7d1d23a28cb38a647a7594e2884e3acf1'
            echo 'provider_call_count=0'
            echo 'frozen_shared_local_semantics_expected_unchanged=true'
            echo
            cat "$RUNNER_TEMP/t59.log" 2>/dev/null || true
          } > "$RUNNER_TEMP/t59-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t59-matter-window-contract-ci:${GITHUB_RUN_ID}" --body "$(cat "$RUNNER_TEMP/t59-report.txt")"
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/askpass.sh" "$RUNNER_TEMP/t59.log" "$RUNNER_TEMP/t59-report.txt"
