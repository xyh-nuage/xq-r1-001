name: t01u

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact frozen private Research source commit
        required: true
        default: 453cc48e1e495e9cad24bad7d96d6ff744b65411
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t01u-formal-unseen
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t01u:'))
    environment: deepseek
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve exact source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t01u:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$source" = "453cc48e1e495e9cad24bad7d96d6ff744b65411" || { echo 'formal_source_sha=REJECTED'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access before any model call
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Run the single frozen DeepSeek unseen pass and score after predictions complete
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.L1_LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || secrets.L1_LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL || secrets.L1_LLM_MODEL }}
          L1_LLM_TIMEOUT_SECONDS: '60'
          L1_LLM_MAX_RETRIES: '2'
          L1_LLM_RETRY_BACKOFF_SECONDS: '1'
          L1_LLM_MAX_COMPLETION_TOKENS: '3000'
          L1_LLM_MAX_COMPLETION_FIELD: 'max_tokens'
          L1_LLM_DISABLE_REASONING: 'true'
        run: python "$RUNNER_TEMP/harness/scripts/private_unseen_formal_runner.py" --source-sha "${{ steps.source.outputs.value }}"

      - name: Persist formal predictions and frozen-score result privately
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$RUNNER_TEMP/private-unseen-formal/source" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation "l1_chat_unseen_formal" \
            --copy "l1/evaluation/unseen/formal_unseen_execution_contract.v1.json=formal_unseen_execution_contract.v1.json" \
            --copy "l1/evaluation/unseen/unseen_evaluator_contract.v1.json=unseen_evaluator_contract.v1.json" \
            --copy "l1/evaluation/unseen/.runtime/formal/predictions.json=predictions.json" \
            --copy "l1/evaluation/unseen/.runtime/formal/prediction_summary.json=prediction_summary.json" \
            --copy "l1/evaluation/unseen/.runtime/formal/evaluation.json=evaluation.json" \
            --copy "l1/evaluation/unseen/.runtime/formal/formal_report.json=formal_report.json"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/private-unseen-formal" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-unseen-formal-askpass.sh"
