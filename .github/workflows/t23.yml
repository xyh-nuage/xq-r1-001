name: t23

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private source commit
        required: true
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: remote-t23-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t23:'))
    environment: deepseek
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Publish safe run locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create --repo "${{ github.repository }}" --title "t23-c-stage-context-sufficiency-run:${{ github.run_id }}" --body "Safe run locator for cumulative Research C-stage Problems B/A/C plus post-hoc D/E diagnostics. No company content."

      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t23:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha=INVALID'; exit 2; }
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_sha=INVALID'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Prepare exact private source and immutable inputs
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/context-sufficiency-source"
          repo="$root/source"
          l1_input_commit="67389cf13187e1c768808f268173437a13552e1e"
          l1_input_path="evaluation_results/research_slice_a_l1_attachment_materialization/2026-08-18_0c2adfff_run32096296005/candidate_db_export.json"
          l1_input_blob="9b95be232e3a500931f2faf03c5a238dc475c641"
          baseline_commit="18d1bcd12e98e631d85241b40939a8ef3c204b30"
          baseline_path="evaluation_results/research_c_stage_decision_semantics_convergence/2026-08-18_52db7f20_run32131806697/failure_attribution.json"
          baseline_blob="e87ff7b10b761e7ab9a18ab5f203686610c8a38d"
          manifest_commit="1935e7551d58bca864c3383d0028203896fd2788"
          manifest_path="evaluation_results/research_c_stage_context_sufficiency_manifest/2026-08-18_036baedc_run32187281880/seen_manifest.json"
          manifest_blob="7ab62ed4f012f63da86a3759e5c16d60a588f36d"
          mkdir -p "$root"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t23-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"
          input_dir="$repo/l1/evaluation/vnext/runtime/incremental_matter_input"
          diag_dir="$repo/l1/evaluation/vnext/runtime/context_sufficiency_input"
          mkdir -p "$input_dir" "$diag_dir"
          git -C "$repo" fetch -q --depth=1 origin "$l1_input_commit"
          git -C "$repo" show "$l1_input_commit:$l1_input_path" > "$input_dir/candidate_db_export.json"
          test "$(git hash-object "$input_dir/candidate_db_export.json")" = "$l1_input_blob"
          git -C "$repo" fetch -q --depth=1 origin "$baseline_commit"
          git -C "$repo" show "$baseline_commit:$baseline_path" > "$diag_dir/t21_failure_attribution.json"
          test "$(git hash-object "$diag_dir/t21_failure_attribution.json")" = "$baseline_blob"
          git -C "$repo" fetch -q --depth=1 origin "$manifest_commit"
          git -C "$repo" show "$manifest_commit:$manifest_path" > "$diag_dir/seen_manifest.json"
          test "$(git hash-object "$diag_dir/seen_manifest.json")" = "$manifest_blob"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 'c_stage_context_inputs=VERIFIED_IMMUTABLE'

      - name: Run cumulative context-sufficiency replay
        shell: bash
        env:
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.L1_LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || secrets.L1_LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL || secrets.L1_LLM_MODEL }}
          L1_LLM_TIMEOUT_SECONDS: '90'
          L1_LLM_MAX_RETRIES: '2'
          L1_LLM_RETRY_BACKOFF_SECONDS: '1'
          L1_LLM_MAX_COMPLETION_TOKENS: '3000'
          L1_LLM_MAX_COMPLETION_FIELD: max_tokens
          L1_LLM_DISABLE_REASONING: 'true'
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/prepared_source_runner.py" \
            --source-dir "$RUNNER_TEMP/context-sufficiency-source/source" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --plan "$RUNNER_TEMP/harness/plans/t23.json"

      - name: Audit causal diagnostics numerically
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/context-sufficiency-source/source/l1/evaluation/vnext/runtime/research_c_stage_context_sufficiency"
          python - "$base/causal_diagnostics.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          s = data['summary']
          fields = [
              'manifest_cases','text_history_cases','attachment_cases',
              'problem_b_recovered_correct','problem_a_shadow_recoverable_correct',
              'problem_c_recovered_correct','problem_d_later_evidence_candidates',
              'problem_d_candidates_reexposed_later','candidate_id_fragmentation_amplifier_cases'
          ]
          for key in fields:
              value = s[key]
              if not isinstance(value, int):
                  raise SystemExit('NON_NUMERIC_CAUSAL_VALUE')
              print(f'causal_{key}={value}')
          if s['manifest_cases'] != 30 or s['attachment_cases'] != 7 or s['text_history_cases'] != 23:
              raise SystemExit('MANIFEST_COUNT_DRIFT')
          if s['silver_or_reference_used_in_runtime'] is not False or s['unseen_accessed'] is not False:
              raise SystemExit('BOUNDARY_VIOLATION')
          for key, value in sorted((s.get('attachment_boundary_counts') or {}).items()):
              if not isinstance(value, int):
                  raise SystemExit('NON_NUMERIC_ATTACHMENT_BOUNDARY_VALUE')
              print('attachment_boundary_' + key.lower() + '=' + str(value))
          print('RESEARCH_C_STAGE_CAUSAL_NUMERIC_AUDIT_PASS')
          PY

      - name: Persist private context-sufficiency result
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/context-sufficiency-source/source"
          base="l1/evaluation/vnext/runtime/research_c_stage_context_sufficiency"
          input="l1/evaluation/vnext/runtime/incremental_matter_input"
          diag="l1/evaluation/vnext/runtime/context_sufficiency_input"
          for file in summary.json final_registry.json transition_log.jsonl posthoc_evaluation.json attachment_demand_map.json failure_attribution.json flat.json problem_b_metrics.json problem_a_shadow_metrics.json problem_c_metrics.json causal_diagnostics.json; do
            test -f "$root/$base/$file"
          done
          test -f "$root/$input/rehydration_summary.json"
          test -f "$root/$diag/seen_manifest.json"
          eval_date="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$root" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation "research_c_stage_context_sufficiency" \
            --copy "$base/summary.json=summary.json" \
            --copy "$base/final_registry.json=final_registry.json" \
            --copy "$base/transition_log.jsonl=transition_log.jsonl" \
            --copy "$base/posthoc_evaluation.json=posthoc_evaluation.json" \
            --copy "$base/attachment_demand_map.json=attachment_demand_map.json" \
            --copy "$base/failure_attribution.json=failure_attribution.json" \
            --copy "$base/flat.json=flat.json" \
            --copy "$base/problem_b_metrics.json=problem_b_metrics.json" \
            --copy "$base/problem_a_shadow_metrics.json=problem_a_shadow_metrics.json" \
            --copy "$base/problem_c_metrics.json=problem_c_metrics.json" \
            --copy "$base/causal_diagnostics.json=causal_diagnostics.json" \
            --copy "$input/rehydration_summary.json=rehydration_summary.json" \
            --copy "$diag/seen_manifest.json=seen_manifest.json"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/context-sufficiency-source" "$RUNNER_TEMP/prepared-source-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/t23-read-askpass.sh" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
