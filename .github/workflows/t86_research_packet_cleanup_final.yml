name: t86-research-packet-cleanup-final

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t86_research_packet_cleanup_final.yml']

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish safe locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t86-packet-cleanup-final:${GITHUB_RUN_ID}" --body "Final deterministic packet cleanup validation for exact source SHA 51f2bb81694aa90684f4c55851404e75992eab76. No company content is included here."
      - uses: actions/checkout@v4
      - name: Verify private result write access
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python scripts/private_results_preflight.py
      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 51f2bb81694aa90684f4c55851404e75992eab76
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Focused tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q private-knowledge/l1/tests/test_prepare_research_daily_group_model_inputs.py
      - name: Full real-data validation and persistence
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t86-out"; sel="$RUNNER_TEMP/t86-private"; mkdir -p "$sel"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py --db private-knowledge/l0_state.db --output-dir "$out" >/dev/null
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'t86-out'; sel=Path(os.environ['RUNNER_TEMP'])/'t86-private'
          summary=json.loads((out/'build_summary.json').read_text(encoding='utf-8'))
          idx=[json.loads(x) for x in (out/'model_inputs/packet_index.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          packets={r['packet_id']:(out/'model_inputs/packets'/f"{r['packet_id']}.txt").read_text(encoding='utf-8') for r in idx}
          combined='\n'.join(packets.values())
          assert summary['schema_version']=='research_daily_group_model_inputs_summary.v4'
          assert re.search(r'消息\d+ \| \d{1,2}月\d{1,2}日 \d{1,2}:\d{2} \| \[系统\]\n\d{1,2}月\d{1,2}日 \d{1,2}:\d{2}',combined) is None
          assert '语音6"秒未播放' not in combined and '语音（未转写，6秒）' in combined

          header=re.compile(r'^消息(\d+) \| (.*?) \| (.*)$')
          def blocks(text):
              result=[]; cur=None
              for line in text.splitlines():
                  m=header.match(line)
                  if m:
                      if cur: result.append(cur)
                      cur={'ordinal':int(m.group(1)),'time':m.group(2),'sender':m.group(3),'body':[]}
                  elif cur is not None: cur['body'].append(line)
              if cur: result.append(cur)
              for b in result: b['text']='\n'.join(b['body']).strip()
              return result

          all_blocks=[]
          for pid,text in packets.items():
              for b in blocks(text): all_blocks.append((pid,b))
          assert not any(a[1]['sender'] in {'system','系统','[系统]'} and b[1]['sender'] in {'system','系统','[系统]'} and a[1]['time']==b[1]['time'] and a[1]['text']==b[1]['text'] for a,b in zip(all_blocks,all_blocks[1:]) if a[0]==b[0])
          human='@Winter🍥\u2005亲，6.15货转的这个，是从6.16收下家仓储么'
          assert combined.count(human)>=2

          median_rows=[r for r in idx if r['group_name']=='群聊_新创~诚泰通合作群' and r['date']=='2026-07-01']
          assert len(median_rows)==1
          median=packets[median_rows[0]['packet_id']]
          assert median.count('文件：诚泰通新创267179079结算单.pdf')==1
          assert '7月1日 11:22 | [系统]' not in median

          j8_rows=[r for r in idx if r['group_name']=='群聊_新创-中泰大佑木薯淀粉' and r['date']=='2026-07-08']
          j8='\n'.join(packets[r['packet_id']] for r in j8_rows)
          related=[b for b in blocks(j8) if 'image_20260708_中泰-季磊_a06198ec2263e747.jpg' in b['text']]
          assert len(related)==2
          assert sum('图片内容：' in b['text'] for b in related)==1
          assert any('图片引用 Bonn 的消息' in b['text'] for b in related)

          j9_rows=[r for r in idx if r['group_name']=='群聊_新创-中泰大佑木薯淀粉' and r['date']=='2026-07-09']
          assert len(j9_rows)==2
          p1,p2=[packets[r['packet_id']] for r in j9_rows]
          assert '消息28 | 2026-07-09 15:42:00 | 中泰-季磊' in p1
          assert '消息29 | 2026-07-09 16:21:00 | system' in p2
          assert '我想看看coa和生产日期' in p2 and 'CERTIFICATE OF PRODUCTION' in p2
          assert summary['natural_gap_split_boundary_count']>=1

          # The one observed orphan video UI label must be absent as its own message body.
          assert not any(b['sender']=='杨森🍀℡' and b['time']=='2026-07-16 11:12:00' and b['text']=='视频' for _,b in all_blocks)

          report={'source_sha':'51f2bb81694aa90684f4c55851404e75992eab76','summary':summary,'median_packet_id':median_rows[0]['packet_id'],'july8_packet_ids':[r['packet_id'] for r in j8_rows],'july9_packet_ids':[r['packet_id'] for r in j9_rows]}
          (sel/'validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          (sel/'median.txt').write_text(median,encoding='utf-8')
          (sel/'july8.txt').write_text(j8,encoding='utf-8')
          (sel/'july9.txt').write_text('\n'.join(f"===== {r['packet_id']} =====\n{packets[r['packet_id']]}" for r in j9_rows),encoding='utf-8')
          PY
          eval_date="$(date -u +%F)"
          python scripts/private_results_publisher.py --source-root "$sel" --source-sha 51f2bb81694aa90684f4c55851404e75992eab76 --harness-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --date "$eval_date" --evaluation research_packet_cleanup_final_validation --copy validation.json=validation.json --copy median.txt=median.txt --copy july8.txt=july8.txt --copy july9.txt=july9.txt
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/t86-out" "$RUNNER_TEMP/t86-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
