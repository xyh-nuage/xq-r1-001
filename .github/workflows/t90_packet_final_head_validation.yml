name: t90-packet-final-head-validation

on:
  push:
    paths:
      - '.github/workflows/t90_packet_final_head_validation.yml'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Publish safe locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t90-packet-final-head:${GITHUB_RUN_ID}" \
            --body "Final deterministic model-packet validation for exact source SHA 7b121b3501618b2fccf856b40e0a55a91f5d3f67. No company content is included here."

      - uses: actions/checkout@v4

      - name: Verify private result write access
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python scripts/private_results_preflight.py

      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 7b121b3501618b2fccf856b40e0a55a91f5d3f67
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1

      - name: Run focused tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q \
            private-knowledge/l1/tests/test_prepare_research_daily_group_model_inputs.py \
            private-knowledge/l1/tests/test_prepare_research_daily_group_model_inputs_global_split.py

      - name: Rebuild full real corpus and persist summary
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t90-out"
          sel="$RUNNER_TEMP/t90-private"
          mkdir -p "$sel"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$out" >/dev/null
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 't90-out'
          sel = Path(os.environ['RUNNER_TEMP']) / 't90-private'
          summary = json.loads((out / 'build_summary.json').read_text(encoding='utf-8'))
          idx = [json.loads(line) for line in (out / 'model_inputs/packet_index.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          packets = {r['packet_id']: (out / 'model_inputs/packets' / f"{r['packet_id']}.txt").read_text(encoding='utf-8') for r in idx}
          combined = '\n'.join(packets.values())

          expected = {
              'schema_version': 'research_daily_group_model_inputs_summary.v4',
              'source_group_day_count': 365,
              'group_day_count': 304,
              'dropped_empty_group_day_count': 61,
              'source_message_count': 7395,
              'message_count': 4908,
              'packet_count': 306,
              'full_day_group_day_count': 302,
              'split_group_day_count': 2,
              'removed_control_message_count': 2317,
              'removed_system_time_separator_count': 2037,
              'removed_listener_restart_count': 280,
              'deduplicated_system_event_count': 9,
              'dropped_orphan_transport_label_count': 3,
              'normalized_voice_placeholder_count': 12,
              'normalized_attachment_name_count': 510,
              'deduplicated_transport_attachment_count': 152,
              'deduplicated_relation_attachment_count': 4,
              'dropped_duplicate_transport_message_count': 146,
              'dropped_duplicate_named_transport_shell_count': 12,
              'partially_deduplicated_transport_message_count': 6,
              'packet_budget_chars': 16000,
              'provider_call_count': 0,
          }
          for key, value in expected.items():
              assert summary[key] == value, (key, summary[key], value)

          assert re.search(r'消息\d+ \| \d{1,2}月\d{1,2}日 \d{1,2}:\d{2} \| \[系统\]\n\d{1,2}月\d{1,2}日 \d{1,2}:\d{2}', combined) is None
          assert '语音6"秒未播放' not in combined
          assert '语音（未转写，6秒）' in combined
          human = '@Winter🍥\u2005亲，6.15货转的这个，是从6.16收下家仓储么'
          assert combined.count(human) >= 2

          median_rows = [r for r in idx if r['group_name'] == '群聊_新创~诚泰通合作群' and r['date'] == '2026-07-01']
          assert len(median_rows) == 1
          median = packets[median_rows[0]['packet_id']]
          assert median.count('文件：诚泰通新创267179079结算单.pdf') == 1

          j9_rows = [r for r in idx if r['group_name'] == '群聊_新创-中泰大佑木薯淀粉' and r['date'] == '2026-07-09']
          assert len(j9_rows) == 2
          request_holders = [r for r in j9_rows if '我想看看coa和生产日期' in packets[r['packet_id']]]
          certificate_holders = [r for r in j9_rows if 'CERTIFICATE OF PRODUCTION' in packets[r['packet_id']]]
          assert len(request_holders) == 1 and len(certificate_holders) == 1
          assert request_holders[0]['packet_id'] == certificate_holders[0]['packet_id']

          report = {
              'source_sha': '7b121b3501618b2fccf856b40e0a55a91f5d3f67',
              'summary': summary,
              'july9_rows': j9_rows,
              'july9_request_packet_id': request_holders[0]['packet_id'],
              'validated_invariants': [
                  'focused_tests',
                  'full_real_rebuild',
                  'deterministic_cleanup_counts',
                  'human_duplicate_preserved',
                  'median_duplicate_file_removed',
                  'july9_request_and_production_certificate_same_packet',
              ],
          }
          (sel / 'validation.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          eval_date="$(date -u +%F)"
          python scripts/private_results_publisher.py \
            --source-root "$sel" \
            --source-sha 7b121b3501618b2fccf856b40e0a55a91f5d3f67 \
            --harness-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --date "$eval_date" \
            --evaluation research_packet_final_head_validation \
            --copy validation.json=validation.json

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/t90-out" "$RUNNER_TEMP/t90-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
