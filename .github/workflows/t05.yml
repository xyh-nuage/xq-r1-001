name: t05

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private spreadsheet implementation commit
        required: true
        default: 23c63a6b0e50cd2fbbd530b3a3c6afa02a556e29
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t05
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t05:'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t05:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify sealed spreadsheet audit plan
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.source.outputs.value }}" "$RUNNER_TEMP/harness/plans/t05.json" <<'PY'
          import json
          import sys
          source, plan_path = sys.argv[1], sys.argv[2]
          plan = json.load(open(plan_path, encoding="utf-8"))
          assert plan["target"] == "t05"
          assert plan["mode"] == "deterministic_no_llm"
          assert plan["implementation_sha"] == source == "23c63a6b0e50cd2fbbd530b3a3c6afa02a556e29"
          assert plan["fixture_source_sha"] == "4d514701e01308129a76c609d23fe51a0ec92249"
          assert plan["semantic_changes"] is False
          print("plan=SEALED")
          print(f"implementation_sha={source}")
          print(f"fixture_source_sha={plan['fixture_source_sha']}")
          PY

      - name: Verify private result write access
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Checkout exact private implementation and fixtures
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.value }}
          FIXTURE_SHA: 4d514701e01308129a76c609d23fe51a0ec92249
        run: |
          set -euo pipefail
          test -n "$KNOWLEDGE_READ_TOKEN"
          askpass="$RUNNER_TEMP/knowledge-read-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
          *Username*) printf '%s\n' x-access-token ;;
          *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          SH
          chmod 700 "$askpass"
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS="$askpass"
          repo="https://github.com/xyh-nuage/knowledge.git"

          git init -q "$RUNNER_TEMP/private-impl"
          git -C "$RUNNER_TEMP/private-impl" remote add origin "$repo"
          git -C "$RUNNER_TEMP/private-impl" fetch -q --depth=1 origin "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/private-impl" rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git -C "$RUNNER_TEMP/private-impl" checkout -q --detach FETCH_HEAD

          git init -q "$RUNNER_TEMP/private-fixtures"
          git -C "$RUNNER_TEMP/private-fixtures" remote add origin "$repo"
          git -C "$RUNNER_TEMP/private-fixtures" fetch -q --depth=1 origin "$FIXTURE_SHA"
          test "$(git -C "$RUNNER_TEMP/private-fixtures" rev-parse FETCH_HEAD)" = "$FIXTURE_SHA"
          git -C "$RUNNER_TEMP/private-fixtures" checkout -q --detach FETCH_HEAD

          rm -f "$askpass"
          echo "private_checkouts=PASS"

      - name: Install frozen L0 dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e "$RUNNER_TEMP/private-impl/l0[dev]"
          python - <<'PY'
          import openpyxl, xlrd
          print(f"openpyxl={openpyxl.__version__}")
          print(f"xlrd={xlrd.__version__}")
          PY

      - name: Run deterministic spreadsheet fixture audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spreadsheet-audit"
          python "$RUNNER_TEMP/harness/scripts/run_spreadsheet_fixture_audit.py" \
            --implementation-root "$RUNNER_TEMP/private-impl" \
            --fixture-root "$RUNNER_TEMP/private-fixtures/media_fixtures" \
            --implementation-sha "${{ steps.source.outputs.value }}" \
            --fixture-sha "4d514701e01308129a76c609d23fe51a0ec92249" \
            --output-dir "$RUNNER_TEMP/spreadsheet-audit"

      - name: Run deterministic preview coverage audit
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/run_spreadsheet_coverage_audit.py" \
            --implementation-root "$RUNNER_TEMP/private-impl" \
            --fixture-root "$RUNNER_TEMP/private-fixtures/media_fixtures" \
            --implementation-sha "${{ steps.source.outputs.value }}" \
            --fixture-sha "4d514701e01308129a76c609d23fe51a0ec92249" \
            --output-dir "$RUNNER_TEMP/spreadsheet-audit"

      - name: Inspect representative preview cases privately
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/inspect_spreadsheet_preview_cases.py" \
            --implementation-root "$RUNNER_TEMP/private-impl" \
            --fixture-root "$RUNNER_TEMP/private-fixtures/media_fixtures" \
            --output-dir "$RUNNER_TEMP/spreadsheet-audit"

      - name: Persist detailed spreadsheet audit privately
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$RUNNER_TEMP/spreadsheet-audit" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation "spreadsheet_fixture_audit" \
            --copy "summary.json=summary.json" \
            --copy "details.json=details.json" \
            --copy "coverage_summary.json=coverage_summary.json" \
            --copy "coverage_details.json=coverage_details.json" \
            --copy "inspection.json=inspection.json"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/private-impl" "$RUNNER_TEMP/private-fixtures" \
            "$RUNNER_TEMP/spreadsheet-audit" "$RUNNER_TEMP/harness" \
            "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight"
