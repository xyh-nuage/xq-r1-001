name: t05

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private L1 spreadsheet-structure implementation commit
        required: true
        default: 66f33db182b98948e730db9d2daeeed041f36a6b
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t05
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t05:'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t05:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$source" = "66f33db182b98948e730db9d2daeeed041f36a6b"
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify sealed no-LLM plan
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.source.outputs.value }}" "$RUNNER_TEMP/harness/plans/t05.json" <<'PY'
          import json
          import sys
          source, plan_path = sys.argv[1], sys.argv[2]
          plan = json.load(open(plan_path, encoding="utf-8"))
          assert plan["target"] == "t05"
          assert plan["mode"] == "deterministic_no_llm"
          assert plan["implementation_sha"] == source == "66f33db182b98948e730db9d2daeeed041f36a6b"
          assert plan["base_sha"] == "23c63a6b0e50cd2fbbd530b3a3c6afa02a556e29"
          assert plan["fixture_source_sha"] == "4d514701e01308129a76c609d23fe51a0ec92249"
          assert plan["constraints"]["l0_changes_forbidden"] is True
          assert plan["constraints"]["llm_calls_forbidden"] is True
          assert plan["constraints"]["full_row_values_forbidden"] is True
          assert plan["constraints"]["hidden_sheet_columns_excluded_from_semantic_schema"] is True
          assert plan["semantic_changes"] is False
          print("plan=SEALED")
          print(f"source_sha={source}")
          print("model_calls=FORBIDDEN")
          PY

      - name: Verify private result write access
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Checkout exact private source and fixtures
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.value }}
          BASE_SHA: 23c63a6b0e50cd2fbbd530b3a3c6afa02a556e29
          FIXTURE_SHA: 4d514701e01308129a76c609d23fe51a0ec92249
        run: |
          set -euo pipefail
          test -n "$KNOWLEDGE_READ_TOKEN"
          askpass="$RUNNER_TEMP/knowledge-read-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
          *Username*) printf '%s\n' x-access-token ;;
          *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          SH
          chmod 700 "$askpass"
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS="$askpass"
          repo="https://github.com/xyh-nuage/knowledge.git"

          git init -q "$RUNNER_TEMP/private-source"
          git -C "$RUNNER_TEMP/private-source" remote add origin "$repo"
          git -C "$RUNNER_TEMP/private-source" fetch -q --depth=1 origin "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/private-source" rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git -C "$RUNNER_TEMP/private-source" checkout -q --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/private-source" fetch -q --depth=1 origin "$BASE_SHA"
          test "$(git -C "$RUNNER_TEMP/private-source" rev-parse FETCH_HEAD)" = "$BASE_SHA"

          git init -q "$RUNNER_TEMP/private-fixtures"
          git -C "$RUNNER_TEMP/private-fixtures" remote add origin "$repo"
          git -C "$RUNNER_TEMP/private-fixtures" fetch -q --depth=1 origin "$FIXTURE_SHA"
          test "$(git -C "$RUNNER_TEMP/private-fixtures" rev-parse FETCH_HEAD)" = "$FIXTURE_SHA"
          git -C "$RUNNER_TEMP/private-fixtures" checkout -q --detach FETCH_HEAD

          rm -f "$askpass"
          echo "private_checkouts=PASS"

      - name: Enforce no L0 changes
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.value }}
          BASE_SHA: 23c63a6b0e50cd2fbbd530b3a3c6afa02a556e29
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-files.txt"
          git -C "$RUNNER_TEMP/private-source" diff --name-only "$BASE_SHA" "$SOURCE_SHA" > "$changed"
          test -s "$changed"
          if grep -E '^l0/' "$changed" >/dev/null; then
            echo 'l0_changes=FORBIDDEN_FOUND'
            exit 2
          fi
          non_l1="$(grep -Ev '^l1/' "$changed" || true)"
          test -z "$non_l1" || { echo 'non_l1_changes=FORBIDDEN_FOUND'; exit 2; }
          echo "changed_files=$(wc -l < "$changed" | tr -d ' ')"
          echo 'l0_changes=0'
          echo 'change_scope=L1_ONLY'

      - name: Install L1 with deterministic spreadsheet readers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e "$RUNNER_TEMP/private-source/l1[dev]"
          python - <<'PY'
          import openpyxl, xlrd
          print(f"openpyxl={openpyxl.__version__}")
          print(f"xlrd={xlrd.__version__}")
          PY

      - name: Run targeted deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          python -m pytest -q \
            l1/tests/test_artifact_spreadsheet_source_structure.py \
            l1/tests/test_artifact_table_semantics.py \
            l1/tests/test_artifact_attachment_chain_v11.py

      - name: Run full L1 suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          python -m pytest -q l1/tests

      - name: Run 92-file source-structure audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/l1-spreadsheet-audit"
          python "$RUNNER_TEMP/harness/scripts/run_l1_spreadsheet_structure_audit.py" \
            --implementation-root "$RUNNER_TEMP/private-source" \
            --fixture-root "$RUNNER_TEMP/private-fixtures/media_fixtures" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --fixture-sha "4d514701e01308129a76c609d23fe51a0ec92249" \
            --output-dir "$RUNNER_TEMP/l1-spreadsheet-audit"

      - name: Persist audit privately
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$RUNNER_TEMP/l1-spreadsheet-audit" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation "l1_spreadsheet_source_structure" \
            --copy "summary.json=summary.json" \
            --copy "details.json=details.json"

      - name: Terminal marker
        shell: bash
        run: |
          echo 'model_calls=0'
          echo 'l0_changes=0'
          echo 'L1_SPREADSHEET_STRUCTURE_VALIDATION_PASS'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/private-source" "$RUNNER_TEMP/private-fixtures" \
            "$RUNNER_TEMP/l1-spreadsheet-audit" "$RUNNER_TEMP/harness" \
            "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" \
            "$RUNNER_TEMP/changed-files.txt"
