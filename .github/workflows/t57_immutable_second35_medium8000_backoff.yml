name: t57-immutable-second35-medium8000-backoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t57_immutable_second35_medium8000_backoff.yml']
permissions:
  contents: read
  issues: write
jobs:
  run:
    environment: shangtang
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout harness
        run: |
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD
      - name: Fetch immutable second35 packet
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          ask="$RUNNER_TEMP/askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$KNOWLEDGE_READ_TOKEN";; esac\n' > "$ask"
          chmod 700 "$ask"
          export GIT_ASKPASS="$ask" GIT_TERMINAL_PROMPT=0
          root="$RUNNER_TEMP/source"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/xyh-nuage/knowledge.git
          git -C "$root" fetch -q --depth=1 origin 5093c76e39b66aea3d2e34943e268449e0e878b1
          git -C "$root" checkout -q --detach FETCH_HEAD
          git -C "$root" fetch -q --depth=1 origin d9f527a4e5d39130ef79653abb4799ff8f2a07ac
          base='evaluation_results/full_context_second35_low8000_t56/2026-08-19_5093c76e_run32230539371'
          mkdir -p "$RUNNER_TEMP/input" "$root/l1/evaluation/vnext/runtime/t57"
          git -C "$root" show d9f527a4e5d39130ef79653abb4799ff8f2a07ac:"$base/human_context_packet.txt" > "$RUNNER_TEMP/input/packet.txt"
          git -C "$root" show d9f527a4e5d39130ef79653abb4799ff8f2a07ac:"$base/human_context_system_prompt.txt" > "$RUNNER_TEMP/input/prompt.txt"
          test "$(git hash-object "$RUNNER_TEMP/input/packet.txt")" = f9aadfcadf1b697c7309787ca6e3b41d8a740ff5
          test "$(git hash-object "$RUNNER_TEMP/input/prompt.txt")" = dd7dad0b793ee0d52744e271bb648525519cf6d8
          cp "$RUNNER_TEMP/input/packet.txt" "$root/l1/evaluation/vnext/runtime/t57/human_context_packet.txt"
          cp "$RUNNER_TEMP/input/prompt.txt" "$root/l1/evaluation/vnext/runtime/t57/human_context_system_prompt.txt"
      - name: Run DeepSeek medium8000 with exponential backoff
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SOURCE_SHA: 5093c76e39b66aea3d2e34943e268449e0e878b1
          PACKET_SOURCE_COMMIT: d9f527a4e5d39130ef79653abb4799ff8f2a07ac
        run: |
          set +e
          python "$RUNNER_TEMP/harness/scripts/t57_shangtang_immutable_second35_medium8000_backoff.py" "$RUNNER_TEMP/input/packet.txt" "$RUNNER_TEMP/input/prompt.txt" "$RUNNER_TEMP/source/l1/evaluation/vnext/runtime/t57" | tee "$RUNNER_TEMP/t57.log"
          exit 0
      - name: Persist result
        if: always()
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/source/l1/evaluation/vnext/runtime/t57/full_context_raw_result.json" ]; then
            python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" --source-root "$RUNNER_TEMP/source" --source-sha 5093c76e39b66aea3d2e34943e268449e0e878b1 --harness-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --date "$(date -u +%F)" --evaluation full_context_immutable_second35_medium8000_t57 --copy l1/evaluation/vnext/runtime/t57/human_context_packet.txt=human_context_packet.txt --copy l1/evaluation/vnext/runtime/t57/human_context_system_prompt.txt=human_context_system_prompt.txt --copy l1/evaluation/vnext/runtime/t57/full_context_raw_result.json=full_context_raw_result.json
          fi
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "t57-immutable-second35-medium8000:${GITHUB_RUN_ID}" --body "$(cat "$RUNNER_TEMP/t57.log" 2>/dev/null || true)"
