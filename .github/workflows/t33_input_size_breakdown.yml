name: t33-input-size-breakdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/t33_input_size_breakdown.yml'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact private compact input
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/knowledge"
          git init -q "$repo"
          git -C "$repo" remote add origin https://github.com/xyh-nuage/knowledge.git
          askpass="$RUNNER_TEMP/askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin 402741e08279b49d10509e4f1211018c492172e1
          path='evaluation_results/research_full_context_matter_baseline_shangtang_compact_one_call/2026-08-19_43c40934_run32211126970/full_context_model_input.json'
          git -C "$repo" show FETCH_HEAD:"$path" > "$RUNNER_TEMP/input.json"
          rm -f "$askpass"

      - name: Compute exact semantic size breakdown
        shell: bash
        run: |
          python - <<'PY' > "$RUNNER_TEMP/result.json"
          import json, re, pathlib
          p=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'input.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          sys=d['system_prompt']
          up=d['user_payload']
          msgs=up['messages']
          atts=up.get('attachments',{})
          def b(s): return len(str(s).encode('utf-8'))
          def c(s): return len(str(s))
          text_chars=sum(c(m.get('text','')) for m in msgs)
          text_bytes=sum(b(m.get('text','')) for m in msgs)
          sender_chars=sum(c(m.get('sender','')) for m in msgs)
          sender_bytes=sum(b(m.get('sender','')) for m in msgs)
          time_chars=sum(c(m.get('time','')) for m in msgs)
          time_bytes=sum(b(m.get('time','')) for m in msgs)
          id_chars=sum(c(m.get('id','')) for m in msgs)
          id_bytes=sum(b(m.get('id','')) for m in msgs)
          attachment_content=[]; attachment_names=[]; attachment_types=[]
          for a in atts.values():
              attachment_names.append(a.get('name',''))
              attachment_types.append(a.get('type',''))
              for x in a.get('content',[]): attachment_content.append(str(x))
          att_content_chars=sum(c(x) for x in attachment_content)
          att_content_bytes=sum(b(x) for x in attachment_content)
          att_name_chars=sum(c(x) for x in attachment_names)
          att_name_bytes=sum(b(x) for x in attachment_names)
          # Inline WeChat quote suffixes embedded inside text, e.g. “引用 X 的消息 : ...”
          quote_re=re.compile(r'引用\s*[^:\n]{1,60}?\s*的消息\s*:\s*', re.S)
          quote_bodies=[]; own_texts=[]; quoted_message_count=0
          for m in msgs:
              t=m.get('text','')
              mt=quote_re.search(t)
              if mt:
                  quoted_message_count+=1
                  own_texts.append(t[:mt.start()].rstrip())
                  quote_bodies.append(t[mt.end():].strip())
              else:
                  own_texts.append(t)
          quote_chars=sum(c(x) for x in quote_bodies)
          quote_bytes=sum(b(x) for x in quote_bodies)
          own_chars=sum(c(x) for x in own_texts)
          own_bytes=sum(b(x) for x in own_texts)
          unique_quotes=[]
          seen=set()
          for q in quote_bodies:
              if q and q not in seen:
                  seen.add(q); unique_quotes.append(q)
          unique_quote_chars=sum(c(x) for x in unique_quotes)
          unique_quote_bytes=sum(b(x) for x in unique_quotes)
          repeated_quote_chars=max(0,quote_chars-unique_quote_chars)
          repeated_quote_bytes=max(0,quote_bytes-unique_quote_bytes)
          compact_payload=json.dumps(up,ensure_ascii=False,separators=(',',':'))
          request_semantic_bytes=b(sys)+b(compact_payload)
          # User's proposed plain representation, literal original text preserved, no ids/json.
          plain_lines=[]
          for m in msgs:
              plain_lines.append(f"{m.get('time','')} | {m.get('sender','')}\n{m.get('text','')}")
          plain_messages='\n\n'.join(plain_lines)
          # Normalized form removes duplicated inline quote bodies but leaves marker; all unique quote bodies pooled once.
          norm_lines=[]
          for m,own in zip(msgs,own_texts):
              t=m.get('text','')
              mt=quote_re.search(t)
              marker=' [有引用]' if mt else ''
              norm_lines.append(f"{m.get('time','')} | {m.get('sender','')}\n{own}{marker}")
          norm_messages='\n\n'.join(norm_lines)
          quote_pool='\n\n'.join(f"引用内容Q{i+1}: {q}" for i,q in enumerate(unique_quotes))
          all_att='\n\n'.join(f"附件{i+1}: {x}" for i,x in enumerate(attachment_content))
          result={
            'message_count':len(msgs),
            'attachment_count':len(atts),
            'system_prompt':{'chars':c(sys),'bytes':b(sys)},
            'message_text_literal':{'chars':text_chars,'bytes':text_bytes},
            'message_own_text_before_inline_quote':{'chars':own_chars,'bytes':own_bytes},
            'inline_quote':{
              'messages_with_inline_quote':quoted_message_count,
              'all_quote_body_chars':quote_chars,'all_quote_body_bytes':quote_bytes,
              'unique_exact_quote_bodies':len(unique_quotes),
              'unique_quote_body_chars':unique_quote_chars,'unique_quote_body_bytes':unique_quote_bytes,
              'exact_repeated_quote_chars':repeated_quote_chars,'exact_repeated_quote_bytes':repeated_quote_bytes,
            },
            'sender':{'chars':sender_chars,'bytes':sender_bytes},
            'time':{'chars':time_chars,'bytes':time_bytes},
            'short_ids':{'chars':id_chars,'bytes':id_bytes},
            'attachment_preview_content':{'chunks':len(attachment_content),'chars':att_content_chars,'bytes':att_content_bytes},
            'attachment_names':{'chars':att_name_chars,'bytes':att_name_bytes},
            'current_compact_user_payload':{'chars':c(compact_payload),'bytes':b(compact_payload)},
            'current_request_semantic_content_bytes':request_semantic_bytes,
            'plain_time_sender_literal_text_no_ids':{'chars':c(plain_messages),'bytes':b(plain_messages)},
            'plain_plus_all_attachment_content_no_json_no_ids':{'chars':c(plain_messages+'\n\n'+all_att),'bytes':b(plain_messages+'\n\n'+all_att)},
            'normalized_messages_plus_unique_quote_pool_plus_all_attachments':{'chars':c(norm_messages+'\n\n'+quote_pool+'\n\n'+all_att),'bytes':b(norm_messages+'\n\n'+quote_pool+'\n\n'+all_att)},
            'separate_company_background_chars':0,
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          cat "$RUNNER_TEMP/result.json"

      - name: Publish counts only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t33-input-size-breakdown:${GITHUB_RUN_ID}" --body "Deterministic size audit only; no provider/model call.\n\n\`\`\`json\n$(cat "$RUNNER_TEMP/result.json")\n\`\`\`"
