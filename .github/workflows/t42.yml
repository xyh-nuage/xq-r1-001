name: t42-context-memory-v02-hardening
run-name: t42:${{ github.event.workflow_run.display_title || inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private context-memory v0.2 hardening source commit
        required: true
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t42-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t42:'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact source and frozen harness
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t42:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source"
          echo "harness_sha=$harness"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout exact private source
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/context-memory-v02-hardening-source"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t42-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 'private_source=VERIFIED_EXACT_SHA'

      - name: Install deterministic test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/context-memory-v02-hardening-source"
          python -m pip install -q -e 'l1[dev]'

      - name: Compile hardened v0.2 modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/context-memory-v02-hardening-source"
          python -m py_compile \
            l1/l1_processor/context_memory/v02_contracts.py \
            l1/l1_processor/context_memory/v02_ports.py \
            l1/l1_processor/context_memory/v02_serialization.py \
            l1/l1_processor/context_memory/v02_store.py \
            l1/l1_processor/context_memory/v02_engine.py
          echo 'compile=PASS'

      - name: Run hardening and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/context-memory-v02-hardening-source"
          python - <<'PY'
          import re, subprocess, sys, xml.etree.ElementTree as ET
          report='/tmp/t42-junit.xml'
          cmd=[
              sys.executable,'-m','pytest','-q','--junitxml',report,
              'l1/tests/context_memory/test_v02_hardening.py',
              'l1/tests/context_memory/test_v02_scenarios.py',
              'l1/tests/context_memory/test_kernel.py',
              'l1/tests/context_memory/test_contract_schemas.py',
          ]
          p=subprocess.run(cmd,text=True,capture_output=True)
          text=(p.stdout or '')+'\n'+(p.stderr or '')
          summary=''
          for line in reversed(text.splitlines()):
              if re.search(r'\b(passed|failed|error|errors|skipped|xfailed|xpassed)\b', line):
                  summary=line.strip(); break
          counts={k:0 for k in ('passed','failed','skipped','xfailed','xpassed','deselected','errors')}
          for n,k in re.findall(r'(\d+)\s+(passed|failed|skipped|xfailed|xpassed|deselected|errors?)', summary):
              counts['errors' if k in ('error','errors') else k]=int(n)
          print('PYTEST_AUDIT=' + ','.join(f'{k}={counts[k]}' for k in counts))
          if p.returncode != 0:
              failed=[]
              try:
                  root=ET.parse(report).getroot()
                  for case in root.iter('testcase'):
                      if case.find('failure') is not None or case.find('error') is not None:
                          classname=case.attrib.get('classname','')
                          name=case.attrib.get('name','')
                          failed.append(f'{classname}::{name}')
              except Exception:
                  failed=[]
              print('FAILED_TESTS=' + (';'.join(failed) if failed else 'UNAVAILABLE'))
              print('pytest_result=FAIL')
              print(summary)
              raise SystemExit(p.returncode)
          if counts['passed'] == 0:
              raise SystemExit('pytest aggregate summary missing')
          print('FAILED_TESTS=NONE')
          print('pytest_result=PASS')
          PY

      - name: Terminal audit marker
        shell: bash
        run: |
          echo 'CONTEXT_MEMORY_V02_HARDENING_REMOTE_CI_PASS'
          echo 'real_company_data_used=0'
          echo 'model_calls=0'
          echo 'research_gold_modified=0'
          echo 'merge_performed=0'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/context-memory-v02-hardening-source" "$RUNNER_TEMP/t42-read-askpass.sh" /tmp/t42-junit.xml
