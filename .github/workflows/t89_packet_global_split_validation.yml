name: t89-packet-global-split-validation

on:
  push:
    paths:
      - '.github/workflows/t89_packet_global_split_validation.yml'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Publish safe locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t89-packet-global-split:${GITHUB_RUN_ID}" \
            --body "Deterministic global packet split validation for exact source SHA f1f19d8bfd49e2c0cdaae6178a728f2152fe6a20. No company content is included here."

      - uses: actions/checkout@v4

      - name: Verify private result write access
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python scripts/private_results_preflight.py

      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: f1f19d8bfd49e2c0cdaae6178a728f2152fe6a20
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1

      - name: Run focused tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q \
            private-knowledge/l1/tests/test_prepare_research_daily_group_model_inputs.py \
            private-knowledge/l1/tests/test_prepare_research_daily_group_model_inputs_global_split.py

      - name: Rebuild real corpus and validate global split
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t89-out"
          sel="$RUNNER_TEMP/t89-private"
          mkdir -p "$sel"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$out" >/dev/null
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 't89-out'
          sel = Path(os.environ['RUNNER_TEMP']) / 't89-private'
          summary = json.loads((out / 'build_summary.json').read_text(encoding='utf-8'))
          idx = [json.loads(line) for line in (out / 'model_inputs/packet_index.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          packets = {r['packet_id']: (out / 'model_inputs/packets' / f"{r['packet_id']}.txt").read_text(encoding='utf-8') for r in idx}
          combined = '\n'.join(packets.values())

          assert summary['schema_version'] == 'research_daily_group_model_inputs_summary.v4'
          assert summary['source_group_day_count'] == 365
          assert summary['group_day_count'] == 304
          assert summary['source_message_count'] == 7395
          assert summary['packet_count'] == 306
          assert summary['split_group_day_count'] == 2
          assert summary['provider_call_count'] == 0

          assert re.search(r'消息\d+ \| \d{1,2}月\d{1,2}日 \d{1,2}:\d{2} \| \[系统\]\n\d{1,2}月\d{1,2}日 \d{1,2}:\d{2}', combined) is None
          assert '语音6"秒未播放' not in combined
          assert '语音（未转写，6秒）' in combined
          human = '@Winter🍥\u2005亲，6.15货转的这个，是从6.16收下家仓储么'
          assert combined.count(human) >= 2

          median_rows = [r for r in idx if r['group_name'] == '群聊_新创~诚泰通合作群' and r['date'] == '2026-07-01']
          assert len(median_rows) == 1
          median = packets[median_rows[0]['packet_id']]
          assert median.count('文件：诚泰通新创267179079结算单.pdf') == 1
          assert '7月1日 11:22 | [系统]' not in median

          j8_rows = [r for r in idx if r['group_name'] == '群聊_新创-中泰大佑木薯淀粉' and r['date'] == '2026-07-08']
          assert j8_rows
          j8 = '\n'.join(packets[r['packet_id']] for r in j8_rows)
          header = re.compile(r'^消息(\d+) \| (.*?) \| (.*)$')
          def blocks(text):
              result, cur = [], None
              for line in text.splitlines():
                  m = header.match(line)
                  if m:
                      if cur:
                          result.append(cur)
                      cur = {'ordinal': int(m.group(1)), 'time': m.group(2), 'sender': m.group(3), 'body': []}
                  elif cur is not None:
                      cur['body'].append(line)
              if cur:
                  result.append(cur)
              for b in result:
                  b['text'] = '\n'.join(b['body']).strip()
              return result
          related = [b for b in blocks(j8) if 'image_20260708_中泰-季磊_a06198ec2263e747.jpg' in b['text']]
          assert len(related) == 2
          assert sum('图片内容：' in b['text'] for b in related) == 1
          assert any('图片引用 Bonn 的消息' in b['text'] for b in related)

          j9_rows = [r for r in idx if r['group_name'] == '群聊_新创-中泰大佑木薯淀粉' and r['date'] == '2026-07-09']
          assert len(j9_rows) == 2
          request_holders = [r for r in j9_rows if '我想看看coa和生产日期' in packets[r['packet_id']]]
          certificate_holders = [r for r in j9_rows if 'CERTIFICATE OF PRODUCTION' in packets[r['packet_id']]]
          assert len(request_holders) == 1
          assert len(certificate_holders) == 1
          assert request_holders[0]['packet_id'] == certificate_holders[0]['packet_id']
          request_packet = packets[request_holders[0]['packet_id']]
          assert '我想看看coa和生产日期' in request_packet
          assert 'CERTIFICATE OF PRODUCTION' in request_packet

          j16_rows = [r for r in idx if r['group_name'] == '群聊_新创-中泰大佑木薯淀粉' and r['date'] == '2026-07-16']
          assert len(j16_rows) == 2
          j16 = '\n'.join(packets[r['packet_id']] for r in j16_rows)
          assert not any(b['sender'] == '杨森🍀℡' and b['time'] == '2026-07-16 11:12:00' and b['text'] == '视频' for b in blocks(j16))

          report = {
              'source_sha': 'f1f19d8bfd49e2c0cdaae6178a728f2152fe6a20',
              'summary': summary,
              'july9_rows': j9_rows,
              'july9_request_packet_id': request_holders[0]['packet_id'],
              'july16_rows': j16_rows,
          }
          (sel / 'validation.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          (sel / 'july9.txt').write_text('\n'.join(f"===== {r['packet_id']} =====\n{packets[r['packet_id']]}" for r in j9_rows), encoding='utf-8')
          PY
          eval_date="$(date -u +%F)"
          python scripts/private_results_publisher.py \
            --source-root "$sel" \
            --source-sha f1f19d8bfd49e2c0cdaae6178a728f2152fe6a20 \
            --harness-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --date "$eval_date" \
            --evaluation research_packet_global_split_validation \
            --copy validation.json=validation.json \
            --copy july9.txt=july9.txt

      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/t89-out" "$RUNNER_TEMP/t89-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
