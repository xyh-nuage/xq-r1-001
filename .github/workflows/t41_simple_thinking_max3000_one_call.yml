name: t41-simple-thinking-max3000-one-call

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/t41_simple_thinking_max3000_one_call.yml'

permissions:
  contents: read
  issues: write

jobs:
  run:
    environment: shangtang
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce one-run authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1" || { echo 'AUTHORIZATION_CONSUMED_NO_RERUN'; exit 90; }

      - name: Publish safe run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t41-simple-thinking-max3000-run:${GITHUB_RUN_ID}" \
            --body "One-call whole-context Matter reconstruction with the simple prompt, thinking enabled, max_tokens=3000. No mature Matter registry, no retry/fallback. Private source: 5093c76e39b66aea3d2e34943e268449e0e878b1."

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Prepare exact private source and immutable L1 evidence
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/simple-thinking-max3000"
          repo="$root/source"
          source_sha="5093c76e39b66aea3d2e34943e268449e0e878b1"
          result_commit="67389cf13187e1c768808f268173437a13552e1e"
          result_path="evaluation_results/research_slice_a_l1_attachment_materialization/2026-08-18_0c2adfff_run32096296005/candidate_db_export.json"
          expected_blob="9b95be232e3a500931f2faf03c5a238dc475c641"
          mkdir -p "$root"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t41-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "$source_sha"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "$source_sha"
          git -C "$repo" fetch -q --depth=1 origin "$result_commit"
          input_dir="$repo/l1/evaluation/vnext/runtime/full_context_matter_input"
          mkdir -p "$input_dir"
          git -C "$repo" show "$result_commit:$result_path" > "$input_dir/candidate_db_export.json"
          test "$(git hash-object "$input_dir/candidate_db_export.json")" = "$expected_blob"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 'SOURCE_AND_L1_INPUT_VERIFIED'

      - name: Run deterministic isolation gate and rehydrate L1 input
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/prepared_source_runner.py" \
            --source-dir "$RUNNER_TEMP/simple-thinking-max3000/source" \
            --source-sha "5093c76e39b66aea3d2e34943e268449e0e878b1" \
            --plan "$RUNNER_TEMP/harness/plans/t29.json"

      - name: Verify Shangtang configuration without provider call
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL_SECRET: ${{ secrets.LLM_MODEL }}
          LLM_MODEL_VAR: ${{ vars.LLM_MODEL }}
        run: |
          set -euo pipefail
          test -n "$LLM_API_KEY" || { echo 'LLM_API_KEY=MISSING_NO_MODEL_CALL'; exit 2; }
          if [ -n "$LLM_MODEL_SECRET" ]; then
            echo "LLM_MODEL=$LLM_MODEL_SECRET" >> "$GITHUB_ENV"
          elif [ -n "$LLM_MODEL_VAR" ]; then
            echo "LLM_MODEL=$LLM_MODEL_VAR" >> "$GITHUB_ENV"
          else
            echo 'LLM_MODEL=MISSING_NO_MODEL_CALL'; exit 2
          fi
          echo 'provider_base_url=https://token.sensenova.cn/v1/'
          echo 'thinking_enabled=true'
          echo 'max_tokens=3000'
          echo 'CONFIG_PRESENT_NO_PROVIDER_CALL_YET'

      - name: Execute exactly one max3000 Shangtang HTTP call
        id: model
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SOURCE_SHA: 5093c76e39b66aea3d2e34943e268449e0e878b1
        run: |
          set +e
          root="$RUNNER_TEMP/simple-thinking-max3000/source"
          out="$root/l1/evaluation/vnext/runtime/simple_thinking_max3000"
          mkdir -p "$out"
          python "$RUNNER_TEMP/harness/scripts/t41_shangtang_simple_thinking_max3000_one_call.py" "$root" "$out" | tee "$RUNNER_TEMP/t41-model.log"
          rc=${PIPESTATUS[0]}
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then echo 'success=true' >> "$GITHUB_OUTPUT"; else echo 'success=false' >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Persist one-call private evidence
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/simple-thinking-max3000/source"
          base="l1/evaluation/vnext/runtime/simple_thinking_max3000"
          eval_date="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$root" \
            --source-sha "5093c76e39b66aea3d2e34943e268449e0e878b1" \
            --harness-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --date "$eval_date" \
            --evaluation "full_context_simple_thinking_max3000" \
            --copy "$base/full_context_input.json=full_context_input.json" \
            --copy "$base/human_context_packet.txt=human_context_packet.txt" \
            --copy "$base/human_context_system_prompt.txt=human_context_system_prompt.txt" \
            --copy "$base/human_context_map.json=human_context_map.json" \
            --copy "$base/human_context_stats.json=human_context_stats.json" \
            --copy "$base/full_context_raw_result.json=full_context_raw_result.json"

      - name: Report safe terminal state
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_RC: ${{ steps.model.outputs.return_code }}
          MODEL_SUCCESS: ${{ steps.model.outputs.success }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "t41-simple-thinking-max3000-run:${GITHUB_RUN_ID} in:title" --json number --jq '.[0].number')"
          status_line="$(grep 'ONE_CALL_STATUS=' "$RUNNER_TEMP/t41-model.log" 2>/dev/null | tail -1 || true)"
          safe_lines="$(grep -E '^(thinking_enabled|max_tokens|request_bytes|packet_chars|system_prompt_chars|prompt_tokens|completion_tokens|reasoning_tokens|total_tokens|finish_reason|json_parse_ok|content_chars)=' "$RUNNER_TEMP/t41-model.log" 2>/dev/null || true)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "${status_line:-ONE_CALL_STATUS=BLOCKED_BEFORE_MODEL_OR_NO_STATUS}\n${safe_lines}\nmodel_return_code=${MODEL_RC:-unset}\nmodel_success=${MODEL_SUCCESS:-unset}\nrun_attempt=${GITHUB_RUN_ATTEMPT}\nNo retry/fallback was performed."
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/simple-thinking-max3000" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/t41-read-askpass.sh" "$RUNNER_TEMP/t41-model.log" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
