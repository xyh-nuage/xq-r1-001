name: t71-group-identity-inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t71_group_identity_inventory.yml']
permissions:
  contents: read
  issues: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: shangtang
    timeout-minutes: 20
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 55ece41718d85fe05ffdffb05e56b9bd9939dbfc
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Build private identity inventory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t71"
          python - <<'PY'
          import json, sqlite3, os
          from pathlib import Path
          db=sqlite3.connect('file:private-knowledge/l0_state.db?mode=ro',uri=True)
          db.row_factory=sqlite3.Row
          pairs=[dict(r) for r in db.execute('''
            SELECT group_id, chat_name,
                   COUNT(*) AS message_count,
                   SUM(CASE WHEN COALESCE(missing_in_latest_snapshot,0)=0 THEN 1 ELSE 0 END) AS current_count,
                   SUM(CASE WHEN COALESCE(missing_in_latest_snapshot,0)!=0 THEN 1 ELSE 0 END) AS missing_count,
                   MIN(date_key) AS date_start, MAX(date_key) AS date_end
            FROM source_messages
            GROUP BY group_id, chat_name
            ORDER BY message_count DESC
          ''')]
          groups=[dict(r) for r in db.execute('SELECT group_id, group_name, identity_quality FROM groups ORDER BY group_name')]
          aliases=[dict(r) for r in db.execute('SELECT group_id, alias_name FROM group_aliases ORDER BY group_id, alias_name')]
          out={'schema_version':'research_group_identity_inventory.v1','pairs':pairs,'groups':groups,'aliases':aliases}
          root=Path(os.environ['RUNNER_TEMP'])/'t71'
          (root/'group_identity_inventory.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'public_summary.json').write_text(json.dumps({'pair_count':len(pairs),'group_table_count':len(groups),'alias_count':len(aliases)},indent=2),encoding='utf-8')
          db.close()
          PY
      - name: Persist private inventory
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          python scripts/private_results_publisher.py \
            --source-root "$RUNNER_TEMP/t71" \
            --source-sha 55ece41718d85fe05ffdffb05e56b9bd9939dbfc \
            --harness-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --date 2026-08-19 \
            --evaluation research_group_identity_inventory_t71 \
            --copy group_identity_inventory.json=group_identity_inventory.json \
            --copy public_summary.json=public_summary.json \
            2>&1 | tee "$RUNNER_TEMP/t71-persist.log"
      - name: Report public-safe summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'source_sha=55ece41718d85fe05ffdffb05e56b9bd9939dbfc'
            echo 'provider_call_count=0'
            cat "$RUNNER_TEMP/t71/public_summary.json" 2>/dev/null || true
            cat "$RUNNER_TEMP/t71-persist.log" 2>/dev/null | grep -E 'private_result_commit=|private_result_path=|PRIVATE_RESULT_PERSIST_PASS' || true
          } > "$RUNNER_TEMP/t71-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t71-group-identity-inventory:${GITHUB_RUN_ID}" --body-file "$RUNNER_TEMP/t71-report.txt"
