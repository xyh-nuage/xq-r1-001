name: t84-research-packet-residual-diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t84_research_packet_residual_diagnostic.yml']

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish safe locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t84-packet-residual-diagnostic:${GITHUB_RUN_ID}" \
            --body "Private packet residual diagnostic for exact source SHA 468393795d8e2c8f234a7b57d0f4d6c157955f8a. No company content is included here."
      - uses: actions/checkout@v4
      - name: Verify private result write access
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python scripts/private_results_preflight.py
      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 468393795d8e2c8f234a7b57d0f4d6c157955f8a
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Rebuild and persist selected packets
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t84-out"; sel="$RUNNER_TEMP/t84-private"; mkdir -p "$sel"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py --db private-knowledge/l0_state.db --output-dir "$out" >/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'t84-out'; sel=Path(os.environ['RUNNER_TEMP'])/'t84-private'
          idx=[json.loads(x) for x in (out/'model_inputs/packet_index.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          packets={r['packet_id']:(out/'model_inputs/packets'/f"{r['packet_id']}.txt").read_text(encoding='utf-8') for r in idx}
          def select(group,date): return [r for r in idx if r['group_name']==group and r['date']==date]
          median=select('群聊_新创~诚泰通合作群','2026-07-01')
          july8=select('群聊_新创-中泰大佑木薯淀粉','2026-07-08')
          july9=select('群聊_新创-中泰大佑木薯淀粉','2026-07-09')
          assert median and july8 and july9
          (sel/'summary.json').write_text((out/'build_summary.json').read_text(encoding='utf-8'),encoding='utf-8')
          (sel/'median.txt').write_text('\n'.join(packets[r['packet_id']] for r in median),encoding='utf-8')
          (sel/'july8.txt').write_text('\n'.join(packets[r['packet_id']] for r in july8),encoding='utf-8')
          (sel/'july9.txt').write_text('\n'.join(f"===== {r['packet_id']} =====\n{packets[r['packet_id']]}" for r in july9),encoding='utf-8')
          diag={
            'source_sha':'468393795d8e2c8f234a7b57d0f4d6c157955f8a',
            'median_packet_ids':[r['packet_id'] for r in median],
            'july8_packet_ids':[r['packet_id'] for r in july8],
            'july9_packet_ids':[r['packet_id'] for r in july9],
          }
          (sel/'diagnostic.json').write_text(json.dumps(diag,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          eval_date="$(date -u +%F)"
          python scripts/private_results_publisher.py \
            --source-root "$sel" \
            --source-sha 468393795d8e2c8f234a7b57d0f4d6c157955f8a \
            --harness-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation research_packet_residual_diagnostic \
            --copy summary.json=summary.json \
            --copy diagnostic.json=diagnostic.json \
            --copy median.txt=median.txt \
            --copy july8.txt=july8.txt \
            --copy july9.txt=july9.txt
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/t84-out" "$RUNNER_TEMP/t84-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
