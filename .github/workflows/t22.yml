name: t22

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private source commit
        required: true
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: remote-t22-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t22:'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Publish safe run locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create --repo "${{ github.repository }}" --title "t22-research-context-sufficiency-contract-run:${{ github.run_id }}" --body "Safe run locator for Seen context-sufficiency manifest and deterministic contract validation. No company content."

      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t22:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha=INVALID'; exit 2; }
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_sha=INVALID'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Prepare exact private source and immutable t21 diagnostic input
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/context-sufficiency-source"
          repo="$root/source"
          baseline_commit="18d1bcd12e98e631d85241b40939a8ef3c204b30"
          baseline_path="evaluation_results/research_c_stage_decision_semantics_convergence/2026-08-18_52db7f20_run32131806697/failure_attribution.json"
          expected_blob="e87ff7b10b761e7ab9a18ab5f203686610c8a38d"
          mkdir -p "$root"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t22-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"
          git -C "$repo" fetch -q --depth=1 origin "$baseline_commit"
          input_dir="$repo/l1/evaluation/vnext/runtime/context_sufficiency_input"
          mkdir -p "$input_dir"
          git -C "$repo" show "$baseline_commit:$baseline_path" > "$input_dir/t21_failure_attribution.json"
          test "$(git hash-object "$input_dir/t21_failure_attribution.json")" = "$expected_blob"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 't21_failure_attribution=VERIFIED_IMMUTABLE_INPUT'

      - name: Run phase B deterministic contract validation
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/prepared_source_runner.py" \
            --source-dir "$RUNNER_TEMP/context-sufficiency-source/source" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --plan "$RUNNER_TEMP/harness/plans/t22.json"

      - name: Audit frozen Seen manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/context-sufficiency-source/source/l1/evaluation/vnext/runtime/research_c_stage_context_sufficiency/seen_manifest.json"
          python - "$manifest" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          counts = data['counts']
          assert counts['cases'] == 30
          assert counts['attachment_bound'] == 7
          assert counts['text_history'] == 23
          assert data['seen_only'] is True
          assert data['unseen_accessed'] is False
          boundary = data['runtime_boundary']
          assert boundary['reference_groups_in_manifest'] is False
          assert boundary['reference_labels_in_manifest'] is False
          assert boundary['silver_or_gold_body_in_manifest'] is False
          print('manifest_cases=30')
          print('manifest_attachment_bound=7')
          print('manifest_text_history=23')
          print('manifest_identity_sha256=' + data['case_identity_set_sha256'])
          print('RESEARCH_C_STAGE_CONTEXT_MANIFEST_AUDIT_PASS')
          PY

      - name: Persist frozen Seen manifest
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/context-sufficiency-source/source"
          base="l1/evaluation/vnext/runtime/research_c_stage_context_sufficiency"
          test -f "$root/$base/seen_manifest.json"
          eval_date="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$root" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation "research_c_stage_context_sufficiency_manifest" \
            --copy "$base/seen_manifest.json=seen_manifest.json"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/context-sufficiency-source" "$RUNNER_TEMP/prepared-source-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/t22-read-askpass.sh" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
