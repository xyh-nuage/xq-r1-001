name: t49-first48-file-names-only-low3000-retry429
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t49_first48_file_names_only_low3000_retry429.yml']
permissions:
  contents: read
  issues: write
jobs:
  run:
    environment: shangtang
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Guard run attempt
        run: test "${GITHUB_RUN_ATTEMPT}" = "1" || exit 90
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Checkout harness
        run: |
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD
      - name: Prepare private source
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/t49/source"
          mkdir -p "$root"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/xyh-nuage/knowledge.git
          ask="$RUNNER_TEMP/askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *Password*) echo "$KNOWLEDGE_READ_TOKEN";; esac\n' > "$ask"
          chmod 700 "$ask"
          export GIT_ASKPASS="$ask" GIT_TERMINAL_PROMPT=0
          git -C "$root" fetch -q --depth=1 origin 5093c76e39b66aea3d2e34943e268449e0e878b1
          git -C "$root" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = 5093c76e39b66aea3d2e34943e268449e0e878b1
          git -C "$root" fetch -q --depth=1 origin 67389cf13187e1c768808f268173437a13552e1e
          mkdir -p "$root/l1/evaluation/vnext/runtime/full_context_matter_input"
          git -C "$root" show 67389cf13187e1c768808f268173437a13552e1e:evaluation_results/research_slice_a_l1_attachment_materialization/2026-08-18_0c2adfff_run32096296005/candidate_db_export.json > "$root/l1/evaluation/vnext/runtime/full_context_matter_input/candidate_db_export.json"
          test "$(git hash-object "$root/l1/evaluation/vnext/runtime/full_context_matter_input/candidate_db_export.json")" = 9b95be232e3a500931f2faf03c5a238dc475c641
      - name: Isolation gate
        run: python "$RUNNER_TEMP/harness/scripts/prepared_source_runner.py" --source-dir "$RUNNER_TEMP/t49/source" --source-sha 5093c76e39b66aea3d2e34943e268449e0e878b1 --plan "$RUNNER_TEMP/harness/plans/t29.json"
      - name: Run provider test
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SOURCE_SHA: 5093c76e39b66aea3d2e34943e268449e0e878b1
        run: |
          set +e
          out="$RUNNER_TEMP/t49/source/l1/evaluation/vnext/runtime/t49_first48_file_names_only"
          mkdir -p "$out"
          python "$RUNNER_TEMP/harness/scripts/t48_shangtang_first48_file_names_only_low3000_retry429.py" "$RUNNER_TEMP/t49/source" "$out" | tee "$RUNNER_TEMP/t49.log"
          exit 0
      - name: Persist result
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" --source-root "$RUNNER_TEMP/t49/source" --source-sha 5093c76e39b66aea3d2e34943e268449e0e878b1 --harness-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --date "$(date -u +%F)" --evaluation full_context_first48_file_names_only_low3000_t49 --copy l1/evaluation/vnext/runtime/t49_first48_file_names_only/full_context_input.json=full_context_input.json --copy l1/evaluation/vnext/runtime/t49_first48_file_names_only/human_context_packet.txt=human_context_packet.txt --copy l1/evaluation/vnext/runtime/t49_first48_file_names_only/human_context_system_prompt.txt=human_context_system_prompt.txt --copy l1/evaluation/vnext/runtime/t49_first48_file_names_only/human_context_map.json=human_context_map.json --copy l1/evaluation/vnext/runtime/t49_first48_file_names_only/human_context_stats.json=human_context_stats.json --copy l1/evaluation/vnext/runtime/t49_first48_file_names_only/full_context_raw_result.json=full_context_raw_result.json
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "t49-first48-file-names-only-low3000-run:${GITHUB_RUN_ID}" --body "$(cat "$RUNNER_TEMP/t49.log")"
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/t49" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/askpass.sh" "$RUNNER_TEMP/t49.log"
