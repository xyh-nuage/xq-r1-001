name: t69-daily-group-corpus-export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t69_daily_group_corpus_export.yml']
permissions:
  contents: read
  issues: write
jobs:
  export:
    runs-on: ubuntu-latest
    environment: shangtang
    timeout-minutes: 30
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 211919ca7128e091dcf6fa7742ae131603a32e27
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Verify exact source and tests
        run: |
          set -euo pipefail
          test "$(git -C private-knowledge rev-parse HEAD)" = "211919ca7128e091dcf6fa7742ae131603a32e27"
          python -m pytest -q private-knowledge/l0/tests/test_export_research_daily_group_corpus.py
      - name: Export full corpus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t69"
          python private-knowledge/l0/tools/export_research_daily_group_corpus.py \
            --db private-knowledge/l0_state.db \
            --output-jsonl "$RUNNER_TEMP/t69/daily_group_corpus.jsonl" \
            --manifest "$RUNNER_TEMP/t69/daily_group_manifest.json" \
            | tee "$RUNNER_TEMP/t69/export_summary.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'t69'
          m=json.loads((root/'daily_group_manifest.json').read_text(encoding='utf-8'))
          public={k:m[k] for k in ['source_messages_total_rows','source_messages_selected_rows','source_messages_missing_in_latest_snapshot','group_count','group_day_count','date_start','date_end','missing_day_message_count','cross_group_structured_relations_dropped']}
          public['corpus_bytes']=(root/'daily_group_corpus.jsonl').stat().st_size
          (root/'public_summary.json').write_text(json.dumps(public,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Persist private corpus
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/private_results_publisher.py \
            --source-root "$RUNNER_TEMP/t69" \
            --source-sha 211919ca7128e091dcf6fa7742ae131603a32e27 \
            --harness-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --date 2026-08-19 \
            --evaluation research_daily_group_corpus_export_t69 \
            --copy daily_group_corpus.jsonl=daily_group_corpus.jsonl \
            --copy daily_group_manifest.json=daily_group_manifest.json \
            --copy public_summary.json=public_summary.json \
            2>&1 | tee "$RUNNER_TEMP/t69-persist.log"
      - name: Report public-safe summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'source_sha=211919ca7128e091dcf6fa7742ae131603a32e27'
            echo 'provider_call_count=0'
            cat "$RUNNER_TEMP/t69/public_summary.json" 2>/dev/null || true
            echo
            cat "$RUNNER_TEMP/t69-persist.log" 2>/dev/null | grep -E 'private_result_commit=|private_result_path=|PRIVATE_RESULT_PERSIST_PASS' || true
          } > "$RUNNER_TEMP/t69-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t69-daily-group-corpus-export:${GITHUB_RUN_ID}" --body-file "$RUNNER_TEMP/t69-report.txt"
