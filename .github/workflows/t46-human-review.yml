name: t46-context-memory-human-review-008
run-name: t46:${{ github.event.workflow_run.display_title || 'registration' }}

on:
  workflow_run:
    workflows: [rq46]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-t46-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.display_title, 'rq:t46:')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve exact private source
        id: source
        shell: bash
        env:
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          source="${REQUEST_TITLE#rq:t46:}"
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout exact private source
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t46-source"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t46-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 'private_source=VERIFIED_EXACT_SHA'

      - name: Compile 008 entry points
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t46-source"
          cd "$repo"
          python -m pip install -q -e 'l1[dev]'
          python -m py_compile \
            l1/l1_processor/context_memory/human_review.py \
            l1/l1_processor/context_memory/v02_contracts.py \
            l1/l1_processor/context_memory/v02_serialization.py \
            l1/evaluation/context_memory_business_replay/review_cli.py

      - name: Run human review and retained 006 007 regressions privately
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t46-source"
          cd "$repo"
          out="$RUNNER_TEMP/t46-pytest.txt"
          junit="$RUNNER_TEMP/t46-junit.xml"
          set +e
          python -m pytest -q --tb=no --junitxml="$junit" \
            l1/tests/context_memory/test_human_review.py \
            l1/tests/context_memory/test_membership_routing.py \
            l1/tests/context_memory/test_membership_prompt_packets.py \
            l1/tests/context_memory/test_business_replay_adapter.py \
            l1/tests/context_memory/test_explicit_relation_integration.py \
            l1/tests/context_memory/test_real_adapter_probe.py \
            l1/tests/context_memory/test_v02_hardening.py \
            l1/tests/context_memory/test_v02_scenarios.py \
            >"$out" 2>&1
          status=$?
          set -e
          python - "$junit" "$status" <<'PY'
          import sys, xml.etree.ElementTree as ET
          path, status = sys.argv[1], int(sys.argv[2])
          root = ET.parse(path).getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          total = sum(int(s.attrib.get('tests', 0)) for s in suites)
          failures = sum(int(s.attrib.get('failures', 0)) for s in suites)
          errors = sum(int(s.attrib.get('errors', 0)) for s in suites)
          skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites)
          print(f'tests={total}')
          print(f'failures={failures}')
          print(f'errors={errors}')
          print(f'skipped={skipped}')
          if status or failures or errors:
              failed=[]
              for suite in suites:
                  for case in suite.findall('testcase'):
                      if case.find('failure') is not None or case.find('error') is not None:
                          failed.append(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}")
              print('failed_tests=' + ','.join(failed))
              raise SystemExit(1)
          PY

      - name: Verify review contract markers without exposing private content
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t46-source"
          cd "$repo"
          python - <<'PY'
          from pathlib import Path
          source = Path('l1/l1_processor/context_memory/human_review.py').read_text(encoding='utf-8')
          cli = Path('l1/evaluation/context_memory_business_replay/review_cli.py').read_text(encoding='utf-8')
          required = ['prepare_review', 'apply_review', 'resume_update', 'HUMAN_REVIEW_RECORDED', '审查版本过期']
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit('missing review markers')
          if '_seed_case(case, db_path)' not in cli:
              raise SystemExit('new-mode U4 seed entry missing')
          if 'continue mode requires existing database' not in cli:
              raise SystemExit('continue mode fail-closed marker missing')
          print('review_contract_markers=PASS')
          PY

      - name: Terminal audit marker
        shell: bash
        run: |
          echo 'CONTEXT_MEMORY_HUMAN_REVIEW_008_TECHNICAL_PASS'
          echo 'source_sha=${{ steps.source.outputs.value }}'
          echo 'live_model_calls=0'
          echo 'historical_model_output_replay=1'
          echo 'formal_human_acceptance=0'
          echo 'raw_private_content_public_log=0'
          echo 'merge_performed=0'

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/t46-source" "$RUNNER_TEMP/t46-read-askpass.sh" "$RUNNER_TEMP/t46-pytest.txt" "$RUNNER_TEMP/t46-junit.xml"
