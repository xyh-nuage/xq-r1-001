name: t35

on:
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  run:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.display_title, 'rq:t35:')
    runs-on: ubuntu-latest
    environment: ark
    timeout-minutes: 5
    steps:
      - name: Publish safe run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "t35-ark-deepseek-run:${GITHUB_RUN_ID}" --body "Ark DeepSeek smoke locator. No secret or business payload."

      - name: Probe Ark DeepSeek Responses API
        shell: bash
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARK_API_KEY" || { echo 'ark_api_key=MISSING'; exit 2; }
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            https://ark.cn-beijing.volces.com/api/v3/responses \
            -H "Authorization: Bearer $ARK_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"deepseek-v3-2-251201","input":"hello"}')"
          python - "$code" "$body" <<'PY'
import json, sys
code, path = sys.argv[1], sys.argv[2]
obj = json.load(open(path, encoding='utf-8'))
print('endpoint=/api/v3/responses')
print('requested_model=deepseek-v3-2-251201')
print('http_status=' + code)
if code != '200':
    print('request=FAIL')
    print(json.dumps(obj.get('error', obj), ensure_ascii=False)[:1200])
    raise SystemExit(1)
print('request=PASS')
print('response_model=' + str(obj.get('model')))
print('response_status=' + str(obj.get('status')))
texts=[]
for item in obj.get('output', []) or []:
    for part in item.get('content', []) or []:
        if part.get('type') == 'output_text' and part.get('text'):
            texts.append(part['text'])
print('output_text=' + (' '.join(texts)[:300] if texts else '<none>'))
PY
          rm -f "$body"
