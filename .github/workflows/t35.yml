name: t35

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private two-stage Research Matter source commit
        required: true
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: remote-t35-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t35:'))
    environment: shangtang
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish safe run locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create --repo "${{ github.repository }}" --title "t35-matter-two-stage-run:${{ github.run_id }}" --body "Safe run locator for Seen-only two-stage Matter identity experiment. No company content."

      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t35:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha=INVALID'; exit 2; }
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_sha=INVALID'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access before model calls
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Checkout exact private source
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/matter-two-stage-source"
          repo="$root/source"
          mkdir -p "$root"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t35-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          python -m py_compile "$repo/l1/tools/run_research_matter_two_stage_identity.py"
          echo 'private_source=VERIFIED_EXACT_SHA'

      - name: Verify Shangtang model configuration
        shell: bash
        env:
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          test -n "$L1_LLM_API_KEY" || { echo 'LLM_API_KEY=MISSING_NO_MODEL_CALL'; exit 2; }
          test -n "$L1_LLM_BASE_URL" || { echo 'LLM_BASE_URL=MISSING_NO_MODEL_CALL'; exit 2; }
          test "$L1_LLM_MODEL" = 'deepseek-v4-flash' || { echo 'LLM_MODEL=UNEXPECTED_NO_MODEL_CALL'; exit 2; }
          echo 'shangtang_environment=CONFIG_PRESENT'

      - name: Run two-stage Matter identity experiment
        shell: bash
        env:
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL }}
          L1_LLM_TIMEOUT_SECONDS: '300'
          L1_LLM_MAX_RETRIES: '3'
          L1_LLM_RETRY_BACKOFF_SECONDS: '60'
          RESEARCH_MATTER_V2_MAX_TOKENS: '25000'
          L1_LLM_MAX_COMPLETION_FIELD: 'max_tokens'
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/matter-two-stage-source/source"
          out="$repo/l1/evaluation/vnext/runtime/research_matter_two_stage_identity"
          rm -rf "$out"
          python "$repo/l1/tools/run_research_matter_two_stage_identity.py" \
            --output-dir "$out" \
            --source-sha "${{ steps.source.outputs.value }}"

      - name: Persist detailed private two-stage result
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/matter-two-stage-source/source"
          base="l1/evaluation/vnext/runtime/research_matter_two_stage_identity"
          copies=(
            --copy "$base/RUN.json=RUN.json"
            --copy "$base/two_stage_report.json=two_stage_report.json"
            --copy "l1/evaluation/research_matter_three_validation/seen_silver.v2.readjudicated.json=seen_silver.v2.readjudicated.json"
            --copy "l1/evaluation/research_matter_three_validation/experiment_manifest.v2.json=experiment_manifest.v2.json"
            --copy "l1/evaluation/research_matter_three_validation/matter_v2_prompt_contract.v1.txt=matter_v2_prompt_contract.v1.txt"
          )
          shopt -s nullglob
          raw_files=("$repo/$base/raw/"*.json)
          for file in "${raw_files[@]}"; do
            name="$(basename "$file")"
            copies+=(--copy "$base/raw/$name=raw/$name")
          done
          date_utc="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$repo" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$date_utc" \
            --evaluation research_matter_two_stage_identity \
            "${copies[@]}"

      - name: Terminal audit marker
        shell: bash
        run: |
          echo 'RESEARCH_MATTER_TWO_STAGE_REMOTE_PASS'
          echo 'stage2_membership_mutation_allowed=0'
          echo 'c1_run=0'
          echo 'sealed_unseen_used=0'
          echo 'company_runtime_used=0'
          echo 'merge_performed=0'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/matter-two-stage-source" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/t35-read-askpass.sh" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
