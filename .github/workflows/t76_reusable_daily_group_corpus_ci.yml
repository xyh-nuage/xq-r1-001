name: t76-reusable-daily-group-corpus-ci
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t76_reusable_daily_group_corpus_ci.yml']
permissions:
  contents: read
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    environment: shangtang
    timeout-minutes: 30
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: bbe4029b973b874679cc351a7ad069659a79e70c
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Verify source and run research corpus tests
        run: |
          set -euo pipefail
          test "$(git -C private-knowledge rev-parse HEAD)" = "bbe4029b973b874679cc351a7ad069659a79e70c"
          python -m pip install -q pytest
          python -m pytest -q \
            private-knowledge/l0/tests/test_export_research_daily_group_corpus.py \
            private-knowledge/l0/tests/test_canonicalize_research_daily_group_corpus_groups.py \
            private-knowledge/l0/tests/test_dedupe_research_daily_group_corpus_snapshots.py \
            private-knowledge/l0/tests/test_shard_research_daily_group_corpus.py \
            private-knowledge/l0/tests/test_build_research_daily_group_corpus.py
      - name: Rebuild real corpus through one-command entrypoint
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/t76-corpus"
          python private-knowledge/l0/tools/build_research_daily_group_corpus.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$RUNNER_TEMP/t76-corpus"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'t76-corpus'
          s=json.loads((root/'build_summary.json').read_text(encoding='utf-8'))
          assert s['final_message_count'] == 7395, s
          assert s['group_count'] == 19, s
          assert s['group_day_count'] == 365, s
          assert s['retained_historical_only_messages'] == 155, s
          assert s['dropped_historical_duplicate_messages'] == 2306, s
          assert s['excluded_group_messages'] == 3, s
          assert s['unresolved_group_identity_count'] == 0, s
          (root/'public_summary.json').write_text(json.dumps(s,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Report public-safe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'source_sha=bbe4029b973b874679cc351a7ad069659a79e70c'
            echo 'provider_call_count=0'
            cat "$RUNNER_TEMP/t76-corpus/public_summary.json" 2>/dev/null || true
          } > "$RUNNER_TEMP/t76-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t76-reusable-daily-group-corpus-ci:${GITHUB_RUN_ID}" --body-file "$RUNNER_TEMP/t76-report.txt"
