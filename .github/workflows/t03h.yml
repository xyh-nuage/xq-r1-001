name: t03h

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private evaluation commit
        required: true
        default: d8cb3e1a732fdb1fa0f181101c995b0f3b1e7676
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t03h
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t03h:'))
    environment: deepseek
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then source="${REQUEST_TITLE#rq:t03h:}"; harness="$REQUEST_HARNESS_SHA"; else source="$DISPATCH_SHA"; harness="$CURRENT_HARNESS_SHA"; fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access before model calls
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Run frozen Shared basic holdout primary evaluation
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.L1_LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || secrets.L1_LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL || secrets.L1_LLM_MODEL }}
          L1_LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS || vars.L1_LLM_TIMEOUT_SECONDS || '60' }}
          L1_LLM_MAX_RETRIES: ${{ vars.LLM_MAX_RETRIES || vars.L1_LLM_MAX_RETRIES || '2' }}
          L1_LLM_RETRY_BACKOFF_SECONDS: ${{ vars.LLM_RETRY_BACKOFF_SECONDS || vars.L1_LLM_RETRY_BACKOFF_SECONDS || '1' }}
          L1_LLM_MAX_COMPLETION_TOKENS: ${{ vars.LLM_MAX_COMPLETION_TOKENS || vars.L1_LLM_MAX_COMPLETION_TOKENS || '3000' }}
          L1_LLM_MAX_COMPLETION_FIELD: ${{ vars.LLM_MAX_COMPLETION_FIELD || vars.L1_LLM_MAX_COMPLETION_FIELD || 'max_tokens' }}
          L1_LLM_DISABLE_REASONING: ${{ secrets.LLM_DISABLE_REASONING || secrets.L1_LLM_DISABLE_REASONING || vars.LLM_DISABLE_REASONING || vars.L1_LLM_DISABLE_REASONING || 'true' }}
        shell: bash
        run: python "$RUNNER_TEMP/harness/scripts/private_eval_runner_v3.py" --source-sha "${{ steps.source.outputs.value }}" --plan "$RUNNER_TEMP/harness/plans/t03h.json"

      - name: Persist detailed primary result to private knowledge
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$RUNNER_TEMP/private-eval-source/source" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation "shared_local_basic_holdout" \
            --copy "l1/evaluation/shared_local_semantics_basic_holdout/frozen_manifest.v1.json=manifest.json" \
            --copy "l1/evaluation/shared_local_semantics_basic_holdout/gold.v1.json=gold.json" \
            --copy "l1/evaluation/shared_local_semantics_basic_holdout/result/summary.json=summary.json" \
            --copy "l1/evaluation/shared_local_semantics_basic_holdout/result/predictions.jsonl=predictions.jsonl"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/private-eval-source" "$RUNNER_TEMP/private-eval-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP"/private-artifact-*.zip "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight"
