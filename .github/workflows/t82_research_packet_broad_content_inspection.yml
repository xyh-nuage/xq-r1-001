name: t82-research-packet-broad-content-inspection

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t82_research_packet_broad_content_inspection.yml']

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish safe locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t82-packet-broad-inspection:${GITHUB_RUN_ID}" \
            --body "Private broad content inspection started for exact source SHA 445617e33771f3f3192b856c6533ef535febb5a0. No company content is included here."

      - name: Checkout public harness
        uses: actions/checkout@v4

      - name: Verify private result write access
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python scripts/private_results_preflight.py

      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 445617e33771f3f3192b856c6533ef535febb5a0
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1

      - name: Build and inspect broad real-data sample
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t82-prepared"
          sel="$RUNNER_TEMP/t82-private"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$out" >/dev/null
          mkdir -p "$sel"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from collections import defaultdict

          out = Path(os.environ['RUNNER_TEMP'])/'t82-prepared'
          sel = Path(os.environ['RUNNER_TEMP'])/'t82-private'
          manifest = json.loads((out/'model_inputs/manifest.json').read_text(encoding='utf-8'))
          idx = [json.loads(x) for x in (out/'model_inputs/packet_index.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          packets = {r['packet_id']:(out/'model_inputs/packets'/f"{r['packet_id']}.txt").read_text(encoding='utf-8') for r in idx}

          by_day = {}
          for r in idx:
              key=(r['group_day_row'],r['group_name'],r['date'])
              d=by_day.setdefault(key,{'packet_ids':[],'message_count':0,'packet_chars':0,'split':False})
              d['packet_ids'].append(r['packet_id']); d['message_count'] += int(r['message_count']); d['packet_chars'] += int(r['packet_chars']); d['split'] = d['split'] or int(r['window_count'])>1
          days=[{'group_day_row':k[0],'group_name':k[1],'date':k[2],**v} for k,v in by_day.items()]
          days.sort(key=lambda d:(-d['message_count'],-d['packet_chars'],d['date'],d['group_name']))

          picks=[]; used=set()
          def add(label,d):
              key=(d['group_day_row'],d['group_name'],d['date'])
              if key in used: return
              used.add(key); picks.append({'label':label,**d})
          # ranks 4-8, second split day, median, and two low-density days from distinct groups where possible
          for pos in range(3,min(8,len(days))): add(f'rank{pos+1}',days[pos])
          split_days=[d for d in days if d['split']]
          if len(split_days)>1: add('split2',split_days[1])
          add('median',days[len(days)//2])
          low_candidates=sorted(days,key=lambda d:(d['message_count'],d['packet_chars'],d['date']))
          seen_groups=set()
          for d in low_candidates:
              if d['group_name'] in seen_groups: continue
              add(f'low{len(seen_groups)+1}',d); seen_groups.add(d['group_name'])
              if len(seen_groups)>=2: break

          # Scan all packet text for deterministic-looking residuals and exact adjacent duplicate bodies.
          suspicious=defaultdict(list)
          header_re=re.compile(r'^消息(\d+) \| (.*?) \| (.*)$')
          system_time_text_re=re.compile(r'^(?:昨天|前天|星期[一二三四五六日天]|周[一二三四五六日天])?\s*(?:上午|下午|晚上|凌晨)?\s*\d{1,2}:\d{2}$')
          raw_shell_res=[
              ('file_bracket',re.compile(r'^文件\s*\[[^\]]+\]$')),
              ('video_download',re.compile(r'^视频(?:\s+下载)?\s*\d{1,2}:\d{2}(?:\s*\(.+\))?$')),
              ('listener_restart',re.compile(r'^\[监听器重启\]')),
          ]
          for r in idx:
              text=packets[r['packet_id']]
              lines=text.splitlines()
              # raw shell/time patterns
              current_header=None
              for line in lines:
                  m=header_re.match(line)
                  if m: current_header=(m.group(1),m.group(2),m.group(3)); continue
                  s=line.strip()
                  if not s: continue
                  if current_header and current_header[2] in {'[系统]','系统'} and system_time_text_re.fullmatch(s):
                      suspicious['system_time_residual'].append({'packet_id':r['packet_id'],'header':current_header,'text':s})
                  for kind,pat in raw_shell_res:
                      if pat.fullmatch(s) or (kind=='listener_restart' and pat.match(s)):
                          suspicious[kind].append({'packet_id':r['packet_id'],'header':current_header,'text':s})
              # message block parsing for adjacent exact-body duplicates / orphan labels
              blocks=[]; cur=None
              for line in lines:
                  m=header_re.match(line)
                  if m:
                      if cur: blocks.append(cur)
                      cur={'ordinal':int(m.group(1)),'time':m.group(2),'sender':m.group(3),'body':[]}
                  elif cur is not None:
                      cur['body'].append(line)
              if cur: blocks.append(cur)
              for i,b in enumerate(blocks):
                  body='\n'.join(x for x in b['body']).strip()
                  if body in {'视频','图片','文件'}:
                      suspicious['orphan_attachment_label'].append({'packet_id':r['packet_id'],'ordinal':b['ordinal'],'time':b['time'],'sender':b['sender'],'body':body})
                  if i and body and body == '\n'.join(blocks[i-1]['body']).strip() and b['time']==blocks[i-1]['time'] and b['sender']==blocks[i-1]['sender']:
                      suspicious['adjacent_exact_duplicate_message'].append({'packet_id':r['packet_id'],'ordinals':[blocks[i-1]['ordinal'],b['ordinal']],'time':b['time'],'sender':b['sender'],'body':body[:500]})

          report={
              'source_sha':'445617e33771f3f3192b856c6533ef535febb5a0',
              'summary':json.loads((out/'build_summary.json').read_text(encoding='utf-8')),
              'sample_picks':picks,
              'suspicious_counts':{k:len(v) for k,v in suspicious.items()},
              'suspicious_examples':{k:v[:30] for k,v in suspicious.items()},
          }
          (sel/'scan_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          for p in picks:
              txt='\n'.join(f"===== {pid} =====\n{packets[pid]}" for pid in p['packet_ids'])
              (sel/f"sample_{p['label']}.txt").write_text(txt,encoding='utf-8')
          (sel/'selection.json').write_text(json.dumps({'picks':picks},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Persist private inspection
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          args=(--source-root "$RUNNER_TEMP/t82-private" --source-sha 445617e33771f3f3192b856c6533ef535febb5a0 --harness-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --date "$eval_date" --evaluation research_packet_broad_content_inspection --copy scan_report.json=scan_report.json --copy selection.json=selection.json)
          for f in "$RUNNER_TEMP"/t82-private/sample_*.txt; do [ -f "$f" ] && args+=(--copy "$(basename "$f")=$(basename "$f")"); done
          python scripts/private_results_publisher.py "${args[@]}"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/t82-prepared" "$RUNNER_TEMP/t82-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
