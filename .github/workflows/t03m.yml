name: t03m

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private source commit
        required: true
        default: cef2572dceddcab02f2cc18f35c9e4dbfe3469c8
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t03m
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t03m:'))
    environment: t03m
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then source="${REQUEST_TITLE#rq:t03m:}"; harness="$REQUEST_HARNESS_SHA"; else source="$DISPATCH_SHA"; harness="$CURRENT_HARNESS_SHA"; fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha=INVALID'; exit 2; }
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_sha=INVALID'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD
      - name: Run exact private Shared Gold20 evaluation
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          L1_LLM_API_KEY: ${{ secrets.L1_LLM_API_KEY || secrets.SEALED_MODEL_SECRET_1 }}
          L1_LLM_BASE_URL: ${{ secrets.L1_LLM_BASE_URL || secrets.SEALED_MODEL_SECRET_2 }}
          L1_LLM_MODEL: ${{ secrets.L1_LLM_MODEL || secrets.SEALED_MODEL_SECRET_3 }}
          L1_LLM_TIMEOUT_SECONDS: ${{ vars.L1_LLM_TIMEOUT_SECONDS || '60' }}
          L1_LLM_MAX_RETRIES: ${{ vars.L1_LLM_MAX_RETRIES || '2' }}
          L1_LLM_RETRY_BACKOFF_SECONDS: ${{ vars.L1_LLM_RETRY_BACKOFF_SECONDS || '1' }}
          L1_LLM_MAX_COMPLETION_TOKENS: ${{ vars.L1_LLM_MAX_COMPLETION_TOKENS || '3000' }}
          L1_LLM_MAX_COMPLETION_FIELD: ${{ vars.L1_LLM_MAX_COMPLETION_FIELD || 'max_tokens' }}
          L1_LLM_DISABLE_REASONING: ${{ secrets.L1_LLM_DISABLE_REASONING || secrets.SEALED_MODEL_SECRET_4 || vars.L1_LLM_DISABLE_REASONING || 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/private_eval_runner.py" --source-sha "${{ steps.source.outputs.value }}" --plan "$RUNNER_TEMP/harness/plans/t03m.json"
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/private-eval-source" "$RUNNER_TEMP/private-eval-logs" "$RUNNER_TEMP/harness" \
                 "$RUNNER_TEMP/private-eval-askpass.sh" "$RUNNER_TEMP"/private-artifact-*.zip
