name: t78-dense-day-diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t78_dense_day_diagnostic.yml']
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: shangtang
    timeout-minutes: 30
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: df94a589270002a25a55c564f32536a056e4692d
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Rebuild inputs and write private dense-day diagnostic
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/t78-analysis"
          BUILD="$RUNNER_TEMP/t78-build"
          rm -rf "$ROOT" "$BUILD"
          mkdir -p "$ROOT"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$BUILD" >/dev/null
          python - <<'PY'
          import importlib.util, json, os, statistics
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 't78-analysis'
          build = Path(os.environ['RUNNER_TEMP']) / 't78-build'
          corpus = build / 'evidence' / 'daily_group_corpus.jsonl'
          manifest = json.loads((build / 'model_inputs' / 'manifest.json').read_text(encoding='utf-8'))
          packet_index = [json.loads(x) for x in (build / 'model_inputs' / 'packet_index.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          records = [json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]

          packet_tool = Path('private-knowledge/l1/tools/build_research_matter_window_packet.py')
          spec = importlib.util.spec_from_file_location('packet_builder', packet_tool)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          split_keys = {(r['group_id'], r['date']) for r in manifest['densest_group_days'] if r.get('split_for_budget')}
          # Defensive fallback: derive split keys from packet index if ranking truncation ever changes.
          for p in packet_index:
              if int(p.get('window_count', 1)) > 1:
                  split_keys.add((p['group_id'], p['date']))

          out_days = []
          for rec in records:
              key = (str(rec.get('group_id') or 'unknown'), str(rec.get('date') or 'unknown'))
              if key not in split_keys:
                  continue
              messages = list((rec.get('user_payload') or {}).get('messages') or [])

              # Render the whole day only for measurement by temporarily lifting the execution guard.
              old_budget = mod.MAX_MODEL_FACING_PACKET_CHARS
              mod.MAX_MODEL_FACING_PACKET_CHARS = 10**9
              try:
                  full_packet, _, full_stats = mod.build_matter_window_packet({'user_payload': {'messages': messages}}, ordinal_start=1)
              finally:
                  mod.MAX_MODEL_FACING_PACKET_CHARS = old_budget

              image_preview_chars = 0
              image_preview_kept_chars = 0
              document_preview_chars = 0
              image_attachment_count = 0
              document_attachment_count = 0
              messages_with_attachments = 0
              msg_rows = []
              hour_counts = Counter()
              text_lengths = []

              for i, msg in enumerate(messages, 1):
                  text = str(msg.get('original_text') or '')
                  text_len = len(text)
                  text_lengths.append(text_len)
                  time = str(msg.get('time') or '')
                  hour = time[11:13] if len(time) >= 13 else 'unknown'
                  hour_counts[hour] += 1
                  atts = list(msg.get('attachments') or [])
                  if atts:
                      messages_with_attachments += 1
                  msg_img_raw = msg_img_kept = msg_doc_preview = 0
                  msg_img_count = msg_doc_count = 0
                  for att in atts:
                      name = str(att.get('name') or '')
                      previews = []
                      for row in list(att.get('parsed_content') or []):
                          if isinstance(row, dict):
                              val = str(row.get('preview_content') or '').strip()
                              if val:
                                  previews.append(val)
                      preview = '\n'.join(dict.fromkeys(previews)).strip()
                      is_image = Path(name).suffix.lower() in mod._IMAGE_SUFFIXES
                      if is_image:
                          msg_img_count += 1
                          msg_img_raw += len(preview)
                          msg_img_kept += len(mod._clean_image_preview(preview)) if preview else 0
                      else:
                          msg_doc_count += 1
                          msg_doc_preview += len(preview)
                  image_preview_chars += msg_img_raw
                  image_preview_kept_chars += msg_img_kept
                  document_preview_chars += msg_doc_preview
                  image_attachment_count += msg_img_count
                  document_attachment_count += msg_doc_count
                  msg_rows.append({
                      'ordinal': i,
                      'time': time,
                      'sender': str(msg.get('sender') or ''),
                      'original_text_chars': text_len,
                      'image_attachment_count': msg_img_count,
                      'document_attachment_count': msg_doc_count,
                      'image_preview_chars_model_visible': msg_img_kept,
                      'document_preview_chars_suppressed': msg_doc_preview,
                      'rough_visible_payload_chars': text_len + msg_img_kept,
                  })

              windows = []
              for p in packet_index:
                  if p['group_id'] == key[0] and p['date'] == key[1]:
                      stats = json.loads((build / p['private_stats_path']).read_text(encoding='utf-8'))
                      windows.append({
                          'packet_id': p['packet_id'],
                          'window_no': p['window_no'],
                          'ordinal_start': p['day_message_ordinal_start'],
                          'ordinal_end': p['day_message_ordinal_end'],
                          'message_count': p['message_count'],
                          'packet_chars': p['packet_chars'],
                          'document_attachment_count': stats['document_attachment_count'],
                          'image_attachment_count': stats['image_attachment_count'],
                          'kept_image_preview_chars': stats['kept_image_preview_chars'],
                          'suppressed_document_preview_chars': stats['suppressed_document_preview_chars'],
                          'repeated_attachment_reference_count': stats['repeated_attachment_reference_count'],
                      })

              msg_rows.sort(key=lambda x: (-x['rough_visible_payload_chars'], x['ordinal']))
              out_days.append({
                  'group_id': key[0],
                  'group_name': str(rec.get('group_name') or key[0]),
                  'date': key[1],
                  'message_count': len(messages),
                  'raw_text_chars': int(rec.get('raw_text_chars') or 0),
                  'attachment_count': int(rec.get('attachment_count') or 0),
                  'attachment_preview_chars_raw_all_types': int(rec.get('attachment_preview_chars') or 0),
                  'structured_relation_count': int(rec.get('structured_relation_count') or 0),
                  'full_day_model_packet_chars_without_guard': int(full_stats['packet_chars']),
                  'budget_chars': old_budget,
                  'over_budget_chars': int(full_stats['packet_chars']) - old_budget,
                  'messages_with_attachments': messages_with_attachments,
                  'image_attachment_count': image_attachment_count,
                  'document_attachment_count': document_attachment_count,
                  'image_preview_chars_raw': image_preview_chars,
                  'image_preview_chars_model_visible': image_preview_kept_chars,
                  'document_preview_chars_suppressed': document_preview_chars,
                  'text_length_stats': {
                      'median': int(statistics.median(text_lengths)) if text_lengths else 0,
                      'max': max(text_lengths) if text_lengths else 0,
                      'messages_le_20_chars': sum(1 for n in text_lengths if n <= 20),
                      'messages_gt_100_chars': sum(1 for n in text_lengths if n > 100),
                  },
                  'messages_by_hour': dict(sorted(hour_counts.items())),
                  'split_windows': sorted(windows, key=lambda x: x['window_no']),
                  'top_message_components': msg_rows[:15],
              })

          out_days.sort(key=lambda x: (-x['full_day_model_packet_chars_without_guard'], -x['message_count']))
          result = {
              'schema_version': 'research_dense_group_day_diagnostic.v1',
              'source_sha': 'df94a589270002a25a55c564f32536a056e4692d',
              'split_group_day_count': len(out_days),
              'days': out_days,
              'note': 'Private deterministic diagnostic. No model calls; no cross-group linking.'
          }
          (root / 'dense_days.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Persist diagnostic privately
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/private_results_publisher.py \
            --source-root "$RUNNER_TEMP/t78-analysis" \
            --source-sha df94a589270002a25a55c564f32536a056e4692d \
            --harness-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --date 2026-08-19 \
            --evaluation daily_group_dense_day_diagnostic \
            --copy dense_days.json=dense_days.json | tee "$RUNNER_TEMP/t78-publish.txt"
      - name: Report public-safe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'source_sha=df94a589270002a25a55c564f32536a056e4692d'
            echo 'provider_call_count=0'
            grep -E '^(private_result_commit|private_result_path|PRIVATE_RESULT_)' "$RUNNER_TEMP/t78-publish.txt" 2>/dev/null || true
          } > "$RUNNER_TEMP/t78-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t78-dense-day-diagnostic:${GITHUB_RUN_ID}" --body-file "$RUNNER_TEMP/t78-report.txt"
