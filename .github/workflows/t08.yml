name: t08

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private source commit
        required: true
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t08-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t08:'))
    environment: deepseek
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t08:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha=INVALID'; exit 2; }
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_sha=INVALID'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Run corrected DeepSeek Matter pilot
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.L1_LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || secrets.L1_LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL || secrets.L1_LLM_MODEL }}
          L1_LLM_TIMEOUT_SECONDS: '60'
          L1_LLM_MAX_RETRIES: '2'
          L1_LLM_RETRY_BACKOFF_SECONDS: '1'
          L1_LLM_MAX_COMPLETION_TOKENS: '3000'
          L1_LLM_MAX_COMPLETION_FIELD: 'max_tokens'
          L1_LLM_DISABLE_REASONING: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/private_source_runner.py" --source-sha "${{ steps.source.outputs.value }}" --plan "$RUNNER_TEMP/harness/plans/t08.json"

      - name: Upload encrypted pilot detail
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-deepseek-matter-pilot-${{ steps.source.outputs.value }}-${{ steps.source.outputs.harness }}
          path: ${{ runner.temp }}/private-source/source/l1/evaluation/vnext/runtime/research_matter_reconstruction_pilot_detail.encrypted.b64
          if-no-files-found: ignore
          retention-days: 1

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/private-source" "$RUNNER_TEMP/private-source-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/private-source-askpass.sh"
