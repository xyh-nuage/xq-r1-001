name: t29

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private full-context baseline source commit
        required: true
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: remote-t29-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t29:'))
    environment: deepseek
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish safe run locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create --repo "${{ github.repository }}" --title "t29-full-context-tangshang-one-call-run:${{ github.run_id }}" --body "Safe locator for the single-call full-context Matter baseline using the Tangshang API key."

      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t29:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha=INVALID'; exit 2; }
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_sha=INVALID'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Prepare exact source and immutable persisted L1 attachment evidence
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/full-context-tangshang"
          repo="$root/source"
          result_commit="67389cf13187e1c768808f268173437a13552e1e"
          result_path="evaluation_results/research_slice_a_l1_attachment_materialization/2026-08-18_0c2adfff_run32096296005/candidate_db_export.json"
          expected_blob="9b95be232e3a500931f2faf03c5a238dc475c641"
          mkdir -p "$root"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t29-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"
          git -C "$repo" fetch -q --depth=1 origin "$result_commit"
          input_dir="$repo/l1/evaluation/vnext/runtime/full_context_matter_input"
          mkdir -p "$input_dir"
          git -C "$repo" show "$result_commit:$result_path" > "$input_dir/candidate_db_export.json"
          test "$(git hash-object "$input_dir/candidate_db_export.json")" = "$expected_blob"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 'tangshang_source=VERIFIED_EXACT_SHA'
          echo 'persisted_l1_attachment_input=VERIFIED_IMMUTABLE'

      - name: Run deterministic isolation gate and rehydrate L1 input
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/prepared_source_runner.py" \
            --source-dir "$RUNNER_TEMP/full-context-tangshang/source" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --plan "$RUNNER_TEMP/harness/plans/t28.json"

      - name: Verify Tangshang credential is present without calling provider
        shell: bash
        env:
          TANGSHANG_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          test -n "$TANGSHANG_API_KEY" || { echo 'LLM_API_KEY=MISSING_NO_MODEL_CALL'; exit 2; }
          test -n "$LLM_BASE_URL" || { echo 'LLM_BASE_URL=MISSING_NO_MODEL_CALL'; exit 2; }
          test -n "$LLM_MODEL" || { echo 'LLM_MODEL=MISSING_NO_MODEL_CALL'; exit 2; }
          echo 'TANGSHANG_CREDENTIAL_CONFIG_PRESENT_NO_PROVIDER_CALL_YET'

      - name: Execute exactly one full-context model HTTP call
        id: model
        shell: bash
        env:
          TANGSHANG_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SOURCE_SHA: ${{ steps.source.outputs.value }}
          HARNESS_SHA: ${{ steps.source.outputs.harness }}
        run: |
          set +e
          root="$RUNNER_TEMP/full-context-tangshang/source"
          out="$root/l1/evaluation/vnext/runtime/research_full_context_matter_baseline_tangshang"
          mkdir -p "$out"
          python - "$root" "$out" <<'PY'
          import json, os, pathlib, sys, traceback
          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          sys.path.insert(0, str(root / 'l1' / 'tools'))
          sys.path.insert(0, str(root / 'l1'))
          import run_research_full_context_matter_baseline as b

          shared = root / 'context/evaluation/company_shared_local_semantics_slice_a.jsonl'
          fixture = root / 'l1/tests/fixtures/obsolete_media_test_data.zip'
          l1db = root / 'l1/evaluation/vnext/runtime/full_context_matter_input/l1_candidate_state.db'
          silver1 = root / 'context/evaluation/continuous_slice_a_matter_gold_redraft.v1.json'
          silver2 = root / 'context/evaluation/continuous_slice_a_matter_gold_redraft.v2.json'
          source_sha = os.environ['SOURCE_SHA']

          input_document = b.build_full_context_input(
              shared_replay=shared,
              fixture_zip=fixture,
              l1_candidate_db=l1db,
              l1_run_id='run_c46e10f6833adb71',
          )
          input_path = out / 'full_context_input.json'
          b._write_json(input_path, input_document)

          invoker = b.OneShotOpenAICompatibleInvoker(
              api_key=os.environ['TANGSHANG_API_KEY'],
              base_url=os.environ['LLM_BASE_URL'],
              model_id=os.environ['LLM_MODEL'],
              timeout_seconds=180,
              max_completion_tokens=6000,
              disable_reasoning=True,
          )
          body = invoker._body(input_document['system_prompt'], input_document['user_payload'], json_retry=False)

          # USER-AUTHORIZED MODEL CALL: exactly one provider HTTP request in this workflow.
          try:
              envelope, content, elapsed_ms, request_id = invoker._call(body)
          except Exception as exc:
              failure = {
                  'schema_version': b.RESULT_SCHEMA,
                  'task_id': b.TASK_ID,
                  'status': 'MODEL_CALL_FAILED_PRE_REFERENCE',
                  'exact_source_commit': source_sha,
                  'exact_model_input': b._file_identity(input_path),
                  'provider': __import__('urllib.parse').parse.urlparse(os.environ['LLM_BASE_URL']).netloc,
                  'configured_model': os.environ['LLM_MODEL'],
                  'temperature': 0,
                  'model_call_count': 1,
                  'retry_count': 0,
                  'error': {'type': type(exc).__name__, 'message': str(exc)},
                  'silver_gold_reference_opened_before_this_file': False,
              }
              b._write_json(out / 'full_context_raw_result.json', failure)
              print('ONE_CALL_STATUS=MODEL_CALL_FAILED')
              raise SystemExit(20)

          attempt = {
              'attempt': 1,
              'request_id': request_id,
              'elapsed_ms': elapsed_ms,
              'provider_envelope': envelope,
              'raw_model_content': content,
          }
          try:
              parsed = b._parse_json(content)
          except Exception as exc:
              failure = {
                  'schema_version': b.RESULT_SCHEMA,
                  'task_id': b.TASK_ID,
                  'status': 'MODEL_RESULT_INVALID_JSON_PRE_REFERENCE',
                  'exact_source_commit': source_sha,
                  'exact_model_input': b._file_identity(input_path),
                  'provider': __import__('urllib.parse').parse.urlparse(os.environ['LLM_BASE_URL']).netloc,
                  'configured_model': os.environ['LLM_MODEL'],
                  'response_model_version': str(envelope.get('model') or os.environ['LLM_MODEL']),
                  'temperature': 0,
                  'model_call_count': 1,
                  'retry_count': 0,
                  'raw_provider_attempts': [attempt],
                  'json_error': {'type': type(exc).__name__, 'message': str(exc)},
                  'normalized_json': None,
                  'silver_gold_reference_opened_before_this_file': False,
              }
              b._write_json(out / 'full_context_raw_result.json', failure)
              print('ONE_CALL_STATUS=INVALID_JSON_NO_RETRY')
              raise SystemExit(21)

          valid_ids = {str(row['stable_id']) for row in input_document['user_payload']['messages']}
          normalized = b.normalize_model_output(parsed, valid_ids)
          usage = dict(envelope.get('usage') or {}) if isinstance(envelope.get('usage'), dict) else {}
          raw = {
              'schema_version': b.RESULT_SCHEMA,
              'task_id': b.TASK_ID,
              'status': 'MODEL_RESULT_PERSISTED_PRE_REFERENCE',
              'exact_source_commit': source_sha,
              'exact_model_input': b._file_identity(input_path),
              'provider': __import__('urllib.parse').parse.urlparse(os.environ['LLM_BASE_URL']).netloc,
              'configured_model': os.environ['LLM_MODEL'],
              'response_model_version': str(envelope.get('model') or os.environ['LLM_MODEL']),
              'system_prompt': input_document['system_prompt'],
              'temperature': 0,
              'token_usage': {
                  'prompt_tokens': b._usage_int(usage, 'prompt_tokens', 'input_tokens'),
                  'completion_tokens': b._usage_int(usage, 'completion_tokens', 'output_tokens'),
                  'total_tokens': b._usage_int(usage, 'total_tokens') or (b._usage_int(usage, 'prompt_tokens', 'input_tokens') + b._usage_int(usage, 'completion_tokens', 'output_tokens')),
                  'provider_usage': usage,
              },
              'cost': b._cost(usage, None, None),
              'model_call_count': 1,
              'json_parse_retry_count': 0,
              'retry_policy': 'strictly no retry: user authorized exactly one model call',
              'raw_provider_attempts': [attempt],
              'normalized_json': normalized,
              'silver_gold_reference_opened_before_this_file': False,
          }
          b._write_json(out / 'full_context_raw_result.json', raw)

          # Silver/Gold may only be opened after the successful raw result above exists.
          evaluation = b.run_posthoc_phase(
              output_dir=out,
              normalized=normalized,
              silver_v1_path=silver1,
              silver_v2_path=silver2,
              all_source_ids=valid_ids,
          )
          b._write_json(out / 'flat.json', b._flat(normalized, raw, evaluation))
          print('ONE_CALL_STATUS=SUCCESS')
          print('model_calls=1')
          print('json_retries=0')
          print('predicted_matters=' + str(len(normalized.get('matters') or [])))
          print('predicted_unresolved_sources=' + str(len({x for r in normalized.get('unresolved') or [] for x in r.get('source_ids') or []})))
          print('major_real_matters_found=' + str(evaluation['major_real_matters']['found_count']))
          print('major_real_matters_total=' + str(evaluation['major_real_matters']['reference_concrete_matter_count']))
          print('false_merge_matters=' + str(evaluation['false_merge']['predicted_matters_merging_multiple_certain_reference_matters']))
          print('severe_split_reference_matters=' + str(evaluation['severe_split']['reference_matters_severely_split']))
          PY
          rc=$?
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo 'success=true' >> "$GITHUB_OUTPUT"
          else
            echo 'success=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Persist one-call private evidence
        if: always() && steps.model.outcome != 'skipped'
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/full-context-tangshang/source"
          base="l1/evaluation/vnext/runtime/research_full_context_matter_baseline_tangshang"
          input="l1/evaluation/vnext/runtime/full_context_matter_input"
          eval_date="$(date -u +%F)"
          copies=(
            --copy "$base/full_context_input.json=full_context_input.json"
            --copy "$base/full_context_raw_result.json=full_context_raw_result.json"
            --copy "$input/rehydration_summary.json=rehydration_summary.json"
          )
          for name in full_context_evaluation.json full_context_evaluation.md full_context_boss_summary.md flat.json; do
            if [ -f "$root/$base/$name" ]; then copies+=(--copy "$base/$name=$name"); fi
          done
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$root" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation "research_full_context_matter_baseline_tangshang_one_call" \
            "${copies[@]}"

      - name: Enforce one-call terminal state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.model.outputs.success }}" = "true" ]; then
            echo 'RESEARCH_FULL_CONTEXT_TANGSHANG_ONE_CALL_COMPLETE'
          else
            echo 'RESEARCH_FULL_CONTEXT_TANGSHANG_ONE_CALL_ENDED_NO_RETRY'
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/full-context-tangshang" "$RUNNER_TEMP/prepared-source-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/t29-read-askpass.sh" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"