name: t29

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private full-context baseline source commit
        required: true
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: remote-t29-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t29:'))
    environment: shangtang
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish safe run locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create --repo "${{ github.repository }}" --title "t29-full-context-shangtang-one-call-run:${{ github.run_id }}" --body "Strict single-call full-context Matter baseline. Environment: shangtang. Secret: LLM_API_KEY. Provider: https://token.sensenova.cn/v1/."

      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t29:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha=INVALID'; exit 2; }
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_sha=INVALID'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Prepare exact source and immutable persisted L1 attachment evidence
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/full-context-shangtang"
          repo="$root/source"
          result_commit="67389cf13187e1c768808f268173437a13552e1e"
          result_path="evaluation_results/research_slice_a_l1_attachment_materialization/2026-08-18_0c2adfff_run32096296005/candidate_db_export.json"
          expected_blob="9b95be232e3a500931f2faf03c5a238dc475c641"
          mkdir -p "$root"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t29-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"
          git -C "$repo" fetch -q --depth=1 origin "$result_commit"
          input_dir="$repo/l1/evaluation/vnext/runtime/full_context_matter_input"
          mkdir -p "$input_dir"
          git -C "$repo" show "$result_commit:$result_path" > "$input_dir/candidate_db_export.json"
          test "$(git hash-object "$input_dir/candidate_db_export.json")" = "$expected_blob"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 'source=VERIFIED_EXACT_SHA'
          echo 'persisted_l1_attachment_input=VERIFIED_IMMUTABLE'

      - name: Run deterministic isolation gate and rehydrate L1 input
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/prepared_source_runner.py" \
            --source-dir "$RUNNER_TEMP/full-context-shangtang/source" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --plan "$RUNNER_TEMP/harness/plans/t29.json"

      - name: Verify Shangtang configuration without provider call
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL_SECRET: ${{ secrets.LLM_MODEL }}
          LLM_MODEL_VAR: ${{ vars.LLM_MODEL }}
        run: |
          set -euo pipefail
          test -n "$LLM_API_KEY" || { echo 'LLM_API_KEY=MISSING_NO_MODEL_CALL'; exit 2; }
          if [ -n "$LLM_MODEL_SECRET" ]; then
            echo "LLM_MODEL=$LLM_MODEL_SECRET" >> "$GITHUB_ENV"
          elif [ -n "$LLM_MODEL_VAR" ]; then
            echo "LLM_MODEL=$LLM_MODEL_VAR" >> "$GITHUB_ENV"
          else
            echo 'LLM_MODEL=MISSING_NO_MODEL_CALL'
            exit 2
          fi
          echo 'github_environment=shangtang'
          echo 'provider_base_url=https://token.sensenova.cn/v1/'
          echo 'SHANGTANG_CONFIG_PRESENT_NO_PROVIDER_CALL_YET'

      - name: Execute exactly one Shangtang model HTTP call
        id: model
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SOURCE_SHA: ${{ steps.source.outputs.value }}
        run: |
          set +e
          root="$RUNNER_TEMP/full-context-shangtang/source"
          out="$root/l1/evaluation/vnext/runtime/research_full_context_matter_baseline_shangtang"
          mkdir -p "$out"
          python "$RUNNER_TEMP/harness/scripts/t29_shangtang_one_call.py" "$root" "$out"
          rc=$?
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo 'success=true' >> "$GITHUB_OUTPUT"
          else
            echo 'success=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Persist one-call private evidence
        if: always() && steps.model.outcome != 'skipped'
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/full-context-shangtang/source"
          base="l1/evaluation/vnext/runtime/research_full_context_matter_baseline_shangtang"
          input="l1/evaluation/vnext/runtime/full_context_matter_input"
          eval_date="$(date -u +%F)"
          copies=(
            --copy "$base/full_context_input.json=full_context_input.json"
            --copy "$base/full_context_raw_result.json=full_context_raw_result.json"
            --copy "$input/rehydration_summary.json=rehydration_summary.json"
          )
          for name in full_context_evaluation.json full_context_evaluation.md full_context_boss_summary.md flat.json; do
            if [ -f "$root/$base/$name" ]; then copies+=(--copy "$base/$name=$name"); fi
          done
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$root" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation "research_full_context_matter_baseline_shangtang_one_call" \
            "${copies[@]}"

      - name: Report terminal state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.model.outputs.success }}" = "true" ]; then
            echo 'RESEARCH_FULL_CONTEXT_SHANGTANG_ONE_CALL_COMPLETE'
          elif [ -n "${{ steps.model.outputs.return_code }}" ]; then
            echo 'RESEARCH_FULL_CONTEXT_SHANGTANG_ONE_CALL_CONSUMED_NO_RETRY'
          else
            echo 'RESEARCH_FULL_CONTEXT_SHANGTANG_BLOCKED_BEFORE_MODEL_CALL'
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/full-context-shangtang" "$RUNNER_TEMP/prepared-source-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/t29-read-askpass.sh" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
