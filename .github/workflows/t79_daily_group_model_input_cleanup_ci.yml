name: t79-daily-group-model-input-cleanup-ci

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t79_daily_group_model_input_cleanup_ci.yml']

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4

      - name: Verify private result write access
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python scripts/private_results_preflight.py

      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 97f87ce04e9b0b2876445b52fc11e37ea5a4e427
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1

      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          cd private-knowledge
          python -m py_compile l1/tools/prepare_research_daily_group_model_inputs.py
          python -m pytest -q l1/tests/test_prepare_research_daily_group_model_inputs.py

      - name: Rebuild real model-facing corpus and validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t79-prepared"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$out" >/dev/null
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'t79-prepared'
          summary = json.loads((out/'build_summary.json').read_text(encoding='utf-8'))
          packets = sorted((out/'model_inputs/packets').glob('*.txt'))
          time_sep = re.compile(r'^消息\d+ \| (?:昨天\s+)?(?:[01]?\d|2[0-3]):[0-5]\d \| \[系统\]$', re.M)
          file_shell = re.compile(r'^文件\s*\[[^\]]+\]$', re.M)
          video_shell = re.compile(r'^视频(?:\s+下载)?\s*\d{1,2}:\d{2}(?:\s*\([^)]+\))?$', re.M)
          for path in packets:
              text = path.read_text(encoding='utf-8')
              assert '[监听器重启]' not in text, path
              assert time_sep.search(text) is None, path
              assert file_shell.search(text) is None, path
              assert video_shell.search(text) is None, path
          safe = {
              'source_group_day_count': summary['source_group_day_count'],
              'group_day_count': summary['group_day_count'],
              'source_message_count': summary['source_message_count'],
              'message_count': summary['message_count'],
              'removed_control_message_count': summary['removed_control_message_count'],
              'removed_system_time_separator_count': summary['removed_system_time_separator_count'],
              'removed_listener_restart_count': summary['removed_listener_restart_count'],
              'normalized_transport_shell_message_count': summary['normalized_transport_shell_message_count'],
              'normalized_transport_shell_chars_removed': summary['normalized_transport_shell_chars_removed'],
              'packet_count': summary['packet_count'],
              'full_day_group_day_count': summary['full_day_group_day_count'],
              'split_group_day_count': summary['split_group_day_count'],
              'provider_call_count': summary['provider_call_count'],
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          private = Path(os.environ['RUNNER_TEMP'])/'t79-private'
          private.mkdir(parents=True, exist_ok=True)
          (private/'manifest.json').write_text((out/'model_inputs/manifest.json').read_text(encoding='utf-8'), encoding='utf-8')
          (private/'build_summary.json').write_text((out/'build_summary.json').read_text(encoding='utf-8'), encoding='utf-8')
          PY

      - name: Persist private manifest
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          python scripts/private_results_publisher.py \
            --source-root "$RUNNER_TEMP/t79-private" \
            --source-sha 97f87ce04e9b0b2876445b52fc11e37ea5a4e427 \
            --harness-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation research_daily_group_model_input_cleanup \
            --copy manifest.json=manifest.json \
            --copy build_summary.json=build_summary.json

      - name: Publish safe locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t79-daily-group-cleanup:${GITHUB_RUN_ID}" \
            --body "Deterministic model-facing daily-group cleanup validation completed or attempted. No company content is included here."

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/t79-prepared" "$RUNNER_TEMP/t79-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
