name: t81-research-packet-content-fix-validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t81_research_packet_content_fix_validation.yml']

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish safe locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t81-packet-content-fix:${GITHUB_RUN_ID}" \
            --body "Private research packet cleanup validation started for exact source SHA e6f66a43d0fc329512e32043cfc74c840a60e392. No company content is included here."

      - name: Checkout public harness
        uses: actions/checkout@v4

      - name: Verify private result write access
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python scripts/private_results_preflight.py

      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: e6f66a43d0fc329512e32043cfc74c840a60e392
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1

      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q private-knowledge/l1/tests/test_prepare_research_daily_group_model_inputs.py

      - name: Rebuild real packets and assert content fixes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t81-prepared"
          sel="$RUNNER_TEMP/t81-private"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$out" >/dev/null
          mkdir -p "$sel"
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP'])/'t81-prepared'
          sel = Path(os.environ['RUNNER_TEMP'])/'t81-private'
          manifest = json.loads((out/'model_inputs/manifest.json').read_text(encoding='utf-8'))
          index = [json.loads(line) for line in (out/'model_inputs/packet_index.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          packets = {r['packet_id']:(out/'model_inputs/packets'/f"{r['packet_id']}.txt").read_text(encoding='utf-8') for r in index}
          combined = '\n'.join(packets.values())

          assert '星期二 16:44 | [系统]' not in combined
          assert '星期二 17:02 | [系统]' not in combined
          assert re.search(r'视频(?:\s+下载)?\s*\d{1,2}:\d{2}\s*\([^\n]+\)\n文件：video_', combined) is None

          dense = manifest['densest_group_days'][:5]
          first = dense[0]
          first_text = '\n'.join(packets[pid] for pid in first['packet_ids'])
          assert first_text.count('文件：20260716_Liora_271476248放行单.pdf') == 1
          assert first_text.count('文件：20260716_Liora_271476248入境证明.pdf') == 1
          holder = [pid for pid in first['packet_ids'] if '发一下COA和CIQ' in packets[pid]]
          assert len(holder) == 1
          assert 'CERTIFICATE OF ANALYSIS ORIGINAL' in packets[holder[0]]

          result = {
            'source_sha':'e6f66a43d0fc329512e32043cfc74c840a60e392',
            'summary':json.loads((out/'build_summary.json').read_text(encoding='utf-8')),
            'densest_group_days':dense,
            'coaciq_packet_id':holder[0],
          }
          (sel/'validation.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          for label, row in [('dense1',dense[0]),('dense2',dense[1]),('dense3',dense[2])]:
              text='\n'.join(f'===== {pid} =====\n{packets[pid]}' for pid in row['packet_ids'])
              (sel/f'{label}.txt').write_text(text, encoding='utf-8')
          PY

      - name: Persist private validation samples
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          python scripts/private_results_publisher.py \
            --source-root "$RUNNER_TEMP/t81-private" \
            --source-sha e6f66a43d0fc329512e32043cfc74c840a60e392 \
            --harness-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation research_packet_content_fix_validation \
            --copy validation.json=validation.json \
            --copy dense1.txt=dense1.txt \
            --copy dense2.txt=dense2.txt \
            --copy dense3.txt=dense3.txt

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/t81-prepared" "$RUNNER_TEMP/t81-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
