name: t30

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private Research Local Fact v2 source commit
        required: true
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t30-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t30:'))
    environment: shangtang
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source="${REQUEST_TITLE#rq:t30:}"
            harness="$REQUEST_HARNESS_SHA"
          else
            source="$DISPATCH_SHA"
            harness="$CURRENT_HARNESS_SHA"
          fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha=INVALID'; exit 2; }
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_sha=INVALID'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD

      - name: Verify private result write access before any model call
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/harness/scripts/private_results_preflight.py"

      - name: Run deterministic source tests
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/private_source_runner.py" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --plan "$RUNNER_TEMP/harness/plans/t30.json"

      - name: Verify frozen Shared code and restore exact Seen evidence
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/private-source/source"
          frozen="cef2572dceddcab02f2cc18f35c9e4dbfe3469c8"
          result_commit="89f664338f4a93748f19ebed3abd5649927b104c"
          predictions_path="evaluation_results/shared_local_prompt_cleanup_regression10/2026-08-12_a1917e1c_run31586557981/predictions.jsonl"
          gold_path="evaluation_results/shared_local_prompt_cleanup_regression10/2026-08-12_a1917e1c_run31586557981/gold.json"
          askpass="$RUNNER_TEMP/t30-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "$frozen"
          if ! git -C "$repo" diff --quiet "$frozen" "${{ steps.source.outputs.value }}" -- l1/l1_processor/local_semantics; then
            echo 'frozen_shared_local_semantics=MODIFIED'
            exit 3
          fi
          echo 'frozen_shared_local_semantics=UNCHANGED'
          git -C "$repo" fetch -q --depth=1 origin "$result_commit"
          input_dir="$repo/l1/evaluation/research_local_fact_v2/runtime_input"
          mkdir -p "$input_dir"
          git -C "$repo" show "$result_commit:$predictions_path" > "$input_dir/seen10_predictions.jsonl"
          git -C "$repo" show "$result_commit:$gold_path" > "$input_dir/seen10_gold.json"
          test "$(git hash-object "$input_dir/seen10_predictions.jsonl")" = "003110d14ecb5ae27e139b591dc828aea889f715"
          test "$(git hash-object "$input_dir/seen10_gold.json")" = "9897132a5e5f53244a72866ba17130725d8d7584"
          test "$(sha256sum "$input_dir/seen10_predictions.jsonl" | awk '{print $1}')" = "ccb137dd019b1385a5308f39bcb088d860bbeef08e2cfc9bce7b50da3419767b"
          test "$(sha256sum "$input_dir/seen10_gold.json" | awk '{print $1}')" = "b93e29f71b07d59822f82de26343985189e905419903e678ce824d8dc36c7f6e"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 'seen10_input=VERIFIED_IMMUTABLE'
          echo 'sealed_unseen_used=0'

      - name: Verify Shangtang model configuration
        shell: bash
        env:
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          test -n "$L1_LLM_API_KEY" || { echo 'LLM_API_KEY=MISSING_NO_MODEL_CALL'; exit 2; }
          test -n "$L1_LLM_BASE_URL" || { echo 'LLM_BASE_URL=MISSING_NO_MODEL_CALL'; exit 2; }
          test -n "$L1_LLM_MODEL" || { echo 'LLM_MODEL=MISSING_NO_MODEL_CALL'; exit 2; }
          echo 'shangtang_environment=CONFIG_PRESENT'

      - name: Run frozen baseline vs Local Fact v2 Seen comparison
        shell: bash
        env:
          L1_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          L1_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          L1_LLM_MODEL: ${{ secrets.LLM_MODEL }}
          L1_LLM_TIMEOUT_SECONDS: '180'
          L1_LLM_MAX_RETRIES: '1'
          L1_LLM_RETRY_BACKOFF_SECONDS: '1'
          L1_LLM_MAX_COMPLETION_TOKENS: '3000'
          L1_LLM_MAX_COMPLETION_FIELD: 'max_tokens'
          L1_LLM_DISABLE_REASONING: 'true'
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/private-source/source"
          input_dir="$repo/l1/evaluation/research_local_fact_v2/runtime_input"
          out="$repo/l1/evaluation/research_local_fact_v2/runtime"
          rm -rf "$out"
          python "$repo/l1/tools/run_research_local_fact_v2_seen10.py" \
            --seen-input "$input_dir/seen10_predictions.jsonl" \
            --gold "$input_dir/seen10_gold.json" \
            --manifest "$repo/l1/evaluation/research_local_fact_v2/manifest.v1.json" \
            --unresolved-diagnostic "$repo/l1/evaluation/research_local_fact_v2/unresolved_seen10_diagnostic.v1.json" \
            --output-dir "$out"

      - name: Persist detailed private evaluation result
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/private-source/source"
          date_utc="$(date -u +%F)"
          python "$RUNNER_TEMP/harness/scripts/private_results_publisher.py" \
            --source-root "$repo" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$date_utc" \
            --evaluation research_local_fact_v2_seen10 \
            --copy l1/evaluation/research_local_fact_v2/runtime/summary.json=summary.json \
            --copy l1/evaluation/research_local_fact_v2/runtime/public_metrics.json=public_metrics.json \
            --copy l1/evaluation/research_local_fact_v2/runtime/predictions.jsonl=predictions.jsonl \
            --copy l1/evaluation/research_local_fact_v2/manifest.v1.json=manifest.json \
            --copy l1/evaluation/research_local_fact_v2/unresolved_seen10_diagnostic.v1.json=unresolved_seen10_diagnostic.json

      - name: Terminal audit marker
        shell: bash
        run: |
          echo 'RESEARCH_LOCAL_FACT_V2_REMOTE_PASS'
          echo 'sealed_unseen_used=0'
          echo 'company_runtime_used=0'
          echo 'merge_performed=0'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/private-source" "$RUNNER_TEMP/private-source-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/private-source-askpass.sh" "$RUNNER_TEMP/t30-read-askpass.sh"
