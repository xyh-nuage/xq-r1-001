name: t83-research-packet-residual-fix-validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/t83_research_packet_residual_fix_validation.yml']

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish safe locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t83-packet-residual-fix:${GITHUB_RUN_ID}" \
            --body "Private packet residual cleanup validation started for exact source SHA c13c8a26cafd9b5cd7dd0157a79d269f19ec8a41. No company content is included here."

      - name: Checkout public harness
        uses: actions/checkout@v4

      - name: Verify private result write access
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python scripts/private_results_preflight.py

      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: c13c8a26cafd9b5cd7dd0157a79d269f19ec8a41
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1

      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q private-knowledge/l1/tests/test_prepare_research_daily_group_model_inputs.py

      - name: Rebuild real packets and assert residual fixes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t83-prepared"
          sel="$RUNNER_TEMP/t83-private"
          python private-knowledge/l1/tools/prepare_research_daily_group_model_inputs.py \
            --db private-knowledge/l0_state.db \
            --output-dir "$out" >/dev/null
          mkdir -p "$sel"
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP'])/'t83-prepared'
          sel = Path(os.environ['RUNNER_TEMP'])/'t83-private'
          summary = json.loads((out/'build_summary.json').read_text(encoding='utf-8'))
          index = [json.loads(x) for x in (out/'model_inputs/packet_index.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          packets = {r['packet_id']:(out/'model_inputs/packets'/f"{r['packet_id']}.txt").read_text(encoding='utf-8') for r in index}
          combined = '\n'.join(packets.values())

          assert summary['schema_version'] == 'research_daily_group_model_inputs_summary.v4'
          assert re.search(r'消息\d+ \| (?:\d{1,2}月\d{1,2}日) \d{1,2}:\d{2} \| \[系统\]\n(?:\d{1,2}月\d{1,2}日) \d{1,2}:\d{2}', combined) is None
          assert '语音6"秒未播放' not in combined
          assert '语音（未转写，6秒）' in combined
          assert '\n消息24 | 2026-07-16 11:12:00 | 杨森🍀℡\n视频\n' not in combined

          # Adjacent exact duplicate system events should be gone, but human repetition stays.
          header = re.compile(r'^消息(\d+) \| (.*?) \| (.*)$')
          duplicate_system = []
          for pid, text in packets.items():
              blocks=[]; cur=None
              for line in text.splitlines():
                  m=header.match(line)
                  if m:
                      if cur: blocks.append(cur)
                      cur={'time':m.group(2),'sender':m.group(3),'body':[]}
                  elif cur is not None:
                      cur['body'].append(line)
              if cur: blocks.append(cur)
              for a,b in zip(blocks, blocks[1:]):
                  if a['sender'] in {'system','系统','[系统]'} and b['sender'] in {'system','系统','[系统]'} and a['time']==b['time'] and '\n'.join(a['body']).strip() == '\n'.join(b['body']).strip():
                      duplicate_system.append((pid,a['time'],a['sender']))
          assert not duplicate_system
          human_repeat = '@Winter🍥\u2005亲，6.15货转的这个，是从6.16收下家仓储么'
          assert combined.count(human_repeat) >= 2

          # Same-send generated filename prefix should collapse to one canonical file mention.
          median_candidates = [r for r in index if r['group_name']=='群聊_新创~诚泰通合作群' and r['date']=='2026-07-01']
          assert len(median_candidates) == 1
          median = packets[median_candidates[0]['packet_id']]
          assert median.count('文件：诚泰通新创267179079结算单.pdf') == 1
          assert '20260701_南风知意，二小常欢_诚泰通新创267179079结算单.pdf' not in median
          assert '7月1日 11:22 | [系统]' not in median

          # Same image represented once as an attachment and once as quote relation keeps relation but not a second preview.
          q_candidates = [r for r in index if r['group_name']=='群聊_新创-中泰大佑木薯淀粉' and r['date']=='2026-07-08']
          qtext = '\n'.join(packets[r['packet_id']] for r in q_candidates)
          qblocks=[]; cur=None
          for line in qtext.splitlines():
              m=header.match(line)
              if m:
                  if cur: qblocks.append(cur)
                  cur={'head':line,'body':[]}
              elif cur is not None:
                  cur['body'].append(line)
          if cur: qblocks.append(cur)
          related=[b for b in qblocks if 'a06198ec2263e747.jpg' in '\n'.join(b['body'])]
          assert len(related) == 2
          assert sum('图片内容：' in '\n'.join(b['body']) for b in related) == 1
          assert any('图片引用 Bonn 的消息' in '\n'.join(b['body']) for b in related)

          # Second dense split day should now cut at the natural idle gap, keeping COA request and production certificate together.
          split_candidates = [r for r in index if r['group_name']=='群聊_新创-中泰大佑木薯淀粉' and r['date']=='2026-07-09']
          assert len(split_candidates) == 2
          holder = [r for r in split_candidates if '我想看看coa和生产日期' in packets[r['packet_id']]]
          assert len(holder) == 1
          assert 'CERTIFICATE OF PRODUCTION' in packets[holder[0]['packet_id']]
          assert summary['natural_gap_split_boundary_count'] >= 1

          report = {
            'source_sha':'c13c8a26cafd9b5cd7dd0157a79d269f19ec8a41',
            'summary':summary,
            'median_packet_id':median_candidates[0]['packet_id'],
            'july9_packet_ids':[r['packet_id'] for r in split_candidates],
            'july9_coa_holder':holder[0]['packet_id'],
          }
          (sel/'validation.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          (sel/'median.txt').write_text(median, encoding='utf-8')
          (sel/'july8.txt').write_text(qtext, encoding='utf-8')
          (sel/'july9.txt').write_text('\n'.join(f"===== {r['packet_id']} =====\n{packets[r['packet_id']]}" for r in split_candidates), encoding='utf-8')
          PY

      - name: Persist private validation samples
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          eval_date="$(date -u +%F)"
          python scripts/private_results_publisher.py \
            --source-root "$RUNNER_TEMP/t83-private" \
            --source-sha c13c8a26cafd9b5cd7dd0157a79d269f19ec8a41 \
            --harness-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --date "$eval_date" \
            --evaluation research_packet_residual_fix_validation \
            --copy validation.json=validation.json \
            --copy median.txt=median.txt \
            --copy july8.txt=july8.txt \
            --copy july9.txt=july9.txt

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/t83-prepared" "$RUNNER_TEMP/t83-private" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
