name: t63-status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t63_status.yml']
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report t63 status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow t63_matter_window_repeat_attachment_ci.yml --limit 1 --json databaseId,status,conclusion,headSha,createdAt,updatedAt)"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t63-status:${GITHUB_RUN_ID}" --body "$body"
