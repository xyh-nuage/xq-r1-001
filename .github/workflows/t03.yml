name: t03

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private source commit
        required: true
        default: cef2572dceddcab02f2cc18f35c9e4dbfe3469c8
        type: string
  workflow_run:
    workflows: [rq]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: remote-t03
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'rq:t03:'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve source and harness SHAs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then source="${REQUEST_TITLE#rq:t03:}"; harness="$REQUEST_HARNESS_SHA"; else source="$DISPATCH_SHA"; harness="$CURRENT_HARNESS_SHA"; fi
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha=INVALID'; exit 2; }
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || { echo 'harness_sha=INVALID'; exit 2; }
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD
      - name: Validate exact private source
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/private_source_runner.py" --source-sha "${{ steps.source.outputs.value }}" --plan "$RUNNER_TEMP/harness/plans/t03.json"
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/private-source" "$RUNNER_TEMP/private-source-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/private-source-askpass.sh"
