name: t51-status-probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t51_status_probe.yml']
permissions:
  actions: read
  issues: write
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect t51 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow t51_immutable_first48_low3000_delayed_retry.yml --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt > /tmp/t51.json
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t51-status:${GITHUB_RUN_ID}" --body "$(cat /tmp/t51.json)"
