name: t35-posthoc-human-packet-silver-compare

on:
  push:
    paths:
      - '.github/workflows/t35_posthoc_human_packet_silver_compare.yml'

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare persisted model matters to Silver v2 (no provider call)
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/t35"
          repo="$root/knowledge"
          mkdir -p "$root"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t35-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0

          source_sha="687f557f98b45c8cf934a91278c15939b1072e9d"
          result_sha="b8e0ad288cd80fe9a4e6c84c12838681077fed9f"
          result_base="evaluation_results/research_full_context_human_packet_shangtang_one_call/2026-08-19_687f557f_run32212922246"
          git -C "$repo" fetch -q --depth=1 origin "$source_sha"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          git -C "$repo" fetch -q --depth=1 origin "$result_sha"
          git -C "$repo" show "$result_sha:$result_base/full_context_raw_result.json" > "$root/raw.json"
          git -C "$repo" show "$result_sha:$result_base/human_context_map.json" > "$root/map.json"
          cp "$repo/context/evaluation/continuous_slice_a_matter_gold_redraft.v1.json" "$root/v1.json"
          cp "$repo/context/evaluation/continuous_slice_a_matter_gold_redraft.v2.json" "$root/v2.json"

          python - "$root" <<'PY' > "$root/report.json"
          import json, sys
          from itertools import combinations
          from pathlib import Path
          from collections import Counter, defaultdict

          root = Path(sys.argv[1])
          raw = json.loads((root/'raw.json').read_text(encoding='utf-8'))
          mapping = json.loads((root/'map.json').read_text(encoding='utf-8'))
          v1 = json.loads((root/'v1.json').read_text(encoding='utf-8'))
          v2 = json.loads((root/'v2.json').read_text(encoding='utf-8'))

          text = raw['raw_model_content']
          key = '"matters"'
          pos = text.index(key)
          colon = text.index(':', pos) + 1
          while colon < len(text) and text[colon].isspace(): colon += 1
          matters, _ = json.JSONDecoder().raw_decode(text[colon:])

          ordinal_to_stable = {int(k): v['stable_id'] for k,v in mapping['ordinal_to_source'].items()}
          pred = {}
          for m in matters:
              mid = m['matter_id']
              ords = [int(x) for x in m.get('messages', [])]
              pred[mid] = {ordinal_to_stable[o] for o in ords if o in ordinal_to_stable}

          remap = v2['resolution_from_v1']['group_remap']
          conf_override = {x['stable_key']: x['to'] for x in v2['resolution_from_v1'].get('confidence_overrides', [])}
          assignments = {}
          for a in v1['assignments']:
              sid = a['stable_key']
              group = remap.get(a['group'], a['group'])
              conf = conf_override.get(sid, a['confidence'])
              assignments[sid] = {'group':group, 'confidence':conf}

          core = {
              g['id'] for g in v2['primary_groups']
              if str(g.get('kind','')).startswith('concrete_business_matter')
          }
          # A4/U1 deliberately excluded; core should be A1,A2,A3,A6,A8.

          def gold_sets(mode):
              out = defaultdict(set)
              for sid,a in assignments.items():
                  if a['group'] not in core: continue
                  if mode == 'strict' and a['confidence'] != 'certain': continue
                  if mode == 'broad' and a['confidence'] == 'provenance_only': continue
                  out[a['group']].add(sid)
              return dict(out)

          def matrix(mode):
              gs = gold_sets(mode)
              # Universe for strict is strict core only. Broad uses all non-provenance core plus all non-core pred members for FP accounting in per-model rows.
              rows = {}
              for mid,ps in pred.items():
                  counts = Counter()
                  strict_counts = Counter()
                  broad_counts = Counter()
                  noncore = 0
                  for sid in ps:
                      a = assignments.get(sid)
                      if not a: continue
                      if a['group'] in core:
                          if a['confidence'] == 'certain': strict_counts[a['group']] += 1
                          if a['confidence'] != 'provenance_only': broad_counts[a['group']] += 1
                      else:
                          noncore += 1
                      if mode == 'strict':
                          if a['group'] in core and a['confidence'] == 'certain': counts[a['group']] += 1
                      else:
                          if a['group'] in core and a['confidence'] != 'provenance_only': counts[a['group']] += 1
                  best = counts.most_common(1)[0][0] if counts else None
                  rows[mid] = {
                      'predicted_message_count': len(ps),
                      'best_gold': best,
                      'strict_core_counts': dict(sorted(strict_counts.items())),
                      'broad_core_counts': dict(sorted(broad_counts.items())),
                      'noncore_or_excluded_count': noncore,
                  }
              return rows, gs

          strict_rows, strict_gold = matrix('strict')
          broad_rows, broad_gold = matrix('broad')

          # Choose mapping by max broad overlap, one model matter per best gold (natural here).
          model_to_gold = {}
          used = set()
          for mid in sorted(pred):
              overlaps = sorted(((len(pred[mid] & s), gid) for gid,s in broad_gold.items()), reverse=True)
              for n,gid in overlaps:
                  if n and gid not in used:
                      model_to_gold[mid] = gid; used.add(gid); break
              if mid not in model_to_gold and overlaps and overlaps[0][0]:
                  model_to_gold[mid] = overlaps[0][1]

          gold_coverage = {}
          for gid,gset in broad_gold.items():
              best_mid = None; best_n = 0
              for mid,ps in pred.items():
                  n = len(ps & gset)
                  if n > best_n: best_n=n; best_mid=mid
              gold_coverage[gid] = {
                  'broad_total': len(gset),
                  'best_model_matter': best_mid,
                  'captured': best_n,
                  'recall': round(best_n/len(gset), 4) if gset else None,
                  'strict_total': len(strict_gold.get(gid,set())),
                  'strict_captured_by_best': len(pred.get(best_mid,set()) & strict_gold.get(gid,set())) if best_mid else 0,
              }

          # Message-level after best mapping, on broad core labels only.
          pred_label = {}
          duplicate_pred_members = []
          for mid,ps in pred.items():
              gid = model_to_gold.get(mid)
              if not gid: continue
              for sid in ps:
                  if sid in pred_label and pred_label[sid] != gid:
                      duplicate_pred_members.append(sid)
                  pred_label[sid] = gid
          broad_core_sids = {sid for sid,a in assignments.items() if a['group'] in core and a['confidence']!='provenance_only'}
          strict_core_sids = {sid for sid,a in assignments.items() if a['group'] in core and a['confidence']=='certain'}
          broad_correct = sum(pred_label.get(sid)==assignments[sid]['group'] for sid in broad_core_sids)
          strict_correct = sum(pred_label.get(sid)==assignments[sid]['group'] for sid in strict_core_sids)

          # Pairwise cluster quality. Include all 83 predicted members for precision; gold-positive pairs only within core.
          def pairset(clusters):
              out=set()
              for members in clusters.values():
                  ordered=sorted(members)
                  out.update(combinations(ordered,2))
              return out
          pred_pairs = pairset(pred)
          broad_gold_pairs = pairset(broad_gold)
          strict_gold_pairs = pairset(strict_gold)
          def prf(gold_pairs):
              tp=len(pred_pairs & gold_pairs)
              fp=len(pred_pairs - gold_pairs)
              fn=len(gold_pairs - pred_pairs)
              p=tp/(tp+fp) if tp+fp else 0
              r=tp/(tp+fn) if tp+fn else 0
              f=2*p*r/(p+r) if p+r else 0
              return {'tp':tp,'fp':fp,'fn':fn,'precision':round(p,4),'recall':round(r,4),'f1':round(f,4)}

          # Exact contamination details only as ordinals, not text/stable IDs.
          stable_to_ord = {v:k for k,v in ordinal_to_stable.items()}
          contamination = {}
          for mid,ps in pred.items():
              best = broad_rows[mid]['best_gold']
              bad=[]
              for sid in ps:
                  a=assignments.get(sid)
                  if not a: continue
                  if a['group'] != best:
                      bad.append({'ordinal':stable_to_ord.get(sid), 'silver_group':a['group'], 'confidence':a['confidence']})
              contamination[mid]=sorted(bad,key=lambda x:(x['ordinal'] or 999))

          report = {
              'raw_finish_reason': ((raw.get('provider_envelope') or {}).get('choices') or [{}])[0].get('finish_reason'),
              'model_matter_count': len(pred),
              'core_silver_groups': sorted(core),
              'model_to_gold_best_mapping': model_to_gold,
              'per_model_matter': broad_rows,
              'gold_coverage': gold_coverage,
              'message_level': {
                  'strict_core_total': len(strict_core_sids), 'strict_correct': strict_correct,
                  'strict_accuracy': round(strict_correct/len(strict_core_sids),4) if strict_core_sids else None,
                  'broad_core_total': len(broad_core_sids), 'broad_correct': broad_correct,
                  'broad_accuracy': round(broad_correct/len(broad_core_sids),4) if broad_core_sids else None,
                  'duplicate_pred_members_count': len(duplicate_pred_members),
              },
              'pairwise_broad_core_vs_all_predicted_pairs': prf(broad_gold_pairs),
              'pairwise_strict_core_vs_all_predicted_pairs': prf(strict_gold_pairs),
              'contamination_by_model_matter': contamination,
              'notes': [
                  'A4 and U1 excluded from concrete Matter gold metrics.',
                  'v2 remaps A5->A1 and A7->A1 before comparison.',
                  'Strict uses certain only; broad uses certain+probable and excludes provenance_only.',
                  'Raw output ended by length; matters array was complete and parsed, but non_matter/unresolved was incomplete.'
              ]
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "t35-posthoc-human-packet-silver-compare:${GITHUB_RUN_ID}" \
            --body "Deterministic post-hoc comparison only. No provider/model call.\n\n\`\`\`json\n$(cat "$root/report.json")\n\`\`\`"
          rm -rf "$root" "$askpass"
