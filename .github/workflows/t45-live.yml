name: t45-context-memory-membership-routing-live-replay
run-name: t45:${{ github.event.workflow_run.display_title || 'registration' }}

on:
  workflow_run:
    workflows: [rq45]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-t45-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.display_title, 'rq:t45:')
    environment: deepseek
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve exact private source and frozen public harness
        id: source
        shell: bash
        env:
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUEST_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          source="${REQUEST_TITLE#rq:t45:}"
          harness="$REQUEST_HARNESS_SHA"
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$harness" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "value=$source" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source"
          echo "harness_sha=$harness"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout frozen public harness
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/t45-harness"
          git init -q "$harness"
          git -C "$harness" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$harness" fetch -q --depth=1 origin "${{ steps.source.outputs.harness }}"
          git -C "$harness" checkout -q --detach FETCH_HEAD
          test "$(git -C "$harness" rev-parse HEAD)" = "${{ steps.source.outputs.harness }}"

      - name: Verify private result write access before model calls
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: python "$RUNNER_TEMP/t45-harness/scripts/private_results_preflight.py"

      - name: Checkout exact private source
        shell: bash
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t45-source"
          git init -q "$repo"
          git -C "$repo" remote add origin "https://github.com/xyh-nuage/knowledge.git"
          askpass="$RUNNER_TEMP/t45-read-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$KNOWLEDGE_READ_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git -C "$repo" fetch -q --depth=1 origin "${{ steps.source.outputs.value }}"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "${{ steps.source.outputs.value }}"
          rm -f "$askpass"
          unset KNOWLEDGE_READ_TOKEN GIT_ASKPASS
          echo 'private_source=VERIFIED_EXACT_SHA'

      - name: Recheck exact source before paid calls
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t45-source"
          cd "$repo"
          python -m pip install -q -e 'l1[dev]'
          python -m py_compile \
            l1/l1_processor/context_memory/membership_routing.py \
            l1/l1_processor/context_memory/membership_model_provider.py \
            l1/evaluation/context_memory_business_replay/run_replay.py \
            l1/evaluation/context_memory_business_replay/evaluate_replay.py
          python -m pytest -q \
            l1/tests/context_memory/test_membership_routing.py \
            l1/tests/context_memory/test_business_replay_adapter.py
          export PYTHONPATH="$PWD/l1:$PWD"
          python l1/evaluation/context_memory_business_replay/run_replay.py \
            --research-root l1/evaluation/research_current_effective_state_full_matter \
            --validate-inputs

      - name: Verify SenseTime DeepSeek configuration
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          test -n "$LLM_API_KEY" || { echo 'LLM_API_KEY=MISSING_NO_MODEL_CALL'; exit 2; }
          test -n "$LLM_BASE_URL" || { echo 'LLM_BASE_URL=MISSING_NO_MODEL_CALL'; exit 2; }
          test "$LLM_MODEL" = 'deepseek-v4-flash' || { echo 'LLM_MODEL=UNEXPECTED_NO_MODEL_CALL'; exit 2; }
          echo 'sensetime_deepseek_environment=CONFIG_PRESENT'
          echo 'model=deepseek-v4-flash'

      - name: Run six fresh private business replay cases once each
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t45-source"
          root="$repo/l1/evaluation/research_current_effective_state_full_matter"
          out="$repo/l1/evaluation/vnext/runtime/context_memory_business_replay_v1"
          rm -rf "$out"
          mkdir -p "$out/predictions" "$out/safe" "$out/db"
          export PYTHONPATH="$repo/l1:$repo"
          for case_id in U1 U2 U3 U4 D2 D1; do
            python "$repo/l1/evaluation/context_memory_business_replay/run_replay.py" \
              --research-root "$root" \
              --case "$case_id" \
              --db "$out/db/$case_id.sqlite" \
              --output-json "$out/predictions/$case_id.json" \
              --safe-summary "$out/safe/$case_id.json" \
              >"$out/$case_id.stdout.safe.log"
            cat "$out/$case_id.stdout.safe.log"
          done
          python - "$out" "${{ steps.source.outputs.value }}" "${{ steps.source.outputs.harness }}" "${{ github.run_id }}" <<'PY'
          import json, pathlib, sys
          out=pathlib.Path(sys.argv[1])
          rows={c:json.loads((out/'safe'/f'{c}.json').read_text(encoding='utf-8')) for c in ('U1','U2','U3','U4','D2','D1')}
          run={
              'schema_version':'context_memory.business_replay.run.v1',
              'source_sha':sys.argv[2],
              'harness_sha':sys.argv[3],
              'public_run_id':int(sys.argv[4]),
              'provider_environment':'deepseek',
              'provider_route':'SenseTime',
              'model':'deepseek-v4-flash',
              'reasoning_effort':'medium',
              'temperature':0,
              'cases':['U1','U2','U3','U4','D2','D1'],
              'case_runs':6,
              'repeats_per_case':1,
              'logical_model_calls':sum(int(v.get('logical_model_calls',0)) for v in rows.values()),
              'reference_runtime_input':False,
              'safe_case_summaries':rows,
          }
          (out/'RUN.json').write_text(json.dumps(run,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Persist private predictions before reference evaluation
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t45-source"
          base="l1/evaluation/vnext/runtime/context_memory_business_replay_v1"
          copies=(
            --copy "$base/RUN.json=RUN.json"
            --copy "l1/evaluation/context_memory_business_replay/REPORT_PROTOCOL.md=REPORT_PROTOCOL.md"
          )
          for case_id in U1 U2 U3 U4 D2 D1; do
            copies+=(--copy "$base/predictions/$case_id.json=predictions/$case_id.json")
            copies+=(--copy "$base/safe/$case_id.json=safe/$case_id.json")
          done
          date_utc="$(date -u +%F)"
          python "$RUNNER_TEMP/t45-harness/scripts/private_results_publisher.py" \
            --source-root "$repo" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$date_utc" \
            --evaluation context_memory_business_replay_predictions_v1 \
            "${copies[@]}"

      - name: Evaluate only after all predictions are fixed
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t45-source"
          root="$repo/l1/evaluation/research_current_effective_state_full_matter"
          out="$repo/l1/evaluation/vnext/runtime/context_memory_business_replay_v1"
          export PYTHONPATH="$repo/l1:$repo"
          python "$repo/l1/evaluation/context_memory_business_replay/evaluate_replay.py" \
            --predictions-dir "$out/predictions" \
            --research-root "$root" \
            --output-json "$out/evaluation.json" \
            --safe-summary "$out/evaluation.safe.json" \
            >"$out/evaluation.stdout.safe.log"
          cat "$out/evaluation.stdout.safe.log"

      - name: Publish safe aggregate audit
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t45-source"
          out="$repo/l1/evaluation/vnext/runtime/context_memory_business_replay_v1"
          python - "$out" <<'PY'
          import json, pathlib, sys
          out=pathlib.Path(sys.argv[1])
          cases={c:json.loads((out/'safe'/f'{c}.json').read_text(encoding='utf-8')) for c in ('U1','U2','U3','U4','D2','D1')}
          evaluation=json.loads((out/'evaluation.safe.json').read_text(encoding='utf-8'))
          safe={
              'cases':cases,
              'evaluation':evaluation,
              'fresh_case_runs':6,
              'logical_model_calls':sum(int(v.get('logical_model_calls',0)) for v in cases.values()),
              'reference_runtime_input_to_model':0,
              'raw_chat_bodies_emitted_to_public_log':0,
              'raw_model_outputs_emitted_to_public_log':0,
          }
          print('CONTEXT_MEMORY_BUSINESS_REPLAY_SAFE_AUDIT='+json.dumps(safe,sort_keys=True,separators=(',',':')))
          PY

      - name: Persist private reference-isolated evaluation
        shell: bash
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t45-source"
          base="l1/evaluation/vnext/runtime/context_memory_business_replay_v1"
          date_utc="$(date -u +%F)"
          python "$RUNNER_TEMP/t45-harness/scripts/private_results_publisher.py" \
            --source-root "$repo" \
            --source-sha "${{ steps.source.outputs.value }}" \
            --harness-sha "${{ steps.source.outputs.harness }}" \
            --run-id "${{ github.run_id }}" \
            --date "$date_utc" \
            --evaluation context_memory_business_replay_evaluation_v1 \
            --copy "$base/RUN.json=RUN.json" \
            --copy "$base/evaluation.json=evaluation.json" \
            --copy "$base/evaluation.safe.json=evaluation.safe.json" \
            --copy "l1/evaluation/context_memory_business_replay/REPORT_PROTOCOL.md=REPORT_PROTOCOL.md"

      - name: Classify provider execution gate
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/t45-source"
          out="$repo/l1/evaluation/vnext/runtime/context_memory_business_replay_v1"
          python - "$out" <<'PY'
          import json, pathlib, sys
          out=pathlib.Path(sys.argv[1])
          failed=[]
          for case_id in ('U1','U2','U3','U4','D2','D1'):
              p=json.loads((out/'predictions'/f'{case_id}.json').read_text(encoding='utf-8'))
              if p.get('outcome',{}).get('status') == 'PROVIDER_FAILED':
                  audit=p.get('audit') or []
                  failed.append({'case_id':case_id,'error_category':audit[-1].get('error_category') if audit else 'UNKNOWN'})
          print('provider_failed_cases='+json.dumps(failed,sort_keys=True,separators=(',',':')))
          if failed:
              raise SystemExit(3)
          print('provider_execution_gate=PASS')
          PY

      - name: Terminal audit marker
        if: success()
        shell: bash
        run: |
          echo 'CONTEXT_MEMORY_BUSINESS_REPLAY_SENSETIME_EXECUTION_PASS'
          echo 'source_sha=${{ steps.source.outputs.value }}'
          echo 'fresh_case_runs=6'
          echo 'model=deepseek-v4-flash'
          echo 'reference_runtime_input_to_model=0'
          echo 'raw_private_content_public_log=0'
          echo 'merge_performed=0'

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/t45-source" "$RUNNER_TEMP/t45-harness" "$RUNNER_TEMP/t45-read-askpass.sh" "$RUNNER_TEMP/private-results-publish" "$RUNNER_TEMP/private-results-preflight" "$RUNNER_TEMP/private-results-askpass.sh" "$RUNNER_TEMP/private-results-preflight-askpass.sh"
