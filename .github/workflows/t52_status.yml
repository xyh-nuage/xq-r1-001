name: t52-status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t52_status.yml']
permissions:
  actions: read
  issues: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow t52_immutable_first48_low5000.yml --limit 1 --json databaseId,status,conclusion,headSha,createdAt,updatedAt)"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t52-status:${GITHUB_RUN_ID}" --body "$body"
