name: t72-daily-group-canonical-all-observed
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t72_daily_group_canonical_all_observed.yml']
permissions:
  contents: read
  issues: write
jobs:
  export:
    runs-on: ubuntu-latest
    environment: shangtang
    timeout-minutes: 30
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v4
      - name: Checkout exact private research source
        uses: actions/checkout@v4
        with:
          repository: xyh-nuage/knowledge
          ref: 01375a97e1717b2d3f223a2513eaf6b108f915e6
          token: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
          path: private-knowledge
          fetch-depth: 1
      - name: Verify source and corpus tests
        run: |
          set -euo pipefail
          test "$(git -C private-knowledge rev-parse HEAD)" = "01375a97e1717b2d3f223a2513eaf6b108f915e6"
          python -m pip install -q pytest
          python -m pytest -q \
            private-knowledge/l0/tests/test_export_research_daily_group_corpus.py \
            private-knowledge/l0/tests/test_canonicalize_research_daily_group_corpus_groups.py \
            private-knowledge/l0/tests/test_shard_research_daily_group_corpus.py
      - name: Export canonical all-observed corpus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t72/shards"
          python private-knowledge/l0/tools/export_research_daily_group_corpus.py \
            --db private-knowledge/l0_state.db \
            --include-missing \
            --output-jsonl "$RUNNER_TEMP/t72/raw_all_observed.jsonl" \
            --manifest "$RUNNER_TEMP/t72/raw_manifest.json"
          python private-knowledge/l0/tools/canonicalize_research_daily_group_corpus_groups.py \
            --input-jsonl "$RUNNER_TEMP/t72/raw_all_observed.jsonl" \
            --input-manifest "$RUNNER_TEMP/t72/raw_manifest.json" \
            --db private-knowledge/l0_state.db \
            --output-jsonl "$RUNNER_TEMP/t72/daily_group_corpus.jsonl" \
            --output-manifest "$RUNNER_TEMP/t72/daily_group_manifest.json" \
            | tee "$RUNNER_TEMP/t72/canonicalize_summary.txt"
          python private-knowledge/l0/tools/shard_research_daily_group_corpus.py \
            --input-jsonl "$RUNNER_TEMP/t72/daily_group_corpus.jsonl" \
            --output-dir "$RUNNER_TEMP/t72/shards" \
            --manifest "$RUNNER_TEMP/t72/daily_group_manifest.json" \
            --max-shard-bytes 4000000 \
            | tee "$RUNNER_TEMP/t72/shard_summary.txt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'t72'
          m=json.loads((root/'daily_group_manifest.json').read_text(encoding='utf-8'))
          c=m['group_identity_canonicalization']
          public={k:m[k] for k in ['source_messages_total_rows','source_messages_selected_rows','source_messages_missing_in_latest_snapshot','group_count','group_day_count','date_start','date_end','missing_day_message_count','cross_group_structured_relations_dropped']}
          public['include_missing_snapshot_rows']=m['include_missing_snapshot_rows']
          public['group_count_before_canonicalization']=m['group_count_before_canonicalization']
          public['group_day_count_before_canonicalization']=m['group_day_count_before_canonicalization']
          public['remapped_message_count']=c['remapped_message_count']
          public['unresolved_group_identity_count']=len(c['unresolved_raw_group_ids'])
          public['ambiguous_name_key_count']=len(c['ambiguous_normalized_name_keys'])
          public['corpus_bytes']=(root/'daily_group_corpus.jsonl').stat().st_size
          public['shard_count']=m['corpus_persistence']['shard_count']
          public['max_persisted_shard_bytes']=max(s['bytes'] for s in m['corpus_persistence']['shards'])
          (root/'public_summary.json').write_text(json.dumps(public,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Persist private canonical corpus
        env:
          KNOWLEDGE_RESULTS_WRITE_TOKEN: ${{ secrets.KNOWLEDGE_RESULTS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          copy_args=(
            --copy daily_group_manifest.json=daily_group_manifest.json
            --copy public_summary.json=public_summary.json
          )
          for path in "$RUNNER_TEMP"/t72/shards/daily_group_corpus.part-*.jsonl; do
            name=$(basename "$path")
            cp "$path" "$RUNNER_TEMP/t72/$name"
            copy_args+=(--copy "$name=$name")
          done
          python scripts/private_results_publisher.py \
            --source-root "$RUNNER_TEMP/t72" \
            --source-sha 01375a97e1717b2d3f223a2513eaf6b108f915e6 \
            --harness-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --date 2026-08-19 \
            --evaluation research_daily_group_canonical_all_observed_t72 \
            "${copy_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/t72-persist.log"
      - name: Report public-safe summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'source_sha=01375a97e1717b2d3f223a2513eaf6b108f915e6'
            echo 'provider_call_count=0'
            cat "$RUNNER_TEMP/t72/public_summary.json" 2>/dev/null || true
            echo
            cat "$RUNNER_TEMP/t72-persist.log" 2>/dev/null | grep -E 'private_result_commit=|private_result_path=|PRIVATE_RESULT_PERSIST_PASS' || true
          } > "$RUNNER_TEMP/t72-report.txt"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t72-daily-group-canonical-all-observed:${GITHUB_RUN_ID}" --body-file "$RUNNER_TEMP/t72-report.txt"
