name: t72-status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t72_status.yml']
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report latest t72 status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow t72_daily_group_canonical_all_observed.yml --limit 1 --json databaseId,status,conclusion,headSha,createdAt,updatedAt > /tmp/status.json
          gh issue create --repo "$GITHUB_REPOSITORY" --title "t72-status:${GITHUB_RUN_ID}" --body "$(cat /tmp/status.json)"
