name: ark-deepseek-smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ark_deepseek_smoke.yml'

permissions:
  contents: read
  issues: write

env:
  ARK_ENDPOINT: https://ark.cn-beijing.volces.com/api/v3/responses
  ARK_MODEL: deepseek-v3-2-251201

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: ark
    timeout-minutes: 5
    steps:
      - name: Call Ark DeepSeek once and publish safe result
        shell: bash
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          FALLBACK_API_KEY: ${{ secrets.LLM_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          key="${ARK_API_KEY:-${FALLBACK_API_KEY:-}}"
          summary_file="$(mktemp)"
          body_file="$(mktemp)"
          rc=0

          if [ -z "$key" ]; then
            printf '%s\n' 'ark_api_key=MISSING' > "$summary_file"
            rc=2
          else
            http_code="$(curl -sS -o "$body_file" -w '%{http_code}' \
              "$ARK_ENDPOINT" \
              -H "Authorization: Bearer $key" \
              -H 'Content-Type: application/json' \
              -d "{\"model\":\"$ARK_MODEL\",\"input\":\"hello\"}")" || rc=$?

            if [ "$rc" -eq 0 ]; then
              python - "$http_code" "$body_file" > "$summary_file" <<'PY' || rc=$?
import json, sys
code = sys.argv[1]
path = sys.argv[2]
raw = open(path, 'r', encoding='utf-8').read()
print(f'http_status={code}')
try:
    obj = json.loads(raw)
except Exception:
    print('json_parse=FAIL')
    print(raw[:1200])
    raise SystemExit(1)

if code != '200':
    print('request=FAIL')
    err = obj.get('error', obj)
    print(json.dumps(err, ensure_ascii=False)[:2000])
    raise SystemExit(1)

print('request=PASS')
print('response_model=' + str(obj.get('model')))
print('response_status=' + str(obj.get('status')))
texts = []
for item in obj.get('output', []) or []:
    for part in item.get('content', []) or []:
        if part.get('type') == 'output_text' and part.get('text'):
            texts.append(part['text'])
print('output_text=' + (' '.join(texts)[:500] if texts else '<none>'))
PY
            fi
          fi

          cat "$summary_file"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "ark-deepseek-smoke:${GITHUB_RUN_ID}" \
            --body "$(cat "$summary_file")"
          rm -f "$summary_file" "$body_file"
          exit "$rc"
