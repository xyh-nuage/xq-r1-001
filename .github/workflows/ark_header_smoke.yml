name: ark-header-smoke

# probe-version: 3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ark_header_smoke.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ark
    timeout-minutes: 10
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - name: Probe Ark Coding Plan routed model
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' | tee /tmp/ark_smoke.txt
          import json, os, urllib.error, urllib.request
          key=(os.getenv('LLM_API_KEY') or '').strip()
          if key.lower().startswith('bearer '): key=key[7:].strip()
          headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','Accept':'application/json'}
          def call(name, endpoint, payload):
              req=urllib.request.Request(endpoint,data=json.dumps(payload).encode(),method='POST',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=60) as resp:
                      obj=json.loads(resp.read().decode())
                      if 'choices' in obj:
                          text=(((obj.get('choices') or [{}])[0].get('message') or {}).get('content') or '')
                      else:
                          text=' '.join(p.get('text','') for i in obj.get('output',[]) or [] for p in i.get('content',[]) or [] if p.get('type')=='output_text')
                      print(f'case={name} status={resp.status} PASS reply={text[:160]!r}')
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')[:700].replace('\n',' ')
                  print(f'case={name} status={e.code} FAIL error={body!r}')
          call('coding_chat_ark_code_latest','https://ark.cn-beijing.volces.com/api/coding/v3/chat/completions',{'model':'ark-code-latest','messages':[{'role':'user','content':'hello'}],'max_tokens':32,'stream':False})
          call('coding_responses_ark_code_latest','https://ark.cn-beijing.volces.com/api/coding/v3/responses',{'model':'ark-code-latest','input':'hello'})
          PY
      - name: Publish sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="$(cat /tmp/ark_smoke.txt 2>/dev/null || printf '%s\n' 'no probe output')"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "ark-routed-model-smoke:${GITHUB_RUN_ID}" --body "\`\`\`text
          $body
          \`\`\`"
