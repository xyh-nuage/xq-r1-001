name: t01

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: exact private source commit
        required: true
        default: 0505a2e9dd98c0136f640dd1265e2b5eb43bfbb3
        type: string

permissions:
  contents: read

concurrency:
  group: remote-t01
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Checkout fixed public harness
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/harness" checkout -q --detach FETCH_HEAD
      - name: Validate exact private source
        env:
          KNOWLEDGE_READ_TOKEN: ${{ secrets.KNOWLEDGE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/harness/scripts/private_source_runner.py" --source-sha "${{ inputs.source_sha }}" --plan "$RUNNER_TEMP/harness/plans/t01.json"
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/private-source" "$RUNNER_TEMP/private-source-logs" "$RUNNER_TEMP/harness" "$RUNNER_TEMP/knowledge-askpass.sh"
